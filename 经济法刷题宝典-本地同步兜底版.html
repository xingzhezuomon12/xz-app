<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.wrap{max-width:1160px;margin:0 auto;padding:14px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:20px;margin:0}.pill{font-size:12px;border-radius:999px;padding:5px 9px;background:#eef2ff;color:#3730a3;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.grid{display:grid;grid-template-columns:320px 1fr;gap:16px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(16,24,40,.06);padding:16px}
label{font-size:13px;color:var(--muted);display:block;margin:12px 0 6px}input,select,button{font:inherit}input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--text)}button{border:0;border-radius:12px;padding:10px 13px;background:var(--brand);color:#fff;cursor:pointer;font-weight:700}button:hover{background:var(--brand2)}button.secondary{background:#eef2ff;color:#1d4ed8}button.secondary:hover{background:#dbeafe}button.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}button.ghost:hover{background:#f9fafb}button:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px}.stat b{font-size:20px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.small{font-size:12px}.danger{color:var(--bad)}.oktext{color:var(--ok)}.sync{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.5px}

.result{border-radius:14px;padding:13px;margin-top:12px;line-height:1.65}.result.ok{background:#f0fdf4;border:1px solid #bbf7d0}.result.bad{background:#fef2f2;border:1px solid #fecaca}.explain{white-space:pre-wrap;margin-top:8px}.footerbar{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}.progress{height:9px;border-radius:99px;background:#e5e7eb;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}.hidden{display:none!important}
.listbox{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:10px}.minirow{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}.minirow:last-child{border-bottom:0}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.syncbox{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:14px;padding:10px;margin-top:10px}

<body>
<header><div class="wrap top"><h1>经济法刷题宝典</h1><span class="pill" id="countPill">共 394 题</span></div></header>
<main class="wrap grid">
<aside class="card">
  <div class="muted">Firestore 云同步 / 本地同步码双模式</div>
  <label>Firebase 配置状态</label><div id="fbStatus" class="small">正在初始化...</div>
  <label>同步码</label><input id="syncCode" class="sync" placeholder="例如：JF-2026-8888">
  <div class="row" style="margin-top:8px"><button id="connectBtn">连接同步码</button><button class="ghost" id="newCodeBtn">生成同步码</button></div>
  <div class="syncbox muted">优先使用 Firestore 云同步；如果 Firebase 不可用或连接失败，会自动切换为本地同步码模式。本地模式下，同一设备/同一浏览器输入同一同步码可恢复进度；云端恢复后会继续尝试同步。</div>

  <label>章节</label><select id="chapterSel"></select>
  <label>题型分类</label><select id="typeSel"><option value="all">全部题型</option><option value="single">单选题</option><option value="multiple">多选题</option><option value="judge">判断题</option><option value="indefinite">不定项/案例题</option></select>
  <label>练习模式</label><select id="modeSel"><option value="seq">顺序练习</option><option value="random">随机练习</option><option value="wrong">只练错题</option><option value="fav">只练收藏</option><option value="unanswered">只练未做</option></select>
  <label>关键词搜索</label><input id="searchBox" placeholder="搜索题干/选项/解析">
  <div class="toolbar" style="margin-top:12px"><button class="secondary" id="restartBtn">按筛选开始</button><button class="ghost" id="resetLocalBtn">清空本地</button></div>
  <div class="toolbar" style="margin-top:8px"><button class="ghost" id="exportBtn">导出进度</button><button class="ghost" id="resetCloudBtn">清空同步码</button></div>
  <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
  <div class="stats">
    <div class="stat"><b id="doneNum">0</b><div class="muted">已做</div></div>
    <div class="stat"><b id="rightRate">0%</b><div class="muted">正确率</div></div>
    <div class="stat"><b id="wrongNum">0</b><div class="muted">错题</div></div>
    <div class="stat"><b id="favNum">0</b><div class="muted">收藏</div></div>
  </div>
  <label>章节统计</label><div id="chapterStats" class="listbox"></div>
</aside>
<section class="card">
  <div class="progress"><i id="bar"></i></div>
  <div class="meta"><span class="pill" id="qType"></span><span class="pill" id="qChapter"></span><span class="pill" id="qIndex"></span><span class="pill" id="qId"></span></div>
  <div id="stem" class="stem"></div>
  <div id="options"></div>
  <div id="result" class="hidden"></div>
  <div class="footerbar">
    <div class="row"><button id="submitBtn">提交答案</button><button class="secondary" id="nextBtn">下一题</button><button class="ghost" id="favBtn">收藏</button></div>
    <div class="row"><button class="ghost" id="prevBtn">上一题</button><button class="ghost" id="showBtn">看答案</button></div>
  </div>
  <p class="muted">多选题按“答案集合”判定，支持 A/B/C/D 四项全选正确，不限制最多选择数量，也不会选 1 个就立刻判错；点击“提交答案”后才判定。</p>
</section>
</main>

const QUESTIONS = [{"id":"q0001","chapter":"第1章","type":"single","stem":"下列规范性文件中，效力最高的是（\n）。","options":{"A":"全国人民代表大会发布的《中华人民共和国民法典》","B":"财政部发布的《会计基础工作规范》","C":"国务院发布的《中华人民共和国企业所得税法实施条例》","D":"北京市人民代表大会发布的《北京市制定地方性法规条例》"},"answer":["A"],"explanation":"选项A 属于法律，选项B 属于部门规章，选项C 属于行政法规，选项D 属于地\n方性法规。其效力等级排序为：①宪法＞法律＞行政法规＞部门规章；②宪法＞\n法律＞行政法规＞地方性法规＞本级和下级地方政府规章。因此本题效力等级最\n高的为法律（选项A）。"},{"id":"q0002","chapter":"第1章","type":"single","stem":"下列关于法的效力等级的排序中，正确的是（\n）。","options":{"A":"宪法＞法律＞行政法规＞地方性法规","B":"宪法＞法律＞地方性法规＞行政法规","C":"法律＞宪法＞地方性法规＞行政法规","D":"法律＞宪法＞行政法规＞地方性法规"},"answer":["A"],"explanation":"效力等级排序：宪法＞法律＞行政法规＞地方性法规＞本级和下级地方政府规\n章。"},{"id":"q0003","chapter":"第1章","type":"single","stem":"下列关于法的效力冲突及其解决方式的表述中，不正确的是（\n）。","options":{"A":"法律之间对同一事项的新的一般规定与旧的特别规定不一致，不能确定如何适\n用时，由全国人民代表大会常务委员会裁决","B":"行政法规之间对同一事项的新的一般规定与旧的特别规定不一致，不能确定如\n何适用时，由国务院裁决","C":"地方性法规与部门规章之间对同一事项的规定不一致，不能确定如何适用时，\n由国务院裁决","D":"根据授权制定的法规与法律规定不一致，不能确定如何适用时，由全国人民代\n表大会常务委员会裁决"},"answer":["C"],"explanation":"选项C，地方性法规与部门规章之间对同一事项的规定不一致，不能确定如何适\n用时，由国务院提出意见，国务院认为应当适用地方性法规的，应当决定在该地\n方适用地方性法规的规定；认为应当适用部门规章的，应当提请全国人民代表大\n会常务委员会裁决。"},{"id":"q0004","chapter":"第1章","type":"single","stem":"张某与甲公司签订了一份价款为10 万元的电脑买卖合同，双方约定甲公司于4\n月10 日交货，张某于甲公司交货后的5 日内付清全部价款。下列选项中，属于\n法律关系主体的是（\n）。","options":{"A":"电脑","B":"张某和甲公司","C":"张某要求甲公司4 月10 日交货的权利","D":"甲公司要求张某按时付清全部价款的权利"},"answer":["B"],"explanation":"法律关系主体，是指参加法律关系，依法享有权利和承担义务的当事人。本题中\n法律关系的主体为张某和甲公司。"},{"id":"q0005","chapter":"第1章","type":"single","stem":"下列选项中，不能作为法律关系客体的是（\n）。","options":{"A":"网络虚拟财产","B":"企业经营数据","C":"有价证券","D":"人的整体"},"answer":["D"],"explanation":"选项A、B，属于法律关系客体中的“信息、数据、网络虚拟财产”；选项C，属于\n法律关系客体中的“物”；选项D，“人的整体”只能是法律关系的主体，不能作为\n法律关系的客体。"},{"id":"q0006","chapter":"第1章","type":"single","stem":"下列各项中，属于法律事件中的相对事件的是（\n）。","options":{"A":"地震","B":"爆发战争","C":"纵火","D":"行政命令"},"answer":["B"],"explanation":"选项A，属于法律事件中的绝对事件；选项C、D，属于法律行为。"},{"id":"q0007","chapter":"第1章","type":"single","stem":"中国注册会计师协会，属于下列各项中的（\n）。","options":{"A":"特别法人","B":"非营利法人","C":"营利法人","D":"非法人组织"},"answer":["B"],"explanation":"法人分为营利法人、非营利法人和特别法人。其中非营利法人包括事业单位、社\n会团体、基金会、社会服务机构等。中国注册会计师协会属于社会团体，是非营\n利法人（选项B）。"},{"id":"q0008","chapter":"第1章","type":"single","stem":"下列选项中，属于非营利法人的是（\n）。","options":{"A":"机关法人","B":"农村集体经济组织法人","C":"基金会","D":"合伙企业"},"answer":["C"],"explanation":"选项A、B，属于特别法人；选项D，属于非法人组织。"},{"id":"q0009","chapter":"第1章","type":"single","stem":"下列属于特别法人的是（\n）。","options":{"A":"事业单位法人","B":"机关法人","C":"有限责任公司","D":"个人独资企业"},"answer":["B"],"explanation":"机关法人（选项B）、农村集体经济组织法人、城镇农村的合作经济组织法人、\n基层群众性自治组织法人为特别法人。"},{"id":"q0010","chapter":"第1章","type":"single","stem":"下列主体中，属于非法人组织的是（\n）。","options":{"A":"合伙企业","B":"有限责任公司","C":"基金会","D":"农村集体经济组织"},"answer":["A"],"explanation":"本题考查法律主体小范围：非法人组织主要包括个人独资企业、合伙企业（选项\nA）等。有限责任公司（选项B）是以营利为目的，属于营利法人——公司制营\n利法人；基金会（选项C），是以公益为目的，不向出资人、设立人或会员分配\n所取得利润的法人，属于非营利法人；农村集体经济组织（选项D）主要承担社\n会管理职能，属于特别法人。"},{"id":"q0011","chapter":"第1章","type":"single","stem":"根据刑事法律制度的规定，承担刑事责任的最低年龄为（\n）。","options":{"A":"8 周岁","B":"14 周岁","C":"12 周岁","D":"16 周岁"},"answer":["C"],"explanation":"对于一般自然人来说，只要达到一定的年龄，生理和智力发育正常，就具有了相\n应的辨认和控制自己行为的能力，从而具有刑事责任能力。根据《刑法修正案十\n一》的规定，自2021 年3 月1 日起，承担刑事责任的最低年龄为12 周岁。"},{"id":"q0012","chapter":"第1章","type":"single","stem":"下列法律责任形式中，属于行政处罚的是（\n）。","options":{"A":"记过","B":"开除","C":"降级","D":"罚款"},"answer":["D"],"explanation":"行政责任分为行政处罚和行政处分；选项A、B、C，均属于行政处分。"},{"id":"q0013","chapter":"第1章","type":"single","stem":"张某故意销毁会计资料，被市财政局要求5 年内不能从事会计工作，属于法\n律责任中的（\n）。","options":{"A":"行政处罚","B":"民事责任","C":"刑事责任","D":"行政处分"},"answer":["A"],"explanation":"行政机关（市财政局）依法对外部相对人（张某）予以惩戒的行为，属于行政处\n罚，选项A 当选。"},{"id":"q0014","chapter":"第1章","type":"multiple","stem":"关于法的本质与特征的下列表述中，正确的有（\n）。","options":{"A":"法由统治阶级的物质生活条件所决定","B":"法体现的是统治阶级的整体意志和根本利益","C":"法是由国家制定或认可的行为规范","D":"法由国家强制力保障其实施"},"answer":["A","B","C","D"],"explanation":"本题考查法的本质与特征。选项A、B，属于法的本质；选项C、D，属于法的特\n征。"},{"id":"q0015","chapter":"第1章","type":"multiple","stem":"下列选项中，属于法律事实的有（\n）。","options":{"A":"签发票据","B":"签订合同","C":"地震","D":"重大政策变更"},"answer":["A","B","C","D"],"explanation":"法律事实包含法律事件、法律行为和事实行为。选项A、B，属于法律行为；选\n项C、D，属于法律事件。"},{"id":"q0016","chapter":"第1章","type":"multiple","stem":"下列选项中，属于法律行为的有（\n）。","options":{"A":"王某和李某签订了一份采购合同","B":"某市发生地震灾害","C":"某企业接受委托运输一批货物","D":"钱某拾得一部手机"},"answer":["A","C"],"explanation":"选项B，属于法律事件中的绝对事件；选项D，属于事实行为。"},{"id":"q0017","chapter":"第1章","type":"multiple","stem":"下列行为中属于法律规定的事实行为的有（\n）。","options":{"A":"遗失物的拾得行为","B":"紧急避险行为","C":"无因管理行为","D":"违约行为"},"answer":["A","B","C","D"],"explanation":"事实行为包括：无因管理行为、正当防卫行为、紧急避险行为以及侵权行为、违\n约行为、遗失物的拾得行为、埋藏物的发现行为等。"},{"id":"q0018","chapter":"第1章","type":"multiple","stem":"下列关于法人的表述中，不正确的有（\n）。","options":{"A":"法人分为营利法人、非营利法人和特别法人","B":"社会服务机构属于非营利法人","C":"事业单位属于特别法人","D":"个体工商户属于非法人组织"},"answer":["C","D"],"explanation":"选项C，事业单位是国家为了社会公益目的而举办的组织，属于非营利法人；选\n项D，个体工商户既不是法人也不是非法人组织，它是自然人性质的“商自然人”。"},{"id":"q0019","chapter":"第1章","type":"multiple","stem":"有关法人主体的下列说法中，错误的有（\n）。","options":{"A":"法人权力机构对法定代表人代表权的限制，可以对抗善意相对人","B":"法定代表人因执行职务造成他人损害的，由法定代表人承担民事责任","C":"法人被宣告破产的，清算结束时，法人终止","D":"法人的分支机构只能以法人的名义从事民事活动"},"answer":["A","B","C","D"],"explanation":"法人章程或者法人权力机构对法定代表人代表权的限制，不得对抗善意相对人，\n所以A 错；法定代表人因执行职务造成他人损害的，由法人承担民事责任，所\n以B 错；法人被宣告破产的，依法进行破产清算并完成法人注销登记时，法人终\n止，所以C 错；分支机构以自己的名义从事民事活动，产生的民事责任由法人\n承担；也可以先以该分支机构管理的财产承担，不足以承担的，由法人承担，所\n以选项D 错。"},{"id":"q0020","chapter":"第1章","type":"multiple","stem":"下列各项中，可以成为法律关系主体的有（\n）。","options":{"A":"个人独资企业","B":"未成年人","C":"基金会","D":"DeepSeek 智能机器人"},"answer":["A","B","C"],"explanation":"选项A，属于非法人组织；选项B，属于自然人（不论民事行为能力如何，不论\n国籍如何，均可成为我国法律关系的主体）；选项C，属于非营利法人；选项D，\n只能成为法律关系的客体。"},{"id":"q0021","chapter":"第1章","type":"multiple","stem":"下列关于自然人民事行为能力的表述中，正确的有（\n）。","options":{"A":"14 周岁的李某，以自己的劳动收入为主要生活来源，视为完全民事行为能力\n人","B":"7 周岁的王某，不能辨认自己行为，是限制民事行为能力人","C":"18 周岁的周某，能辨认自己行为，是完全民事行为能力人","D":"20 周岁的赵某，不能辨认自己行为，是无民事行为能力人"},"answer":["C","D"],"explanation":"选项A，16 周岁以上（≥16 周岁）的未成年人（＜18 周岁），以自己的劳动收\n入为主要生活来源的，视为完全民事行为能力人。14 周岁的李某不满16 周岁，\n属于限制民事行为能力人。选项B，8 周岁以上（≥8 周岁）的未成年人（＜18\n周岁）或者不能完全辨认自己行为的成年人属于限制民事行为能力人，7 周岁的\n王某属于无民事行为能力人。选项C，18 周岁以上（≥18 周岁）属于完全民事\n行为能力人。选项D，不能辨认自己行为的成年人属于无民事行为能力人。"},{"id":"q0022","chapter":"第1章","type":"multiple","stem":"下列自然人中，属于限制民事行为能力人的有（\n）。","options":{"A":"杨某，13 周岁，系大学少年班在校大学生","B":"范某，20 周岁，有精神障碍，不能辨认自己的行为","C":"孙某，7 周岁，不能辨认自己的行为","D":"周某，15 周岁，系体操队专业运动员"},"answer":["A","D"],"explanation":"选项B、C，属于无民事行为能力人。"},{"id":"q0023","chapter":"第1章","type":"multiple","stem":"赵某12 周岁，系某中学一年级学生，下列行为中，可以由赵某独立实施的有\n（\n）。","options":{"A":"到便利店购买一套15 元的文具","B":"在网上购买一辆50 000 元的自行车","C":"接受爷爷赠予的学习机","D":"与诊所签订一份视力矫正手术协议，费用10 000 元"},"answer":["A","C"],"explanation":"赵某属于限制民事行为能力人，可以独立实施纯获利益的民事法律行为（选项C）\n或者与其年龄、智力、精神健康状况相适应的民事法律行为（选项A）。"},{"id":"q0024","chapter":"第1章","type":"multiple","stem":"下列犯罪主体中，刑事处罚可以从轻的有（\n）。","options":{"A":"又聋又哑的人","B":"尚未完全丧失辨认自己行为能力的精神病人","C":"醉酒的人","D":"故意犯罪的已满75 周岁的人"},"answer":["A","B","D"],"explanation":"选项A，又聋又哑的人或者盲人犯罪，可以从轻、减轻或者免除处罚；选项B，\n尚未完全丧失辨认或者控制自己行为能力的精神病人犯罪的，应当负刑事责任，\n但是可以从轻或者减轻处罚；选项C，醉酒的人犯罪，应当负刑事责任；选项D，\n已满75 周岁的人故意犯罪的，可以从轻或者减轻处罚。"},{"id":"q0025","chapter":"第1章","type":"multiple","stem":"下列法律责任形式中，属于民事责任的有（\n）。","options":{"A":"支付违约金","B":"罚款","C":"没收财产","D":"恢复原状"},"answer":["A","D"],"explanation":"选项B，属于行政责任；选项C，属于刑事责任。"},{"id":"q0026","chapter":"第1章","type":"multiple","stem":"下列法律责任形式中，属于刑事责任的有（\n）。","options":{"A":"记过","B":"赔礼道歉","C":"拘役","D":"罚金"},"answer":["C","D"],"explanation":"选项A，属于行政责任中的行政处分；选项B，属于民事责任。"},{"id":"q0027","chapter":"第1章","type":"multiple","stem":"下列刑事责任形式中，属于主刑的有（\n）。","options":{"A":"拘役","B":"驱逐出境","C":"无期徒刑","D":"罚金"},"answer":["A","C"],"explanation":"刑事责任中主刑主要有管制、拘役、有期徒刑、无期徒刑、死刑。刑事责任中附\n加刑主要有罚金、没收财产、驱逐出境、剥夺政治权利。选项B、D，属于附加\n刑。"},{"id":"q0028","chapter":"第1章","type":"judge","stem":"机关法人被撤销，且没有继任的机关法人的，其民事权利和义务由作出撤销决\n定的机关法人享有和承担。（\n）","options":{"A":"正确","B":"错误"},"answer":["A"],"explanation":"机关法人被撤销的，法人终止，其民事权利和义务由继任的机关法人享有和承担；\n没有继任的机关法人的，由作出撤销决定的机关法人享有和承担。"},{"id":"q0029","chapter":"第2章","type":"single","stem":"根据会计法律制度的规定，下列行为中属于伪造会计资料的是（\n）。","options":{"A":"用挖补的手段改变会计凭证和会计账簿的真实内容","B":"由于过失导致会计凭证与会计账簿记录不一致","C":"以虚假的经济业务编制会计凭证和会计账簿","D":"用涂改的手段改变会计凭证和会计账簿的真实内容"},"answer":["C"],"explanation":"伪造会计资料，包括伪造会计凭证和会计账簿，是以虚假的经济业务为前提来编\n制会计凭证和会计账簿，旨在以假充真；变造会计资料，包括变造会计凭证和会\n计账簿，是用涂改、拼接、挖补等手段改变会计凭证和会计账簿的真实内容，以\n歪曲事实真相。选项B，过失不属于伪造和变造的内容；选项A、D，属于变造\n会计资料。"},{"id":"q0030","chapter":"第2章","type":"single","stem":"根据会计法律制度的规定，下列关于会计凭证的表述中，正确的是（\n）。","options":{"A":"原始凭证必须来源于单位外部","B":"除日期外，原始凭证记载的内容不得涂改","C":"对不真实的原始凭证，会计人员有权拒绝接受","D":"单位负责人应当在打印出的机制记账凭证上签名或盖章"},"answer":["C"],"explanation":"选项A，原始凭证既有来自单位外部的，也有单位自制的；选项B，原始凭证记\n载的各项内容均不得涂改；选项D，实行会计电算化的单位，应当在打印出的机\n制记账凭证上签名或盖章的人员包括制单人员、审核人员、记账人员及会计机构\n负责人（会计主管人员），不包括单位负责人。"},{"id":"q0031","chapter":"第2章","type":"single","stem":"甲公司出纳刘某在为员工孙某办理业务时，发现采购发票上所注金额错误，经\n查是销货单位填写单价错误，刘某采取的下列措施符合会计法律制度规定的是\n（\n）。","options":{"A":"由孙某写出说明，并加盖公司公章后入账","B":"将发票退给孙某，由销货单位重新开具发票后入账","C":"将总金额更正后入账","D":"将单价更正后入账"},"answer":["B"],"explanation":"本题考核原始凭证填写错误的处理。根据规定，原始凭证金额有错误的，应当由\n出具单位重开（选项B），不得在原始凭证上更正。"},{"id":"q0032","chapter":"第2章","type":"single","stem":"下列会计资料不属于会计档案的是（\n）。","options":{"A":"记账凭证","B":"会计档案移交清册","C":"年度财务计划","D":"银行对账单"},"answer":["C"],"explanation":"会计档案包括：（1）会计凭证，包括原始凭证、记账凭证（选项A）；（2）会计\n账簿，包括总账、明细账、日记账、固定资产卡片及其他辅助性账簿；（3）财务\n会计报告，包括月度、季度、半年度、年度财务会计报告；（4）其他会计资料，\n包括银行存款余额调节表、银行对账单（选项D）、纳税申报表、会计档案移交\n清册（选项B）、会计档案保管清册、会计档案销毁清册、会计档案鉴定意见书\n及其他具有保存价值的会计资料。但是各单位的预算、计划（选项C）、制度等\n文件材料属于文书档案，不属于会计档案。"},{"id":"q0033","chapter":"第2章","type":"single","stem":"根据会计法律制度的规定，下列关于会计档案管理的表述中，正确的是（\n）。","options":{"A":"会计档案的保管期限从会计年度的最后一天算起","B":"单位的预算方案属于会计档案","C":"当年形成的会计档案，可由单位会计管理机构临时保管4 年","D":"单位会计管理机构临时保管会计档案期间，出纳人员不得兼管会计档案"},"answer":["D"],"explanation":"会计档案的保管期限从会计年度终了后的第一天算起，选项A 错误；各单位的\n预算、计划、制度等文件材料属于文书档案，不属于会计档案，选项B 错误；当\n年形成的会计档案，在会计年度终了后，可由单位会计管理机构临时保管“1 年”，\n再移交单位档案管理机构保管。因工作需要确需推迟移交的，应当经单位档案管\n理机构同意。单位会计管理机构临时保管会计档案最长不超过3 年，选项C 错\n误。"},{"id":"q0034","chapter":"第2章","type":"single","stem":"根据会计法律制度的规定，会计档案的鉴定工作应由（\n）牵头组织进行。","options":{"A":"单位档案管理机构","B":"单位会计管理机构","C":"单位审计机构","D":"单位纪检监察机构"},"answer":["A"],"explanation":"根据会计法律制度的规定，会计档案的鉴定工作应由单位档案管理机构（选项A）\n牵头组织进行。"},{"id":"q0035","chapter":"第2章","type":"single","stem":"在我国，单位内部会计监督的主体一般是指（\n）。","options":{"A":"财政、税务、审计机关","B":"注册会计师及其事务所","C":"本单位的会计机构和会计人员","D":"本单位的内部生产车间管理人员"},"answer":["C"],"explanation":"我国单位内部会计监督的主体是各单位的会计机构和会计人员（选项C）。"},{"id":"q0036","chapter":"第2章","type":"single","stem":"根据会计法律制度的规定，下列行为中，属于会计工作政府监督的是（\n）。","options":{"A":"个人检举会计违法行为","B":"会计师事务所对单位经济活动进行审计","C":"单位内部会计机构审核本单位会计账簿","D":"财政部门对各单位的会计工作进行监督检查"},"answer":["D"],"explanation":"本题考查会计监督中的政府监督。政府监督的主体是财政（选项D）、审计、税\n务、金融管理等部门。"},{"id":"q0037","chapter":"第2章","type":"single","stem":"甲代理记账机构正在招聘主管代理记账业务的负责人，下列人员中，符合该职\n位条件的是（\n）。","options":{"A":"具有助理会计师专业技术职务资格的专职从业人员赵某","B":"从事会计工作5 年的兼职从业人员孙某","C":"具有会计师专业技术职务资格的专职从业人员钱某","D":"从事会计工作2 年的专职从业人员李某"},"answer":["C"],"explanation":"主管代理记账业务的负责人应具有会计师以上专业技术职务资格或者从事会计\n工作不少于3 年，且为专职从业人员。选项A，助理会计师专业技术职务资格不\n符合要求；选项B，虽从事会计工作年限符合要求，但兼职从业人员不符合要求；\n选项D，没有会计师专业技术职务资格且从事会计工作的年限也不符合要求。"},{"id":"q0038","chapter":"第2章","type":"single","stem":"根据会计法律制度的规定，下列人员中，可以担任企业会计机构负责人的是\n（\n）。","options":{"A":"取得中级会计专业技术资格并从事会计工作1 年6 个月的张某","B":"中专毕业并从事会计工作2 年6 个月的刘某","C":"研究生毕业并从事会计工作1 年的李某","D":"取得初级会计专业技术资格并从事会计工作2 年的王某"},"answer":["A"],"explanation":"担任企业会计机构负责人应当具备会计师以上专业技术职务资格或者从事会计\n工作3 年以上。选项A，中级会计专业技术资格对应的职称为会计师，因此张某\n满足担任企业会计机构负责人的职称要求；选项B、C、D，不具备会计师以上\n专业技术职务资格，且从事会计工作不足3 年，因此不能担任企业会计机构负责\n人。"},{"id":"q0039","chapter":"第2章","type":"single","stem":"下列关于总会计师的表述中，正确的是（\n）。","options":{"A":"总会计师是单位负责人","B":"所有大、中型企业必须设置总会计师","C":"总会计师由具有会计师以上专业技术资格的人员担任","D":"总会计师直接对单位审计机构负责"},"answer":["C"],"explanation":"选项A、D，总会计师是主管本单位会计工作的行政领导，是单位行政领导成员，\n协助单位主要行政领导人工作，直接对单位主要行政领导人负责；选项B，“国有\n的和国有资本占控股地位或者主导地位的”大、中型企业必须设置总会计师。"},{"id":"q0040","chapter":"第2章","type":"single","stem":"对因会计违法行为被追究刑事责任的会计人员，（\n）不得从事会计工作。","options":{"A":"终身","B":"5 年内","C":"10 年内","D":"15 年内"},"answer":["A"],"explanation":"因有提供虚假财务会计报告，做假账，隐匿或者故意销毁会计凭证、会计账簿、\n财务会计报告，贪污，挪用公款，职务侵占等与会计职务有关的违法行为被依法\n追究刑事责任的人员，不得再从事会计工作。"},{"id":"q0041","chapter":"第2章","type":"single","stem":"下列关于会计专业技术人员继续教育的表述中，错误的是（\n）。","options":{"A":"国家机关、企业、事业单位以及社会团体等组织不具有会计专业资格但从事会\n计工作的人员有接受继续教育的义务","B":"专业科目包括会计专业技术人员从事会计工作应当掌握的财务会计、管理会\n计、财务管理、财税金融等相关专业知识","C":"不具有会计专业技术资格但从事会计工作的人员应当自从事会计工作的次年\n开始参加继续教育","D":"会计专业技术人员参加继续教育的时间每年不少于90 学时，其中，专业科目\n一般不少于总学时的2/3"},"answer":["D"],"explanation":"选项D，会计专业技术人员参加继续教育实行学分制管理。每年会计专业技术人\n员参加继续教育取得的学分不少于90 学分，其中，专业科目一般不少于总学分\n的2/3。"},{"id":"q0042","chapter":"第2章","type":"single","stem":"根据《中华人民共和国会计法》的规定，单位随意变更会计处理方法的，由\n县级以上人民政府财政部门责令限期改正，情节严重的，对单位可以并处（\n）。","options":{"A":"20 万元以下的罚款","B":"100 万元以下的罚款","C":"20 万元以上100 万元以下的罚款","D":"5 万元以上20 万元以下的罚款"},"answer":["C"],"explanation":"根据《中华人民共和国会计法》的规定，对随意变更会计处理方法的单位，由县\n级以上人民政府财政部门责令限期改正，给予警告、通报批评，情节严重的，对\n单位可以并处20 万元以上100 万元以下的罚款。"},{"id":"q0043","chapter":"第2章","type":"multiple","stem":"根据会计法律制度的规定，下列关于会计工作管理体制的说法，正确的有\n（\n）。","options":{"A":"国务院财政部门主管全国的会计工作","B":"会计主管人员对本单位的会计工作和会计资料的真实性、完整性负责","C":"单位负责人不得授意、指使、强令会计机构、会计人员违法办理会计事项","D":"县级以上地方各级人民政府财政部门管理本行政区域内的会计工作"},"answer":["A","C","D"],"explanation":"选项B，“单位负责人”对本单位的会计工作和会计资料的真实性、完整性负责。"},{"id":"q0044","chapter":"第2章","type":"multiple","stem":"M 市财政部门对甲公司会计资料检查时，发现甲公司以虚假的经济业务编制了\n会计凭证和会计账簿，并据此编制了财务会计报告。下列会计违法行为中，甲公\n司涉及的有（\n）。","options":{"A":"变造会计凭证","B":"伪造会计凭证","C":"伪造会计账簿","D":"编制虚假财务会计报告"},"answer":["B","C","D"],"explanation":"选项A，变造会计资料，是用涂改、拼接、挖补等手段来改变会计凭证、会计账\n簿和其他会计资料的真实内容、歪曲事实真相的行为。选项B、C、D，伪造会\n计资料，是用虚假的经济业务为前提来编制会计凭证、会计账簿和其他会计资料，\n旨在以假充真。"},{"id":"q0045","chapter":"第2章","type":"multiple","stem":"下列各项中，属于变造会计凭证行为的有（\n）。","options":{"A":"某公司为一客户虚开假发票一张，并按票面金额的15%收取好处费","B":"将购货发票上的金额50 万元涂改为80 万元报账","C":"企业某现金出纳将一张报销凭证上的金额10 000 元涂改为40 000 元","D":"购货部门转来一张购货发票，原金额计算有误，出票单位已作更正并加盖出票\n单位公章"},"answer":["B","C"],"explanation":"变造会计凭证的行为，是指采取涂改、拼接、挖补等手段来改变会计凭证和会计\n账簿真实内容的行为。选项B、C，属于变造会计凭证的行为；选项A，属于伪\n造会计凭证的行为；选项D，属于没有按照规定更改原始凭证的行为。"},{"id":"q0046","chapter":"第2章","type":"multiple","stem":"根据会计法律制度的规定，下列的表述中，正确的有（\n）。","options":{"A":"会计人员可选公历2024 年4 月1 日起至2025 年3 月31 日止为一个会计年度\n进行会计核算","B":"业务收支以人民币以外的货币为主的单位，可以选定其中一种货币作为记账本\n位币，但是编报的财务会计报告应当折算为人民币","C":"在中国境内的外商投资企业、外国企业和其他外国组织的会计记录只能使用中\n文记录","D":"以虚假的经济业务编制会计凭证和会计账簿属于伪造会计资料"},"answer":["B","D"],"explanation":"选项A，会计年度是法定的，企业不能自己选定，我国以公历年度为会计年度，\n即公历1 月1 日起至12 月31 日止；选项C，在中国境内的外商投资企业、外国\n企业和其他外国组织的会计记录，可以使用“中文＋另外一种外国文字”。"},{"id":"q0047","chapter":"第2章","type":"multiple","stem":"根据会计法律制度的规定，下列各项中，属于会计核算内容的有（\n）。","options":{"A":"固定资产盘盈","B":"货币资金收入","C":"无形资产购入","D":"合同审核和签订"},"answer":["A","B","C"],"explanation":"会计核算的内容是引起资金运动的经济业务事项，包括引起资产（选项A、B、C）、\n负债、所有者权益、收入、费用和利润变动的事项。选项D，并未引起资金运动，\n无须进行会计核算。只有当合同或协议实际履行并引起资金运动时，才需要对相\n关经济业务事项如实记录和反映，进行会计核算。"},{"id":"q0048","chapter":"第2章","type":"multiple","stem":"根据《中华人民共和国会计法》的规定，下列人员中，应当在单位财务会计报\n告上签名并盖章的有（\n）。","options":{"A":"单位负责人","B":"总会计师","C":"会计机构负责人","D":"出纳人员"},"answer":["A","B","C"],"explanation":"财务会计报告应当由单位负责人和主管会计工作的负责人、会计机构负责人(会\n计主管人员)签名并盖章；设置总会计师的单位，还须由总会计师签名并盖章。\n不包括出纳人员（选项D）。"},{"id":"q0049","chapter":"第2章","type":"multiple","stem":"根据会计法律制度的规定，下列选项中，表述正确的有（\n）。","options":{"A":"账务核对主要包括账账核对、账证核对、账实核对、证证核对","B":"国有资本控股的企业，应当至少每年一次向本企业的职工代表大会公布财务会\n计报告","C":"如果外单位需要，经本单位会计机构负责人批准，可以将原始凭证复制件借出","D":"公民对企业违反《中华人民共和国会计法》的行为进行检举属于社会监督"},"answer":["B","C","D"],"explanation":"选项A，账务核对主要包括账账核对、账证核对、账实核对、账表核对，不包括\n证证核对。"},{"id":"q0050","chapter":"第2章","type":"multiple","stem":"下列有关会计档案保管期限的表述中，正确的有（\n）。","options":{"A":"年度财务会计报告永久保管","B":"日记账最低保管期限为30 年","C":"会计凭证最低保管期限为10 年","D":"总账、明细账最低保管期限为30 年"},"answer":["A","B","D"],"explanation":"选项C，会计凭证（包括原始凭证和记账凭证）最低保管期限为30 年。"},{"id":"q0051","chapter":"第2章","type":"multiple","stem":"下列属于保管期满但不得销毁的会计档案的有（\n）。","options":{"A":"尚未结清债权债务的原始凭证","B":"记录经济业务发生和完成情况的原始凭证","C":"月度财务会计报告","D":"涉及其他未了事项的原始凭证"},"answer":["A","D"],"explanation":"保管期满但未结清的债权债务会计凭证（选项A）和涉及其他未了事项的会计凭\n证（选项D）不得销毁。"},{"id":"q0052","chapter":"第2章","type":"multiple","stem":"根据会计法律制度的规定，下列各项中，属于不相容职务的有（\n）。","options":{"A":"授权批准与业务经办","B":"业务经办与会计记录","C":"会计记录与财产保管","D":"业务经办与稽核检查"},"answer":["A","B","C","D"],"explanation":"不相容职务包括：授权批准与业务经办、业务经办与会计记录、会计记录与财产\n保管、业务经办与稽核检查、授权批准与监督检查等。"},{"id":"q0053","chapter":"第2章","type":"multiple","stem":"根据会计法律制度的规定，下列各项中，不属于代理记账机构业务范围的有\n（\n）。","options":{"A":"代理委托人对外提供财务会计报告","B":"配备专人负责委托人日常货币收支和保管","C":"根据委托人提供的原始凭证进行会计核算","D":"出具审计报告"},"answer":["B","D"],"explanation":"选项B，属于委托人应当履行的义务；选项D，出具审计报告是注册会计师及其\n所在的会计师事务所等中介机构的业务范围。"},{"id":"q0054","chapter":"第2章","type":"multiple","stem":"根据会计法律制度的规定，下列关于代理记账机构及其从业人员义务表述中，\n正确的有（\n）。","options":{"A":"对执行代理记账业务中知悉的商业秘密予以保密","B":"拒绝委托人提供不实会计资料的要求","C":"对委托人提出的有关会计处理相关问题予以解释","D":"拒绝委托人作出不当会计处理的要求"},"answer":["A","B","C","D"],"explanation":"代理记账机构及从业人员的义务包括：①遵守有关法律、法规和国家统一的会计\n制度的规定，按照委托合同办理代理记账业务；②对在执行业务中知悉的商业秘\n密予以保密（选项A）；③对委托人要求其作出不当的会计处理，提供不实的会\n计资料，以及其他不符合法律、法规和国家统一的会计制度行为的，予以拒绝（选\n项B、D）；④对委托人提出的有关会计处理相关问题予以解释（选项C）。"},{"id":"q0055","chapter":"第2章","type":"multiple","stem":"下列关于会计工作岗位设置的表述中，正确的有（\n）。","options":{"A":"各单位应当根据会计业务需要设置会计工作岗位","B":"会计人员的工作岗位应当有计划地进行轮换","C":"会计工作岗位，可以一人一岗、一人多岗或者一岗多人","D":"出纳可以兼任会计档案保管工作"},"answer":["A","B","C"],"explanation":"选项D，出纳人员不得兼管稽核、会计档案保管和收入、支出、费用、债权债务\n账目的登记工作。"},{"id":"q0056","chapter":"第2章","type":"multiple","stem":"根据会计法律制度的规定，下列关于会计人员回避制度的表述中，正确的有\n（\n）。","options":{"A":"单位负责人的直系亲属不得担任本单位的会计机构负责人","B":"单位负责人的直系亲属不得担任本单位的出纳工作","C":"会计机构负责人的直系亲属不得担任本单位的出纳工作","D":"所有单位任用会计人员都应当实行回避制度"},"answer":["A","C"],"explanation":"单位领导人的直系亲属不得担任本单位的会计机构负责人、会计主管人员，选项\nA 正确、选项B 错误；会计机构负责人、会计主管人员的直系亲属不得在本单位\n会计机构中担任出纳工作，选项C 正确；国家机关、国有企业、事业单位任用\n会计人员应当实行回避制度，选项D 错误。"},{"id":"q0057","chapter":"第2章","type":"multiple","stem":"下列有关办理会计工作交接手续的表述中，正确的有（\n）。","options":{"A":"会计主管人员办理交接手续，由单位负责人监交","B":"移交人员对所移交的会计凭证、会计账簿、会计报表和其他有关资料的合法性、\n真实性承担法律责任","C":"会计人员工作调动、离职或者因病暂时不能工作，应与接管人员办清交接手续","D":"接替人员应另立账簿，以便和原会计人员划清责任"},"answer":["A","B","C"],"explanation":"选项D，接替人员应当继续使用移交的会计账簿，不得自行另立新账，以保持会\n计记录的连续性。"},{"id":"q0058","chapter":"第3章","type":"single","stem":"根据支付结算法律制度的规定，下列行为中，属于伪造票据的是（\n）。","options":{"A":"挖补票据金额","B":"覆盖票据到期日","C":"涂改票据收款人名称","D":"假冒票据签章"},"answer":["D"],"explanation":"此题考查“伪造票据的行为”，首先需要与第二章“伪造会计资料”相区分。其次需\n要与变造票据行为相区分，伪造票据行为是对“签章”进行伪造，而变造票据行为\n则是通过剪接、挖补、覆盖、涂改的手段，对“签章以外”的事项进行更改。选项\nA、B、C，属于票据的变造；选项D，属于票据的伪造。"},{"id":"q0059","chapter":"第3章","type":"single","stem":"2025 年10 月19 日，甲公司签发了一张支票用于购买办公用品。该支票出票\n日期应记载为（\n）。","options":{"A":"贰零贰伍年壹拾月壹拾玖日","B":"贰零贰伍年零壹拾月拾玖日","C":"贰零贰伍年壹拾月拾玖日","D":"贰零贰伍年零壹拾月壹拾玖日"},"answer":["D"],"explanation":"在填写月时，月为“壹拾”的，应当在前面加“零”；日为“拾玖”的，应在其前加“壹”，\n因此选项D 正确。"},{"id":"q0060","chapter":"第3章","type":"single","stem":"甲公司因长期经营不善被宣告破产，撤销在银行开立的结算账户时，其应当\n最后撤销的是（\n）。","options":{"A":"临时存款账户","B":"专用存款账户","C":"一般存款账户","D":"基本存款账户"},"answer":["D"],"explanation":"撤销银行结算账户时，应先撤销一般存款账户、专用存款账户、临时存款账户，\n将账户资金转入基本存款账户后，方可办理基本存款账户的撤销。"},{"id":"q0061","chapter":"第3章","type":"single","stem":"根据支付结算法律制度的规定，下列存款人中，于2025 年1 月在银行开立基\n本存款账户，无需核发开户许可证的是（）。","options":{"A":"丁居民委员会","B":"丙市人民医院","C":"乙公司","D":"甲县市场监督管理局"},"answer":["C"],"explanation":"企业银行结算账户实行备案制，不再核发开户许可证；选项A、D 属于特别法人，\n选项B 属于事业单位，其开立银行结算账户仍实行核准制。"},{"id":"q0062","chapter":"第3章","type":"single","stem":"基本存款账户是存款人的主办账户。下列关于基本存款账户的表述中，不正\n确的是（\n）。","options":{"A":"异地常设机构可以申请开立基本存款账户","B":"一个单位只能开立一个基本存款账户","C":"可以办理存款人日常经营活动中的资金收付","D":"工资、奖金的发放禁止从基本存款账户中支取"},"answer":["D"],"explanation":"选项D，工资、奖金和现金的支取，应通过基本存款账户办理。"},{"id":"q0063","chapter":"第3章","type":"single","stem":"甲公司因贷款需要，在P 银行开立了一般存款账户。该账户不得办理的业务\n是（\n）。","options":{"A":"借款转存","B":"现金缴存","C":"现金支取","D":"借款归还"},"answer":["C"],"explanation":"选项A、D，一般存款账户用于办理存款人借款转存、借款归还和其他结算的资\n金收付；选项B、C，一般存款账户可以办理现金缴存，但不得办理现金支取。"},{"id":"q0064","chapter":"第3章","type":"single","stem":"甲拟通过电子渠道申请开立两个个人银行存款账户，根据规定，下列选项中，\n甲可以成功开立的是（\n）。","options":{"A":"Ⅰ类银行账户和Ⅱ类银行账户","B":"Ⅰ类银行账户和Ⅲ类银行账户","C":"Ⅱ类银行账户和Ⅲ类银行账户","D":"两个均为Ⅰ类银行账户"},"answer":["C"],"explanation":"通过网上银行和手机银行等电子渠道受理银行账户开户申请的，银行可为开户申\n请人开立Ⅱ类户或Ⅲ类户。"},{"id":"q0065","chapter":"第3章","type":"single","stem":"甲公司为向乙公司支付货款，向其签发了一张金额为100 万元的转账支票，\n付款人为甲公司的开户银行A 银行，保证人为B 银行。根据票据法律制度的规\n定，下列选项中，不属于该支票基本当事人的是（\n）。","options":{"A":"甲公司","B":"乙公司","C":"A 银行","D":"B 银行"},"answer":["D"],"explanation":"支票的基本当事人有出票人(甲公司)、付款人(A 银行)、收款人(乙公司)。保证人\nB 银行属于票据的非基本当事人。"},{"id":"q0066","chapter":"第3章","type":"single","stem":"下列纸质票据的记载事项中，不属于相对记载事项的是（\n）。","options":{"A":"保证日期","B":"承兑日期","C":"出票日期","D":"背书日期"},"answer":["C"],"explanation":"选项C，出票日期为必须记载事项，不记载出票日期，票据无效。"},{"id":"q0067","chapter":"第3章","type":"single","stem":"根据支付结算法律制度的规定，下列不属于票据行为的是（\n）。","options":{"A":"出票","B":"背书","C":"承兑","D":"付款"},"answer":["D"],"explanation":"票据行为包括出票、背书、承兑和保证。"},{"id":"q0068","chapter":"第3章","type":"single","stem":"根据票据法律制度的规定，下列关于票据行为的表述中，不符合规定的是\n（\n）。","options":{"A":"背书未记载日期的，视为在票据到期日前背书","B":"保证不得附有条件，附有条件的，不影响对票据的保证责任","C":"承兑附有条件的，所附条件无效，承兑有效","D":"背书未记载被背书人名称的，持票人可以自行记载自己为被背书人"},"answer":["C"],"explanation":"选项C，承兑附有条件的，视为拒绝承兑。"},{"id":"q0069","chapter":"第3章","type":"single","stem":"甲公司将一张银行汇票背书转让给乙公司，该汇票需加附粘单，甲公司为粘\n单上的第一记载人，丙公司为甲公司的前手，丁公司为汇票记载的收款人。根据\n票据法律制度的规定，下列公司中，应当在汇票和粘单的粘接处签章的是（\n）。","options":{"A":"甲公司","B":"乙公司","C":"丙公司","D":"丁公司"},"answer":["A"],"explanation":"根据规定，票据凭证不能满足背书人记载事项的需要，可以加附粘单，粘附于票\n据凭证上。粘单上的第一记载人（选项A），应当在汇票和粘单的粘接处签章。"},{"id":"q0070","chapter":"第3章","type":"single","stem":"根据支付结算法律制度的规定，下列关于保证的说法中，正确的是（\n）。","options":{"A":"保证未记载被保证人的，保证无效","B":"未记载保证日期的，到期日为保证日期","C":"保证人必须在票据上记载保证人名称和住所","D":"医院可以成为票据保证人"},"answer":["C"],"explanation":"选项A，保证未记载被保证人名称：以出票人或承兑人为被保证人；选项B，保\n证未记载保证日期：出票日期为保证日期；选项D，国家机关、以公益为目的的\n事业单位、社会团体作为票据保证人的，票据保证无效。"},{"id":"q0071","chapter":"第3章","type":"single","stem":"根据支付结算法律制度的规定，关于持票人对出票人票据权利时效的下列表\n述中，正确的是（\n）。","options":{"A":"支票自出票日起6 个月","B":"商业汇票自出票日起2 年","C":"银行本票自到期日起2 年","D":"银行汇票自出票日起1 年"},"answer":["A"],"explanation":"选项B，商业汇票的持票人对出票人的票据权利自票据“到期日起2 年”；选项C、\nD，银行本票和银行汇票的持票人对出票人的票据权利自“出票日起2 年”。"},{"id":"q0072","chapter":"第3章","type":"single","stem":"2026 年1 月1 日，甲向乙签发一张承兑人为A 银行的银行承兑汇票，到期日\n为2026 年4 月20 日。2026 年3 月1 日，乙将该汇票背书转让给丙。2026 年4\n月25 日，丙向A 银行提示付款被拒绝并取得拒绝证明。根据票据法律制度的规\n定，丙直接向乙进行追索，则其对乙的追索权的消灭时间是（\n）。","options":{"A":"2026 年7 月20 日","B":"2026 年7 月25 日","C":"2026 年10 月25 日","D":"2026 年4 月25 日"},"answer":["C"],"explanation":"持票人对一般前手的（首次）追索权，在被拒绝承兑或者被拒绝付款之日起6\n个月内行使。"},{"id":"q0073","chapter":"第3章","type":"single","stem":"下列不属于我国《票据法》规定的票据权利补救方法的是（\n）。","options":{"A":"公示催告","B":"声明作废","C":"挂失止付","D":"普通诉讼"},"answer":["B"],"explanation":"票据丧失后，可以采取挂失止付、公示催告和普通诉讼三种形式进行补救。"},{"id":"q0074","chapter":"第3章","type":"single","stem":"根据支付结算法律制度的规定，下列各项关于支票提示付款的说法正确的是\n（\n）。","options":{"A":"转账支票提示付款日期为出票日起1 个月","B":"出票人记载自己为收款人，提示付款不予受理","C":"支票未记载收款人名称，可以提示付款","D":"现金支票仅限于收款人向付款人提示付款"},"answer":["D"],"explanation":"选项A，支票的提示付款期限为自出票日起10 日；选项B，支票出票人可以记\n载自己为收款人；选项C，支票的金额、收款人名称，可以由出票人授权补记，\n未补记前不得背书转让和提示付款。"},{"id":"q0075","chapter":"第3章","type":"single","stem":"下列各项中，能作为电子银行承兑汇票承兑人的是（\n）。","options":{"A":"钢铁公司","B":"航天公司","C":"财务公司","D":"房地产公司"},"answer":["C"],"explanation":"电子银行承兑汇票由银行业金融机构、财务公司（选项C）承兑。"},{"id":"q0076","chapter":"第3章","type":"single","stem":"根据支付结算法律制度的规定，下列关于商业汇票的表述中，不正确的是\n（\n）。","options":{"A":"商业汇票可以在出票时向付款人提示承兑后使用，也可以在出票后先使用再向\n付款人提示承兑","B":"纸质商业汇票未记载承兑日期的，以付款人收到提示承兑的汇票之日为承兑日\n期","C":"承兑人承兑电子商业汇票，必须记载承兑日期","D":"电子商业汇票转让背书必须记载背书人名称、被背书人名称、背书日期和背书\n人签章"},"answer":["B"],"explanation":"选项B，未记载承兑日期的，以付款人收到提示承兑的汇票之日起3 日内的最后\n1 日为承兑日期。"},{"id":"q0077","chapter":"第3章","type":"single","stem":"甲公司基于买卖合同向乙公司签发了一张票面金额为20 万元的银行承兑汇\n票。出票日期为9 月11 日，到期日为同年12 月11 日。11 月10 日，乙公司持\n相关手续向银行办理了贴现。已知同期银行年贴现率为3.6%，一年按360 天计算，\n贴现银行与承兑银行在同一个城市。根据支付结算法律制度的规定，银行实付乙\n公司贴现金额为（\n）元。","options":{"A":"199 980","B":"199 650","C":"199 380","D":"199 200"},"answer":["C"],"explanation":"实付贴现金额按票面金额扣除贴现日至汇票到期前1 日的利息计算。本题中贴现\n日是11 月10 日，汇票到期前1 日是12 月10 日，一共是31 天。所以，银行实\n付乙公司的贴现金额＝200 000－200 000×3.6％×（31÷360）＝199 380（元）。"},{"id":"q0078","chapter":"第3章","type":"single","stem":"根据支付结算法律制度的规定，下列关于银行汇票的表述中，正确的是\n（\n）。","options":{"A":"银行汇票不能用于个人款项结算","B":"银行汇票不能支取现金","C":"银行应先收妥款项再签发银行汇票","D":"银行汇票必须按出票金额付款"},"answer":["C"],"explanation":"选项A，单位和个人的各种款项结算，均可使用银行汇票；选项B，银行汇票可\n以用于转账，填明“现金”字样的银行汇票也可以用于支取现金；选项D，收款人\n受理申请人交付的银行汇票时，应在出票金额以内，根据实际需要的款项办理结\n算，并将实际结算金额和多余金额准确、清晰地填入银行汇票和解讫通知的有关\n栏内。"},{"id":"q0079","chapter":"第3章","type":"single","stem":"根据支付结算法律制度的规定，下列关于银行汇票的表述，错误的是（\n）。","options":{"A":"银行汇票的提示付款期限为自出票日起1 个月","B":"申请人或收款人为单位的，银行不得为其签发现金银行汇票","C":"申请人应将银行汇票和解讫通知一并交付给汇票上记明的收款人","D":"银行汇票的实际结算金额可以更改"},"answer":["D"],"explanation":"选项D，银行汇票的实际结算金额一经填写不得更改，更改实际结算金额的银行\n汇票无效。"},{"id":"q0080","chapter":"第3章","type":"single","stem":"根据支付结算法律制度的规定，下列各项票据中，“付款人名称”不是必须记载\n事项的是（\n）。","options":{"A":"银行汇票","B":"银行本票","C":"商业汇票","D":"支票"},"answer":["B"],"explanation":"签发银行本票必须记载下列事项：表明“银行本票”字样；无条件支付的承诺；确\n定的金额；收款人名称；出票日期；出票人签章。欠缺记载上列事项之一的，银\n行本票无效。银行本票的出票银行就是付款人，即出票人和付款人是同一方，因\n此银行本票的必须记载事项没有“付款人名称”。"},{"id":"q0081","chapter":"第3章","type":"single","stem":"根据支付结算法律制度的规定，下列关于银行卡分类的表述中，不正确的是\n（\n）。","options":{"A":"按是否具有透支功能分为信用卡和贷记卡","B":"按发行对象分为单位卡和个人卡","C":"按币种分为人民币卡和外币卡","D":"按信息载体分为磁条卡和芯片卡"},"answer":["A"],"explanation":"选项A，银行卡按照是否具有透支功能分为信用卡和借记卡，信用卡按是否向发\n卡银行交存备用金分为贷记卡和准贷记卡。"},{"id":"q0082","chapter":"第3章","type":"single","stem":"下列关于银行卡的表述中，正确的是（\n）。","options":{"A":"可以将信用卡预借现金额度内资金划转至非本人支付账户","B":"可以将信用卡预借现金额度内资金划转至另一张信用卡上","C":"信用卡持卡人通过柜面提取现金额度由发卡机构与个人协议约定","D":"借记卡通过自助机具取款，每卡每日累计提款不得超过1 万元人民币"},"answer":["C"],"explanation":"发卡机构不得将持卡人信用卡预借现金额度内资金划转至其他信用卡，以及非持\n卡人的银行结算账户或支付账户，选项A、B 表述错误；借记卡通过ATM 等自\n助机具取款，每卡每日累计提款不得超过2 万元人民币，选项D 表述错误。"},{"id":"q0083","chapter":"第3章","type":"single","stem":"根据支付结算法律制度的规定，下列关于个人网上银行业务的表述中，不正\n确的是（\n）。","options":{"A":"B2B 网上支付","B":"查询银行卡的人民币余额","C":"银证转账业务","D":"人民币转账业务"},"answer":["A"],"explanation":"选项A，属于“企业”网上银行子系统的主要业务功能。"},{"id":"q0084","chapter":"第3章","type":"single","stem":"下列关于多功能预付卡的表述中，正确的是（\n）。","options":{"A":"记名预付卡单张限额不超过5 000 元","B":"可以用信用卡为预付卡充值","C":"可以提取现金","D":"单位可使用现金购买6 000 元的预付卡"},"answer":["A"],"explanation":"选项A，预付卡分为记名预付卡和不记名预付卡，单张限额分别为5 000 元和1\n000 元；选项B，不得使用信用卡购买预付卡或对其进行充值；选项C，预付卡\n在发卡机构拓展、签约的特约商户中使用，不得用于或变相用于提取现金；选项\nD，单位一次性购买预付卡5 000 元以上，应当通过银行转账等非现金结算方式\n购买，不得使用现金。"},{"id":"q0085","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，下列选项中，属于支付结算原则的有（\n）。","options":{"A":"谁的钱进谁的账、由谁支配","B":"恪守信用、履约付款","C":"银行不垫款","D":"诚实信用、高效快捷"},"answer":["A","B","C"],"explanation":"支付结算的原则：恪守信用、履约付款（选项B），谁的钱进谁的账、由谁支配\n（选项A）和银行不垫款（选项C）。"},{"id":"q0086","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，下列关于办理支付结算基本要求的表述中，不\n正确的有（\n）。","options":{"A":"结算凭证的金额以中文大写和阿拉伯数码同时记载，二者必须一致，二者不一\n致以中文大写为准","B":"票据上金额、出票日期、付款人名称不得更改","C":"票据的出票日期可以使用阿拉伯数码记载","D":"票据上的签章为签名、盖章或者签名加盖章"},"answer":["A","B","C"],"explanation":"选项A，结算凭证的金额以中文大写和阿拉伯数码同时记载，二者必须一致，二\n者不一致的票据无效，二者不一致的结算凭证银行不受理；选项B，票据上金额、\n出票日期、收款人名称不得更改，而非付款人名称；选项C，票据的出票日期必\n须使用中文大写。"},{"id":"q0087","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，下列表述中，正确的有（\n）。","options":{"A":"企业银行结算账户自开立之日即可办理收付款业务","B":"单位的住址发生变更时，应于5 个工作日内书面通知开户银行并提供有关证明","C":"银行为企业开立基本存款账户，不得采用非面对面方式核实开户意愿","D":"存款人撤销银行结算账户，与开户银行核对银行结算账户存款余额后，可自行\n销毁空白票据"},"answer":["A","B"],"explanation":"选项C，企业申请开立基本存款账户的，银行应当向企业法定代表人或单位负责\n人核实企业开户意愿，并留存相关工作记录，核实开户意愿，可采取面对面、视\n频等方式，具体方式由银行根据客户风险程度选择；选项D，存款人撤销银行结\n算账户，必须与开户银行核对银行结算账户存款余额，“并交回”各种重要空白票\n据及结算凭证和开户许可证，银行核对无误后方可办理销户手续。"},{"id":"q0088","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，对于按照账户管理规定应撤销而未办理销户手\n续的单位银行结算账户，下列表述正确的有（\n）。","options":{"A":"银行通知该单位银行结算账户的存款人自发出通知之日起30 日内办理销户手\n续","B":"存款人逾期未办理销户手续，视同自愿销户","C":"逾期未划转款项列入久悬未取专户管理","D":"逾期未划转款项自动划转到财政部的财政账户"},"answer":["A","B","C"],"explanation":"对于按照账户管理规定应撤销而未办理销户手续的单位银行结算账户，银行通知\n该单位银行结算账户的存款人自发出通知之日起30 日内办理销户手续（选项A\n当选），逾期视同自愿销户（选项B 当选），未划转款项列入久悬未取专户管理\n（选项C 当选）。"},{"id":"q0089","chapter":"第3章","type":"multiple","stem":"下列关于银行结算账户的表述中，不正确的有（\n）。","options":{"A":"存款人尚未清偿其开户银行债务的，可先申请撤销该账户，10 天内还清银行\n债务","B":"临时存款账户的有效期，最长不得超过1 年","C":"企业开立的银行结算账户，自正式开立之日即可办理收付款业务","D":"存款人可以出借银行结算账户"},"answer":["A","B","D"],"explanation":"存款人尚未清偿其开户银行债务的，不得申请撤销该银行结算账户，选项A 错\n误；临时存款账户有效期最长不得超过2 年，选项B 错误；存款人应按照账户管\n理规定使用银行结算账户办理结算业务，不得出租、出借银行结算账户，选项D\n错误。"},{"id":"q0090","chapter":"第3章","type":"multiple","stem":"下列存款人中，可以申请设立基本存款账户的有（\n）。","options":{"A":"单位附属独立核算的食堂","B":"异地临时机构","C":"业主委员会","D":"外国驻华机构"},"answer":["A","C","D"],"explanation":"下列存款人，可以申请开立基本存款账户：企业法人；非法人企业；机关、事业\n单位；团级(含)以上军队、武警部队及分散执勤的支(分)队；社会团体；民办非\n企业组织；异地常设机构；外国驻华机构（选项D）；个体工商户；居民委员会、\n村民委员会、社区委员会；单位设立的独立核算的附属机构，包括食堂（选项A）、\n招待所、幼儿园；其他组织，即按照现行的法律、行政法规规定可以成立的组织，\n如业主委员会（选项C）、村民小组等组织；境外机构。选项B，异地“临时”机\n构开立的是临时存款账户，而非基本存款账户。"},{"id":"q0091","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度，下列有关预算单位零余额账户管理的要求，错误的有\n（\n）。","options":{"A":"一个基层预算单位可以开立两个以上的零余额账户","B":"开立该账户需要向当地人民银行提出申请","C":"该账户可以办理转账、提取现金、划拨工会经费以及向所属下级单位账户划拨\n资金等","D":"未在银行开立账户的单位申请开立了预算单位零余额账户后，该账户按照专用\n存款账户管理"},"answer":["A","B","C","D"],"explanation":"一个基层预算单位开设一个零余额账户，选项A 错误；预算单位使用财政性资\n金，应当按照规定的程序和要求，向财政部门提出设立零余额账户的申请，财政\n部门审核同意后通知代理银行，选项B 错误；该账户不得存入现金，可按规定提\n取现金，可以向本单位按账户管理规定保留的相应账户划拨工会经费、住房公积\n金及提租补贴，以及财政部门批准的特殊款项，不得违反规定向本单位其他账户\n和上级主管单位、所属下级单位账户划拨资金，选项C 错误；未在银行开立账\n户的单位申请开立了预算单位零余额账户的，该账户按照基本存款账户管理，选\n项D 错误。"},{"id":"q0092","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，下列款项可以转入个人银行结算账户的有\n（\n）。","options":{"A":"工资、奖金收入","B":"稿费、演出费等劳务收入","C":"继承、赠与款项","D":"农、副、矿产品销售收入"},"answer":["A","B","C","D"],"explanation":"一切合法收入均可通过个人银行结算账户办理。下列款项可以转入个人银行结算\n账户：（1）工资、奖金收入（选项A）；（2）稿费、演出费等劳务收入（选项\nB）；（3）债券、期货、信托等投资的本金和收益；（4）个人债权或产权转让\n收益；（5）个人贷款转存；（6）证券交易结算资金和期货交易保证金；（7）\n继承、赠与款项（选项C）；（8）保险理赔、保费退还等款项；（9）纳税退还；\n（10）农、副、矿产品销售收入（选项D）；（11）其他合法款项。"},{"id":"q0093","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，个人银行结算账户Ⅲ类银行账户可以（\n）。","options":{"A":"购买理财产品","B":"存取现金","C":"限额向非绑定账户转账","D":"限额消费和缴费"},"answer":["C","D"],"explanation":"Ⅲ类银行账户可以办理限额消费和缴费（选项D）、限额向非绑定账户转出资金\n业务（选项C）；经银行柜面、自助设备加以银行工作人员现场面对面确认身份\n的Ⅲ类银行账户还可以办理非绑定账户资金转入业务。"},{"id":"q0094","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，下列票据中，出票人是银行的有（\n）。","options":{"A":"商业汇票","B":"银行汇票","C":"本票","D":"支票"},"answer":["B","C"],"explanation":"选项A，商业汇票的出票人为银行以外的企业和其他组织；选项D，支票的出票\n人为在银行开立支票存款账户的企业、其他组织和个人。"},{"id":"q0095","chapter":"第3章","type":"multiple","stem":"下列关于商业汇票提示承兑的表述中，符合法律规定的有（\n）。","options":{"A":"付款人对向其提示承兑的汇票，3 日内不作承兑与否表示的，视为同意承兑","B":"定日付款的商业汇票，持票人应该在汇票到期日前提示承兑","C":"出票后定期付款的商业汇票，提示承兑期限为自出票日起1 个月内","D":"见票后定期付款的商业汇票，持票人应该自出票日起1 个月内提示承兑"},"answer":["B","D"],"explanation":"付款人对向其提示承兑的汇票，应当自收到提示承兑的汇票之日起3 日内承兑或\n拒绝承兑，3 日内不作承兑与否表示的，视为“拒绝”承兑，所以选项A 错误；出\n票后定期付款的商业汇票，持票人应该在汇票到期日前向付款人提示承兑，所以\n选项C 错误。"},{"id":"q0096","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，下列关于票据背书的表述中，正确的有\n（\n）。","options":{"A":"背书连续的，最后持票人是最后背书的被背书人","B":"票据被拒绝承兑后背书转让的，背书人不承担票据责任","C":"委托收款背书的被背书人可再以背书转让票据权利","D":"背书连续的，第一背书人是票据的收款人"},"answer":["A","D"],"explanation":"所谓“背书连续”，是指票据上第一背书人为票据收款人（选项D），最后持票人\n为最后背书的被背书人（选项A），中间的背书人为前手背书的被背书人（前一\n个转让背书的被背书人是后一个转让背书的背书人）。选项B，被拒绝承兑、被\n拒绝付款或超过付款提示期限的，不得背书转让，背书转让的，背书人应当承担\n票据责任；选项C，委托收款背书属于非转让背书，委托收款背书的被背书人不\n得再以背书转让票据权利。"},{"id":"q0097","chapter":"第3章","type":"multiple","stem":"根据票据法律制度的规定，下列各项中，背书无效的有（\n）。","options":{"A":"将票据金额分别转让给两人以上的背书","B":"背书人在票据上记载“不得转让”字样，其后手再背书转让的","C":"将票据金额的一部分转让的背书","D":"附条件的背书"},"answer":["A","C"],"explanation":"选项A、C，部分背书属于无效背书；选项B，背书人在票据上记载“不得转让”\n字样，其后手再背书转让的，原背书人对后手的被背书人不承担保证责任；选项\nD，背书时附有条件的，所附条件不具有票据上的效力，即背书有效，所附条件\n无效。"},{"id":"q0098","chapter":"第3章","type":"multiple","stem":"根据《票据法》的规定，票据持有人有下列（\n）情形，不得享有票据权\n利。","options":{"A":"以欺诈、偷盗、胁迫等手段取得票据的","B":"明知前手以欺诈、偷盗、胁迫等手段取得票据而出于恶意取得票据的","C":"因重大过失取得不符合《票据法》规定的票据","D":"自合法取得票据的前手处因赠与取得票据的"},"answer":["A","B","C"],"explanation":"取得票据不享有票据权利的情形：以欺诈、偷盗或者胁迫等手段取得票据的，或\n者明知有上述情形，出于恶意取得票据的；持票人因重大过失取得不符合《票据\n法》规定的票据的。"},{"id":"q0099","chapter":"第3章","type":"multiple","stem":"某上市公司的财务部发生了一起盗窃案，保险柜被人打开，出纳人员进行盘\n点过程中，发现以下四种票据丢失。根据票据法律制度的规定，可以进行挂失止\n付的有（\n）。","options":{"A":"未承兑的商业汇票","B":"填明“现金”字样但未填写代理付款人的银行汇票","C":"支票","D":"填明“现金”字样的银行本票"},"answer":["C","D"],"explanation":"只有确定付款人或代理付款人的票据丧失时才可以进行挂失止付，具体包括已承\n兑的商业汇票、支票、填明“现金”字样和代理付款人的银行汇票以及填明“现金”\n字样的银行本票。"},{"id":"q0100","chapter":"第3章","type":"multiple","stem":"甲公司签发一张商业汇票给乙公司，戊公司为保证人。乙公司将票据背书给\n丙公司，丙公司又将票据背书给丁公司。下列选项中，应当对丁公司承担票据责\n任的有（\n）。","options":{"A":"甲公司","B":"乙公司","C":"戊公司","D":"丙公司"},"answer":["A","B","C","D"],"explanation":"商业汇票的出票人（甲公司）、背书人（乙公司、丙公司）和保证人（戊公司），\n在票据不获承兑或不获付款时承担付款清偿义务。"},{"id":"q0101","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，持票人持到期的商业汇票提示付款被拒绝后，\n下列关于持票人行使追索权的说法中，正确的有（\n）。","options":{"A":"持票人行使追索权时，应当提供被拒绝付款的有关证明","B":"持票人应当自收到被拒绝付款的有关证明之日起3 日内，将被拒绝事由书面通\n知其前手","C":"持票人可以向任意前手进行追索","D":"持票人只能按照票据债务人的先后顺序对前手进行追索"},"answer":["A","B","C"],"explanation":"选项D，持票人行使追索权，可以“不按照”票据债务人的先后顺序，对其中任何\n一人、数人或者全体行使追索权。"},{"id":"q0102","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，下列各项中，持票人行使追索权时可以请求\n被追索人支付的金额和费用有（\n）。","options":{"A":"票据金额自到期日或者提示付款日起至清偿日止，按照中国人民银行规定的利\n率计算的利息","B":"被拒绝付款的票据金额","C":"发出通知书的费用","D":"取得有关拒绝证明的费用"},"answer":["A","B","C","D"],"explanation":"本题考核追索权。持票人行使追索权，可以请求被追索人支付下列金额和费用：\n被拒绝付款的票据金额；票据金额自到期日或者提示付款日起至清偿日止，按照\n中国人民银行规定的利率计算的利息；取得有关拒绝证明和发出通知书的费用。"},{"id":"q0103","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，下列关于支票出票的表述中，正确的有\n（\n）。","options":{"A":"出票人签发的支票金额不得超过其付款时在付款人处实有的存款金额","B":"出票人不得签发与其预留银行签章不符的支票","C":"支票上未记载付款行名称的，支票无效","D":"出票人不得在支票上记载自己为收款人"},"answer":["A","B","C"],"explanation":"出票人可以在支票上记载自己为收款人。"},{"id":"q0104","chapter":"第3章","type":"multiple","stem":"根据票据法律制度的规定，支票的下列记载事项中，可以由出票人授权补记\n的有（\n）。","options":{"A":"金额","B":"出票日期","C":"收款人名称","D":"付款人名称"},"answer":["A","C"],"explanation":"支票的金额、收款人名称，可以由出票人授权补记。"},{"id":"q0105","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，下列关于商业汇票出票的表述中，正确的有\n（\n）。","options":{"A":"商业承兑汇票可以由收款人签发","B":"签发银行承兑汇票必须记载付款人名称","C":"银行承兑汇票应由承兑银行签发","D":"商业承兑汇票可以由付款人签发"},"answer":["A","B","D"],"explanation":"银行承兑汇票应由在承兑银行开立存款账户的存款人签发，选项C 错误。"},{"id":"q0106","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，持票人向银行办理商业汇票贴现必须具备的\n条件有（\n）。","options":{"A":"该汇票未到期","B":"持票人是自然人、在中国境内依法设立的法人及其分支机构和非法人组织","C":"持票人与出票人或者直接前手之间具有真实的商品交易关系和债权债务关系","D":"该汇票未记载“不得转让”事项"},"answer":["A","B","C","D"],"explanation":"贴现条件包括：①票据未到期（选项A）；②票据未记载“不得转让”事项（选项\nD）；③持票人是自然人、在中国境内依法设立的法人及其分支机构和非法人组\n织（选项B）；④持票人与出票人或者直接前手之间具有真实的商品交易关系和\n债权债务关系（选项C）。"},{"id":"q0107","chapter":"第3章","type":"multiple","stem":"根据票据法律制度的规定，下列各项中，关于票据提示付款期限说法正确的\n有（\n）。","options":{"A":"银行本票的提示付款期限自出票日起最长10 日","B":"银行汇票的提示付款期限自出票日起10 日","C":"商业汇票的提示付款期限自到期日起10 日","D":"支票的提示付款期限自出票起10 日"},"answer":["C","D"],"explanation":"选项A，银行本票的提示付款期限自出票日起最长不得超过2 个月；选项B，银\n行汇票的提示付款期限自出票日起1 个月。"},{"id":"q0108","chapter":"第3章","type":"multiple","stem":"A 公司购买了B 公司一批货物，双方同意A 公司预先电汇支付货款，款到后B\n公司发货。根据汇兑的相关规定，下列选项中正确的有（\n）。","options":{"A":"汇款人A 公司对汇出银行尚未汇出的款项可以申请撤销","B":"只有单位各种款项的结算可使用汇兑","C":"汇款回单只能作为汇出银行受理汇款的依据","D":"收账通知是银行将款项确已收入收款人账户的凭据"},"answer":["A","C","D"],"explanation":"选项B，单位和个人的各种款项的结算，均可使用汇兑结算方式。"},{"id":"q0109","chapter":"第3章","type":"multiple","stem":"赵某、钱某分别在P 银行、Q 银行开立存款账户，赵某通过P 银行向钱某汇\n款2 000 元，下列选项中，属于签发汇兑凭证必须记载事项的有（\n）。","options":{"A":"Q 银行名称","B":"赵某的身份证号","C":"赵某签章","D":"钱某的存款账号"},"answer":["A","C","D"],"explanation":"签发汇兑凭证必须记载下列事项：（1）表明“信汇”或“电汇”的字样；（2）无条\n件支付的委托；（3）确定的金额；（4）收款人名称；（5）汇款人名称；（6）\n汇入地点、汇入行名称（选项A）；（7）汇出地点、汇出行名称；（8）委托日\n期；（9）汇款人签章（选项C）。选项D，汇兑凭证记载的汇款人、收款人在\n银行开立存款账户的，必须记载其账号。"},{"id":"q0110","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，下列选项中，可以办理委托收款的有（\n）。","options":{"A":"现金支票","B":"债券","C":"存单","D":"已承兑的商业汇票"},"answer":["B","C","D"],"explanation":"单位和个人凭已承兑的商业汇票（选项D）、债券（选项B）、存单（选项C）\n等付款人债务证明办理款项的结算，均可使用委托收款结算方式。选项A，现金\n支票不能使用委托收款，只能由收款人向付款人提示付款。"},{"id":"q0111","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，下列关于银行卡交易的表述中，正确的有\n（\n）。","options":{"A":"信用卡持卡人不得通过银行柜面办理现金提取业务","B":"借记卡持卡人非现金交易可享受免息还款期和最低还款额待遇","C":"信用卡预借现金业务包括现金提取、现金转账和现金充值","D":"储值卡的面值或卡内币值不得超过1 000 元人民币"},"answer":["C","D"],"explanation":"信用卡持卡人可以通过银行柜面办理现金提取业务，选项A 错误。“贷”记卡持卡\n人非现金交易可享受免息还款期和最低还款额待遇，选项B 错误。"},{"id":"q0112","chapter":"第3章","type":"multiple","stem":"关于个人信用卡计息和收费的下列表述中，符合法律规定的有（\n）。","options":{"A":"欠缴信用卡年费，银行可对该欠费计收利息","B":"发卡机构对透支的款项可向持卡人计收利息","C":"信用卡透支利率由发卡机构与持卡人自主协商确定","D":"若银行要调整信用卡利率，应至少提前45 个自然日按照约定方式通知持卡人"},"answer":["B","C","D"],"explanation":"选项A，发卡机构对向持卡人收取的违约金和年费、取现手续费、货币兑换费等\n服务费用不得计收利息。"},{"id":"q0113","chapter":"第3章","type":"multiple","stem":"某公司的下列行为中，属于银行卡特约商户风险事件的有（\n）。","options":{"A":"银行卡套现","B":"欺诈","C":"泄露持卡人账户信息","D":"移机"},"answer":["A","B","C","D"],"explanation":"收单机构发现特约商户发生疑似银行卡套现、洗钱、欺诈、移机、留存或泄露持\n卡人账户信息等风险事件的，应当对特约商户采取延迟资金结算、暂停银行卡交\n易或收回受理终端（关闭网络支付接口）等措施，并承担因未采取措施导致的风\n险损失责任；涉嫌违法犯罪活动的，应当及时向公安机关报案。"},{"id":"q0114","chapter":"第3章","type":"multiple","stem":"收单机构发现特约商户有洗钱风险时，应采取的措施有（\n）。","options":{"A":"延迟资金结算","B":"暂停银行卡交易","C":"收回受理终端","D":"关闭网络支付接口"},"answer":["A","B","C","D"],"explanation":"收单机构发现特约商户发生疑似银行卡套现、洗钱、欺诈、移机、留存或泄露持\n卡人账户信息等风险事件的，应当对特约商户采取延迟资金结算、暂停银行卡交\n易或收回受理终端（关闭网络支付接口）等措施。"},{"id":"q0115","chapter":"第3章","type":"multiple","stem":"根据支付结算法律制度的规定，下列关于预付卡使用的表述中，正确的有\n（\n）。","options":{"A":"记名预付卡可挂失，可赎回","B":"有资金余额但超过有效期的不记名预付卡可通过延期、激活、换卡等方式继续\n使用","C":"记名预付卡不得设置有效期","D":"预付卡具有透支功能"},"answer":["A","B","C"],"explanation":"选项A、C，记名预付卡可挂失，可赎回，不得设置有效期；选项B，不记名预\n付卡有效期不得低于3 年，超过有效期尚有资金余额的预付卡，可通过延期、激\n活、换卡等方式继续使用；选项D，预付卡以人民币计价，不具有透支功能。"},{"id":"q0116","chapter":"第3章","type":"judge","stem":"单张出票金额在100 万元以上的商业汇票原则上应全部通过电子商业汇票办\n理，单张出票金额在300 万元以上的商业汇票应全部通过电子商业汇票办理。\n（\n）","options":{"A":"正确","B":"错误"},"answer":["A"],"explanation":"题目所述内容正确。"},{"id":"q0117","chapter":"第3章","type":"judge","stem":"电子商业汇票的付款期限只允许作定日付款记载，付款期限自出票日起至到期\n日止，最长不得超过6 个月。（\n）","options":{"A":"正确","B":"错误"},"answer":["A"],"explanation":"题目所述内容正确。"},{"id":"q0118","chapter":"第3章","type":"judge","stem":"未填写实际结算金额的银行汇票不得背书转让。（\n）","options":{"A":"正确","B":"错误"},"answer":["A"],"explanation":"题目所述内容正确。未填写实际结算金额或实际结算金额超过出票金额的银行汇\n票不得背书转让。"},{"id":"q0119","chapter":"第4章","type":"single","stem":"下列税种中，采用超率累进税率的是（\n）。","options":{"A":"资源税","B":"土地增值税","C":"契税","D":"车船税"},"answer":["B"],"explanation":"选项A，资源税采用比例税率和定额税率两种形式；选项C，契税采用比例税率；\n选项D，车船税采用定额税率。"},{"id":"q0120","chapter":"第4章","type":"single","stem":"区别不同税种的重要标志是（\n）。","options":{"A":"纳税环节","B":"税目","C":"税率","D":"征税对象"},"answer":["D"],"explanation":"征税对象，又称课税对象，是纳税的客体，是区别不同税种的重要标志。"},{"id":"q0121","chapter":"第4章","type":"single","stem":"根据增值税法律制度的规定，下列关于增值税纳税人的表述中，不正确的是\n（\n）。","options":{"A":"增值税纳税人认定标准中的年应税销售额包括纳税申报销售额、稽查查补销售\n额、纳税评估调整销售额","B":"小规模纳税人一律不得使用增值税专用发票","C":"资管产品运营过程中发生的增值税应税交易，以资管产品管理人为增值税纳税\n人","D":"年应税销售额为500 万元的纳税人划分为小规模纳税人"},"answer":["B"],"explanation":"小规模纳税人（自然人除外）发生增值税应税交易，需要开具增值税专用发票的，\n可以自愿使用增值税发票管理系统自行开具。"},{"id":"q0122","chapter":"第4章","type":"single","stem":"根据增值税法律制度的规定，下列行为中，应按照“销售不动产”税目计缴增值\n税的是（\n）。","options":{"A":"将建筑物广告位出租给其他单位用于发布广告","B":"销售底商（建筑物底层商铺）","C":"转让高速公路经营权","D":"转让国有土地使用权"},"answer":["B"],"explanation":"选项A，属于“经营租赁服务”；选项C、D，属于“销售无形资产”。"},{"id":"q0123","chapter":"第4章","type":"single","stem":"甲二手车销售公司为增值税一般纳税人，2026 年3 月销售其收购的二手车，\n取得含增值税销售额155 000 元。已知销售二手车按0.5%的征收率征收增值税，\n计算甲公司当月应缴纳增值税税额的下列算式中，正确的是（\n）。","options":{"A":"155 000÷(1＋3%)×0.5%＝752.43（元）","B":"155 000÷(1＋0.5%)×0.5%＝771.14（元）","C":"155 000÷(1＋2%）×0.5%＝759.80（元）","D":"155 000×0.5%＝775（元）"},"answer":["B"],"explanation":"（1）从事二手车经销业务的纳税人销售其收购的二手车，由原按照简易办法依\n3%征收率减按2%征收增值税，改为减按0.5%征收增值税；（2）当月销售额含增\n值税，需作价税分离；（3）甲公司当月应缴纳增值税税额＝155 000÷(1＋0.5%)\n×0.5%＝771.14(元)。"},{"id":"q0124","chapter":"第4章","type":"single","stem":"某商场为增值税一般纳税人，2026 年3 月销售货物取得含增值税销售额101.7\n万元，销售餐饮服务取得含增值税销售额21.2 万元。已知销售货物的增值税税\n率为13%，销售餐饮服务增值税税率为6%。计算该商场当月增值税销项税额的下\n列算式中，正确的是（\n）。","options":{"A":"101.7÷（1＋13%）×13%＋21.2÷（1＋6%）×6%＝12.9（万元）","B":"（101.7＋21.2）÷（1＋13%）×13%＝14.14（万元）","C":"101.7÷（1＋13%）×13%＋21.2×6%＝12.97（万元）","D":"101.7×13%＋21.2×6%＝14.49（万元）"},"answer":["A"],"explanation":"商场销售货物并销售餐饮服务属于“兼营”行为，应分别核算增值税。销售额为含\n税价，需要换算为不含税金额。"},{"id":"q0125","chapter":"第4章","type":"single","stem":"甲企业为增值税一般纳税人，2025 年9 月采取还本销售方式销售一批货物，\n取得含增值税销售额339 万元，合同约定3 年后退给购货方80.6 万元。计算甲\n企业当月上述业务增值税销项税额的下列算式中，正确的是（\n）。","options":{"A":"（339－80.6）×13%＝33.59（万元）","B":"339÷（1＋13%）×13%＝39（万元）","C":"339×13%＝44.07（万元）","D":"（339－80.6）÷（1＋13%）×13%＝29.73（万元）"},"answer":["B"],"explanation":"（1）采用还本销售方式销售货物，其销售额就是货物的销售价格，不得减除还\n本支出，排除选项A、D；（2）含增值税销售额339 万元，需价税分离，排除\n选项C；（3）甲企业上述业务增值税销项税额＝339÷（1＋13%）×13%＝39（万\n元）。"},{"id":"q0126","chapter":"第4章","type":"single","stem":"甲公司为增值税一般纳税人，2025 年5 月销售啤酒取得含税价款226 万元，\n另收取包装物租金1.13 万元，包装物押金3.39 万元，已知增值税适用税率为13%，\n计算甲公司当月上述业务增值税销项税额的下列算式中，正确的是（\n）。","options":{"A":"（226＋1.13）÷（1＋13%）×13%＝26.13（万元）","B":"226÷（1＋13%）×13%＝26（万元）","C":"226×13%＝29.38（万元）","D":"（226＋1.13＋3.39）÷（1＋13%）×13%＝26.52（万元）"},"answer":["A"],"explanation":"（1）包装物租金属于价外费用，需要计入销售额计算增值税，排除选项B、C；\n（2）啤酒、黄酒的包装物押金在收取时不征收增值税，逾期时计算缴纳增值税，\n排除选项D；（3）甲公司上述业务增值税销项税额＝（226＋1.13）÷（1＋13%）\n×13%＝26.13（万元）。"},{"id":"q0127","chapter":"第4章","type":"single","stem":"制胜公司为增值税一般纳税人，2026 年1 月将10 台自产的机器设备无偿转让\n给乙公司，该批设备生产成本合计154 000 元，市场同类设备含税销售价格为\n22 600 元/台，已知增值税税率为13%，成本利润率为10%。计算制胜公司当月\n该笔业务增值税销项税额的下列算式中，正确的是（\n）。","options":{"A":"10×22 600×13%＝29 380（元）","B":"154 000×13%＝20 020（元）","C":"154 000×（1＋10%）×13%＝22 022（元）","D":"10×22 600÷（1＋13%）×13%＝26 000（元）"},"answer":["D"],"explanation":"（1）单位和个体工商户无偿转让货物属于视同应税交易，纳税人发生视同应税\n交易的，应按市场价格（22 600 元/台）确定销售额；（2）22 600 元/台为含税\n销售价格，需价税分离，不含税销售额＝10×22 600÷（1＋13%）＝200 000（元）；\n（3）制胜公司当月该笔业务增值税销项税额＝200 000×13%＝26 000（元）。"},{"id":"q0128","chapter":"第4章","type":"single","stem":"某公司为经营化妆品直销业务的增值税一般纳税人，2025 年3 月将一批化妆\n品销售给直销员李某，向李某收取含增值税价款180 800 元，另收取包装物押金\n7 910 元，并约定3 个月内返还包装物。当月李某将该批化妆品销售给消费者，\n向消费者收取含增值税价款213 570 元。已知增值税税率为13%，计算该公司当\n月上述业务增值税销项税额的下列算式中，正确的是（\n）。","options":{"A":"（180 800＋7 910）÷（1＋13%）×13%＝21 710（元）","B":"（180 800＋7 910＋213 570）×13%＝52 296.4（元）","C":"213 570÷（1＋13%）×13%＝24 570（元）","D":"180 800÷（1＋13%）×13%＝20 800（元）"},"answer":["D"],"explanation":"（1）直销企业先将货物销售给直销员，直销员再将货物销售给消费者的，直销\n企业的销售额为其向直销员收取的全部价款（含价外费用）；（2）一般货物的\n包装物押金在“逾期”时并入销售额计征增值税，收取时不并入销售额征税；（3）\n该公司当月上述业务增值税销项税额＝180 800÷（1＋13%）×13%＝20 800（元）。"},{"id":"q0129","chapter":"第4章","type":"single","stem":"A 洗衣机生产企业是增值税一般纳税人，2025 年4 月向某商场销售1 000 台\nA 型洗衣机，出厂不含增值税单价为3 500 元/台，由于商场采购量大，给予其\n9%的商业折扣，并将销售额和折扣额在同一张发票的“金额”栏分别注明。已知增\n值税税率为13%，根据增值税法律制度的规定，A 洗衣机生产企业当月该笔业务\n增值税销项税额的下列计算列式中，正确的是（\n）。","options":{"A":"3 500×1 000×13%＝455 000（元）","B":"3 500×1 000×（1－9%）×13%＝414 050（元）","C":"3 500×1 000×（1－9%）÷（1＋13%）×13%＝366 415.93（元）","D":"3 500×1 000÷（1＋13%）×13%＝402 654.87（元）"},"answer":["B"],"explanation":"（1）销售额和折扣额在同一张发票“金额”栏分别注明，可以按折扣后的销售额\n征收增值税，排除选项A、D；（2）题中价格为不含税价格，无须作价税分离，\n排除选项C。"},{"id":"q0130","chapter":"第4章","type":"single","stem":"甲公司为一般纳税人，本月销售新型冰箱50 台，每台含税价格5 800 元；采\n取以旧换新方式销售同型号冰箱20 台，收回的旧冰箱每台作价232 元，实际每\n台收取款项5 568 元。计算甲公司当月增值税销项税额的下列算式中，正确的是\n（\n）。","options":{"A":"[50×5 800＋20×（5 568－232）]×13%＝51 573.6（元）","B":"（50×5 800＋20×5 568）÷（1＋13%）×13%＝46 174.16（元）","C":"（50＋20）×5 800÷（1＋13%）×13%＝46 707.96（元）","D":"（50×5 800＋20×5 568）×13%＝52 176.8（元)"},"answer":["C"],"explanation":"（1）纳税人采取以旧换新方式销售非金银首饰的，应按新货物的同期销售价格\n确定销售额。因此以旧换新方式销售的20 台冰箱应按5 800 元/台的价格计算销\n售额。（2）含税价格需作价税分离，因此甲公司当月增值税销项税额＝（50＋\n20）×5 800÷（1＋13%）×13%＝46 707.96（元）。"},{"id":"q0131","chapter":"第4章","type":"single","stem":"甲航空公司开展航空运输服务取得国内运输服务不含增值税收入1 100 万元、\n国际运输服务不含增值税收入300 万元，另代收民航发展基金50 万元。计算增\n值税销项税额的下列算式中，正确的是（\n）。","options":{"A":"（1 100＋300）×9%＝126（万元）","B":"（1 100＋300＋50）×9%＝130.5（万元）","C":"1 100×9%＝99（万元）","D":"（1 100＋50）×9%＝103.5（万元）"},"answer":["C"],"explanation":"（1）国际运输服务适用零税率，销项税额为零，首先排除选项A、B；（2）甲\n航空公司代收的民航发展基金不属于甲航空公司的收入，不缴纳增值税，排除选\n项D；（3）甲航空公司增值税销项税额＝1 100×9%＝99（万元）。"},{"id":"q0132","chapter":"第4章","type":"single","stem":"甲企业（增值税一般纳税人）为一家食品厂，2025 年7 月向农民收购一批番\n茄，当月已全部用于生产番茄酱，农产品的收购发票上注明收购价款为100 万元。\n已知购进用于生产或委托加工13%税率货物的农产品，按照10%的扣除率计算进\n项税额。甲企业当月该笔业务可以抵扣的进项税额是（\n）万元。","options":{"A":"3","B":"13","C":"9","D":"10"},"answer":["D"],"explanation":"（1）本题从农民手中购进农产品，取得农产品收购发票，按农产品收购发票注\n明的买价和扣除率计算准予抵扣的进项税额；（2）甲企业当月购进番茄可以抵\n扣的进项税额＝100×10%＝10（万元）。"},{"id":"q0133","chapter":"第4章","type":"single","stem":"甲公司取得注明本公司业务经理身份信息的因公出差国内旅客运输客票两\n张，一张为航空旅客行程单，注明的票价和燃油附加费合计3 270 元，民航发展\n基金100 元；另一张为公路客运发票，票面金额为515 元，已知航空、铁路旅\n客运输按9%计算进项税额，公路、水路按照3%计算进项税额。甲公司可以抵扣\n的进项税额为（\n）元。","options":{"A":"0","B":"15","C":"270","D":"285"},"answer":["D"],"explanation":"取得注明旅客身份信息的航空运输电子客票行程单的，进项税额＝（票价+燃油\n附加费）÷（1＋9%）×9%；取得注明旅客身份信息的公路、水路等其他客票的，\n进项税额＝票面金额÷（1+3%）×3%；因此甲公司可以抵扣的进项税额＝3 270÷\n（1＋9%）×9%＋515÷（1＋3%）×3%＝285（元）。"},{"id":"q0134","chapter":"第4章","type":"single","stem":"甲公司为增值税一般纳税人，12 月销售货物取得含增值税销售额113 万元。\n当月购进货物可抵扣的增值税进项税额为3.7 万元，上期留抵税额2.8 万元。已\n知增值税税率为13%，甲公司选择本期继续抵扣上期留抵税额。计算甲公司当月\n应缴纳增值税税额的下列算式中，正确的是（\n）。","options":{"A":"113÷（1＋13%）×13%－2.8＝10.2（万元）","B":"113×13%－3.7－2.8＝8.19（万元）","C":"113÷（1＋13%）×13%－3.7＝9.3（万元）","D":"113÷（1＋13%）×13%－3.7－2.8＝6.5（万元）"},"answer":["D"],"explanation":"（1）计算销项税额：销售货物的113 万元属于含税价，需价税分离，销项税额\n＝含税销售额÷（1＋增值税税率）×适用税率＝113÷（1＋13%）×13%＝13（万\n元），首先排除选项B；（2）计算可抵扣的税额：当月购进货物可抵扣的增值\n税进项税额3.7 万元可在当月全部抵扣；上期留抵税额是上期销项税额不足抵扣\n进项税额的部分，甲公司选择在本期继续抵扣，排除选项A、C；（3）计算应纳\n税额：甲公司当月应缴纳增值税税额＝销项税额－进项税额－上期留抵税额＝13\n－3.7－2.8＝6.5（万元）。"},{"id":"q0135","chapter":"第4章","type":"single","stem":"甲公司为增值税小规模纳税人，2026 年第一季度销售货物取得含增值税销售\n额80.8 万元，购进货物取得的增值税普通发票注明税额0.65 万元。已知增值税\n征收率为1%。计算甲公司该季度应缴纳增值税税额的下列算式中，正确的是\n（\n）。","options":{"A":"80.8÷（1＋1%）×1%－0.65＝0.15（万元）","B":"80.8×1%－0.65＝0.16（万元）","C":"80.8÷（1＋1%）×1%＝0.8（万元）","D":"80.8×1%＝0.81（万元）"},"answer":["C"],"explanation":"（1）该季度销售货物取得的销售额是含税金额，需价税分离，首先排除选项B、\nD；（2）小规模纳税人采用简易计税方法，购进货物无论取得增值税普通发票\n还是增值税专用发票，均不得抵扣进项税额，排除选项A；（3）甲公司该季度\n应缴纳增值税税额＝含税销售额÷（1＋征收率）×征收率＝80.8÷（1＋1%）×1%\n＝0.8（万元）。"},{"id":"q0136","chapter":"第4章","type":"single","stem":"甲公司为增值税一般纳税人，从国外进口一批音响，海关核定的关税计税价\n格为113 万元，缴纳关税11.3 万元。已知增值税税率为13%，甲公司该笔业务\n应缴纳增值税税额的下列计算中，正确的是（\n）。","options":{"A":"113×13%＝14.69（万元）","B":"（113＋11.3）×13%＝16.159（万元）","C":"113÷（1＋13%）×13%＝13（万元）","D":"（113＋11.3）÷（1＋13%）×13%＝14.3（万元）"},"answer":["B"],"explanation":"纳税人进口货物，无论是一般纳税人还是小规模纳税人，均应按照组成计税价格\n和规定的税率计算应纳税额，应纳税额＝组成计税价格×税率，音响不属于消费\n税征税范围，因此组成计税价格＝关税计税价格＋关税。"},{"id":"q0137","chapter":"第4章","type":"single","stem":"根据增值税法律制度的规定，下列关于增值税纳税地点和计税期间的表述中，\n不正确的是（\n）。","options":{"A":"自然人提供建筑服务，应向建筑服务发生地主管税务机关申报纳税","B":"无固定生产经营场所的纳税人，应当向其机构所在地或者居住地的税务机关申\n报纳税","C":"纳税人以1 个月为1 个计税期间的，自期满之日起15 日内申报纳税","D":"一般纳税人中的银行，增值税计税期间可以为一个季度"},"answer":["B"],"explanation":"选项B，无固定生产经营场所的纳税人，应当向其“应税交易发生地”主管税务机\n关申报纳税；未申报纳税的，由其机构所在地或者居住地主管税务机关补征税款。"},{"id":"q0138","chapter":"第4章","type":"single","stem":"根据增值税法律制度的规定，下列关于增值税纸质专用发票记账联用途的表\n述中，正确的是（\n）。","options":{"A":"作为购买方报送主管税务机关认证和留存备查的扣税凭证","B":"作为销售方核算销售收入和增值税销项税额的记账凭证","C":"作为购买方核算采购成本的记账凭证","D":"作为购买方核算增值税进项税额的记账凭证"},"answer":["B"],"explanation":"选项A，是增值税专用发票抵扣联的用途；选项C、D，是增值税专用发票发票\n联的用途。"},{"id":"q0139","chapter":"第4章","type":"single","stem":"关于全面数字化电子发票（简称“数电发票”）的下列说法中，正确的是（\n）","options":{"A":"购买方的开户银行是数电发票的票面基本内容之一","B":"数电发票与纸质发票具有同等法律效力","C":"数电发票的基本联次包括发票联、抵扣联和记账联","D":"纳税人开具的数电发票只能通过电子发票服务平台自动交付"},"answer":["B"],"explanation":"数电发票的票面基本内容包括发票名称、发票号码、开票日期、购买方信息、销\n售方信息、项目名称、规格型号、单位、数量、单价、金额、税率/征收率、税\n额、合计、价税合计、备注、开票人等，不包括购买方的开户银行，选项A 错\n误；数电发票为单一联次，选项C 错误；纳税人开具的数电发票通过电子发票\n服务平台自动交付，也可通过电子邮件、二维码、下载打印等方式交付，选项D\n错误。"},{"id":"q0140","chapter":"第4章","type":"single","stem":"根据消费税法律制度的规定，下列各项中，不征收消费税的是（\n）。","options":{"A":"经销商零售纯电动超豪华小汽车","B":"汽车制造企业生产并销售纯电动超豪华小汽车","C":"日化厂用于职工奖励的自产高档化妆品","D":"为经营单位以外的单位和个人加工金银首饰"},"answer":["B"],"explanation":"对纯电动、燃料电池等没有气缸容量（排气量）的超豪华小汽车仅在零售环节征\n收消费税，生产环节不征收消费税，选项B 当选。"},{"id":"q0141","chapter":"第4章","type":"single","stem":"根据消费税法律制度的规定，下列各项应税消费品中，采用从量定额计征消\n费税的是（\n）。","options":{"A":"啤酒","B":"葡萄酒","C":"白酒","D":"药酒"},"answer":["A"],"explanation":"（1）从价定率计征消费税：绝大多数应税消费品。（2）从量定额计征消费税：\n啤酒、黄酒、成品油。（3）从价定率和从量定额相结合的复合计征办法征收消\n费税：卷烟和白酒。"},{"id":"q0142","chapter":"第4章","type":"single","stem":"根据消费税法律制度的规定，下列各项中，属于消费税征税范围的是（\n）。","options":{"A":"戏剧演员化妆用的上妆油","B":"医用酒精","C":"铂金首饰","D":"进口的电脑芯片"},"answer":["C"],"explanation":"选项A、B、D，均不属于消费税的征税范围。"},{"id":"q0143","chapter":"第4章","type":"single","stem":"根据消费税法律制度的规定，下列各项中，应以纳税人同类应税消费品的最\n高销售价格作为计税依据计征消费税的是（\n）。","options":{"A":"用于无偿赠送的应税消费品","B":"用于集体福利的应税消费品","C":"用于换取生产资料的应税消费品","D":"用于连续生产非应税消费品的应税消费品"},"answer":["C"],"explanation":"纳税人用于换取生产资料和消费资料、投资入股和抵偿债务等方面的应税消费\n品，应当以纳税人同类应税消费品的最高销售价格作为计税依据计算消费税。"},{"id":"q0144","chapter":"第4章","type":"single","stem":"甲摩托车厂为增值税一般纳税人，将一批自产气缸容量250 毫升的摩托车移\n送至自设非独立核算门市部用于销售，出厂含增值税价为50.85 万元，门市部对\n外销售了其中的80%，取得含增值税销售额67.8 万元。已知增值税税率为13%，\n消费税税率为3%，计算甲摩托车厂上述业务应缴纳消费税的下列算式中，正确\n的是（\n）。","options":{"A":"50.85×80%÷（1＋13%）×3%＝1.08（万元）","B":"50.85÷（1＋13%）×3%＝1.35（万元）","C":"67.8÷（1＋13%）×3%＝1.8（万元）","D":"67.8×3%＝2.034（万元）"},"answer":["C"],"explanation":"（1）纳税人通过自设非独立核算门市部销售的自产应税消费品，应当按照门市\n部对外销售额或者销售数量征收消费税，排除选项A、B。（2）“67.8 万元”明确\n交代“含增值税”，要作价税分离处理，排除选项D。"},{"id":"q0145","chapter":"第4章","type":"single","stem":"某炼油厂2026 年2 月生产汽油5 500 吨，其中5 000 吨对外销售，2 吨用于\n本单位管理部门车辆使用，3 吨用于职工福利，剩余汽油尚未销售使用。已知汽\n油1 吨＝1 388 升，汽油消费税税率为1.52 元/升。计算该炼油厂当月应缴纳消\n费税的下列算式中，正确的是（\n）。","options":{"A":"5 500×1 388×1.52÷10 000＝1 160.37（万元）","B":"（5 000＋2）×1 388×1.52÷10 000＝1 055.30（万元）","C":"（5 000＋3）×1 388×1.52÷10 000＝1 055.51（万元）","D":"（5 000＋2＋3）×1 388×1.52÷10 000＝1 055.93（万元）"},"answer":["D"],"explanation":"（1）纳税人生产销售应税消费品，于纳税人销售时按照销售数量（5 000 吨）\n缴纳消费税。（2）纳税人自产自用的应税消费品，用于连续生产应税消费品的，\n不纳税；凡用于其他方面的（管理部门、职工福利等），于移送使用时，按照移\n送使用数量（2 吨＋3 吨）计算缴纳消费税。（3）该炼油厂当月应缴纳消费税＝\n（5 000＋2＋3）×1 388×1.52÷10 000＝1 055.93（万元）。"},{"id":"q0146","chapter":"第4章","type":"single","stem":"甲公司为增值税一般纳税人，2026 年2 月以20 辆自产中轻型商用客车投资\n乙公司，该类中轻型商用客车生产成本为156 000 元/辆，含增值税平均售价为\n220 000 元/辆，含增值税最高售价237 000 元/辆。已知增值税税率为13%，消\n费税税率为5%。计算甲公司当月该笔业务应缴纳消费税税额的下列算式中，正\n确的是（\n）。","options":{"A":"20×220 000÷（1＋13%）×5%＝194 690.27（元）","B":"20×237 000×5%＝237 000（元）","C":"20×237 000÷（1＋13%）×5%＝209 734.51（元）","D":"20×156 000÷（1＋13%）×5%＝138 053.10（元）"},"answer":["C"],"explanation":"（1）纳税人用于换取生产资料和消费资料、抵偿债务和投资入股等方面的应税\n消费品，应当以纳税人同类应税消费品的不含税最高销售价格作为计税依据计算\n消费税；（2）已知条件中含增值税最高售价为237 000 元/辆，需作价税分离；\n（3）甲公司当月该笔业务应缴纳消费税税额＝20×237 000÷（1＋13%）×5%＝\n209 734.51（元）。"},{"id":"q0147","chapter":"第4章","type":"single","stem":"5 元/500 克，1 吨＝1 000 千克。计算甲酒厂该笔业务应代收代缴消费税额的\n下列算式中，正确的是（\n）。","options":{"A":"（500 000＋60 000＋10×1 000×2×0.5）÷（1－20%）×20%＝142 500（元）","B":"10×90 000×20%＋10×1 000×2×0.5＝190 000（元）","C":"500 000×20%＋10×1 000×2×0.5＝110 000（元）","D":"（500 000＋60 000）÷（1－20%）×20%＋10×1 000×2×0.5＝150 000（元）"},"answer":["B"],"explanation":"（1）计算委托加工应纳消费税时，先找受托方的同类售价，无同类售价再组价，\n本题中甲酒厂有同类白酒售价，则按同类白酒售价90 000 元/吨计算纳税，不必\n考虑组成计税价格；（2）白酒复合计征消费税，应纳消费税税额＝受托方同类\n产品的销售价格×比例税率＋委托加工数量×定额税率＝10×90 000×20%＋10×1\n000×2×0.5＝190 000（元）。"},{"id":"q0148","chapter":"第4章","type":"single","stem":"2026 年2 月丁酒厂销售自产白酒15 000 瓶，500g/瓶，收取不含增值税销售\n额1 500 000 元，同时收取白酒包装物押金22 600 元，同时本月没收3 个月前\n收取的逾期包装物押金11 300 元。已知白酒适用消费税比例税率为20%，定额\n税率为0.5 元/500 克，1 吨＝1 000 千克。计算丁酒厂当月销售白酒应缴纳消费\n税的下列算式中，正确的是（\n）。","options":{"A":"[1 500 000＋22 600÷（1＋13%）]×20%＝304 000（元）","B":"[1 500 000＋11 300÷（1＋13%）]×20%＋15 000×0.5＝309 500（元）","C":"[1 500 000＋22 600÷（1＋13%）]×20%＋15 000×0.5＝311 500（元）","D":"1 500 000×20%＋15 000×0.5＝307 500（元）"},"answer":["C"],"explanation":"（1）白酒的消费税采用复合计征办法；（2）白酒的包装物押金在“收取”时作为\n价外费用并入销售额中计算缴纳消费税，本月没收3 个月前收取的逾期包装物押\n金在3 个月前收取时已经缴纳消费税，本月不再重复计税；（3）包装物押金默\n认为含税价，需作价税分离；（4）丁酒厂当月销售白酒应缴纳消费税＝从价计\n征税额＋从量计征税额＝[1 500 000＋22 600÷（1＋13%）]×20%＋15 000×0.5＝\n311 500（元）。"},{"id":"q0149","chapter":"第4章","type":"single","stem":"2026 年1 月甲地板厂受托为乙公司加工一批实木地板，乙公司提供的材料成\n本为950 000 元，甲地板厂收取不含增值税加工费332 500 元。甲地板厂无同类\n实木地板销售价。已知消费税税率为5%，计算甲地板厂上述业务应代收代缴消\n费税税额的下列算式中，正确的是（\n）。","options":{"A":"（950 000＋332 500）×5%＝64 125（元）","B":"（950 000＋332 500）×（1－5%）×5%＝60 918.75（元）","C":"950 000×5%＝47 500（元）","D":"（950 000＋332 500）÷（1－5%）×5%＝67 500（元）"},"answer":["D"],"explanation":"（1）计算委托加工应纳消费税时，先找受托方的同类售价，无同类售价再组价，\n本题实木地板无受托方同类售价，因此需组价；（2）实木地板从价计征消费税，\n其组成计税价格＝（材料成本＋加工费）÷（1－消费税比例税率），因此甲地\n板厂应代收代缴的消费税税额＝组成计税价格×消费税税率＝（950 000＋332\n500）÷（1－5%）×5%＝67 500（元）。"},{"id":"q0150","chapter":"第4章","type":"single","stem":"某日化厂为增值税一般纳税人，本月将自产的100 件高档化妆品无偿赠送给\n消费者，每件高档化妆品的生产成本为50 元。已知，消费税税率为15%，成本\n利润率为5%，没有同类高档化妆品的销售价格。有关该日化厂当月应缴纳的消\n费税，下列计算列式正确的是（\n）。","options":{"A":"50×100×15%＝750（元）","B":"50×100×（1＋5%）×15%＝787.5（元）","C":"50×100×（1＋5%）÷（1+15%）×15%＝684.78（元）","D":"50×100×（1＋5%）÷（1-15%）×15%＝926.47（元）"},"answer":["D"],"explanation":"将自产的高档化妆品无偿赠送给消费者，且没有同类高档化妆品的销售价格，应\n按照组成计税价格计算消费税。高档化妆品属于从价定率计征消费税的应税消费\n品，组成计税价格＝成本×（1＋成本利润率）÷（1-消费税税率）。"},{"id":"q0151","chapter":"第4章","type":"single","stem":"甲公司进口一批小汽车，海关确定的关税计税价格为100 万元，缴纳关税20\n万元，已知小汽车消费税税率为25%，甲公司当月进口小汽车应缴纳消费税税额\n的下列计算中，正确的是（\n）。","options":{"A":"（100＋20）×25%＝30（万元）","B":"（100＋20）÷（1－25%）×25%＝40（万元）","C":"100×25%＝25（万元）","D":"100÷（1－25%）×25%＝33.33（万元）"},"answer":["B"],"explanation":"甲公司应纳消费税＝（关税计税价格＋关税）÷（1－消费税税率）×消费税税率\n＝（100＋20）÷（1－25%）×25%＝40（万元）。"},{"id":"q0152","chapter":"第4章","type":"single","stem":"根据消费税法律制度的规定，下列情形中，准予抵扣已纳消费税的是（\n）。","options":{"A":"外购已税珠宝玉石为原料生产的金银首饰","B":"外购已税珠宝生产高档手表","C":"外购已税白酒为原料生产的白酒","D":"外购已税鞭炮、焰火为原料生产的鞭炮、焰火"},"answer":["D"],"explanation":"选项A，纳税人用外购的已税珠宝、玉石原料生产的改在零售环节征收消费税的\n金银首饰（镶嵌首饰），在计税时一律不得扣除外购珠宝、玉石的已纳消费税税\n款；选项B，允许扣税的只涉及同一税目中应税消费品的连续加工，不能跨税目\n扣除，珠宝和高档手表分属不同税目，不得扣除已纳消费税；选项C，酒（外购\n葡萄酒除外）、小汽车、摩托车、高档手表、游艇、电池、涂料等不允许扣除已\n纳消费税。"},{"id":"q0153","chapter":"第4章","type":"single","stem":"2026 年1 月，甲卷烟厂期初库存外购已税烟丝不含增值税买价120 000 元，\n本月外购已税烟丝不含增值税买价440 000 元，期末库存外购已税烟丝不含增值\n税买价80 000 元，领用的外购已税烟丝当月全部用于连续生产卷烟，生产的卷\n烟当月全部销售。已知烟丝消费税税率为30%。计算甲卷烟厂准予扣除外购已税\n烟丝已纳消费税税额的下列算式中，正确的是（\n）。","options":{"A":"（120 000＋440 000－80 000）×30%＝144 000（元）","B":"（440 000－120 000）×30%＝96 000（元）","C":"（440 000－120 000＋80 000）×30%＝120 000（元）","D":"（120 000＋440 000）÷（1－30%）×30%＝240 000（元）"},"answer":["A"],"explanation":"（1）当期准予扣除外购应税消费品的已纳消费税税款，应按“当期生产领用数量”\n计算；（2）当期准予扣除的外购应税消费品买价＝期初库存的外购应税消费品\n的买价（120 000）＋当期购进的应税消费品的买价（440 000）－期末库存的外\n购应税消费品的买价（80 000）；（3）甲卷烟厂准予扣除外购已税烟丝已纳消\n费税税额＝当期准予扣除的外购烟丝买价×烟丝适用税率＝（120 000＋440 000\n－80 000）×30%＝144 000（元）。"},{"id":"q0154","chapter":"第4章","type":"single","stem":"根据消费税法律制度的规定，下列关于消费税纳税义务发生时间的表述中，\n不正确的是（\n）。","options":{"A":"纳税人自产自用应税消费品的，为移送使用的当天","B":"纳税人委托加工应税消费品的，为支付加工费的当天","C":"纳税人进口应税消费品的，为报关进口的当天","D":"纳税人销售应税消费品采取预收款方式的，为发出应税消费品的当天"},"answer":["B"],"explanation":"纳税人委托加工应税消费品的，消费税纳税义务发生时间为纳税人提货的当天。"},{"id":"q0155","chapter":"第4章","type":"single","stem":"2026 年2 月，位于A 市的甲企业当月应缴增值税30 万元，向税务机关实际\n缴纳20 万元，应缴消费税28 万元，向税务机关实际缴纳12 万元。向海关缴纳\n进口环节增值税和消费税5 万元。已知城市维护建设税税率为7%，计算该企业\n当月应缴纳的城市维护建设税的下列算式中，正确的是（\n）。","options":{"A":"（30＋28）×7%＝4.06（万元）","B":"（20＋12）×7%＝2.24（万元）","C":"（30＋28＋5）×7%＝4.41（万元）","D":"（20＋12＋5）×7%＝2.59（万元）"},"answer":["B"],"explanation":"（1）城市维护建设税的计税依据为纳税人实际缴纳的增值税、消费税税额；（2）\n海关对进口货物、服务和无形资产代征的增值税、消费税，不征城建税、教育费\n附加和地方教育附加；（3）该企业当月应缴纳城市维护建设税＝（实缴增值税\n＋实缴消费税）×税率＝（20＋12）×7%＝2.24（万元）。"},{"id":"q0156","chapter":"第4章","type":"single","stem":"根据教育费附加法律制度的规定，下列选项中，表述正确的是（\n）。","options":{"A":"对进口产品征收的增值税，应征收教育费附加","B":"对进口产品征收的消费税，应征收教育费附加","C":"对向税务局实际缴纳的增值税，应征收教育费附加","D":"对向税务局实际缴纳的土地增值税，应征收教育费附加"},"answer":["C"],"explanation":"海关对进口货物、服务和无形资产代征的增值税、消费税，不征城建税、教育费\n附加和地方教育附加，选项A、B 不当选；教育费附加的计税依据为实际缴纳的\n增值税、消费税税额，不包括土地增值税，选项C 当选，选项D 不当选。"},{"id":"q0157","chapter":"第4章","type":"single","stem":"甲公司2026 年1 月进口自用小汽车一辆，海关确定关税计税价格120 万元，\n缴纳关税30 万元、消费税50 万元。已知，车辆购置税税率为10%。计算甲公司\n进口自用该小汽车应缴纳车辆购置税税额的下列算式中，正确的是（\n）。","options":{"A":"（120＋30）×10%＝15（万元）","B":"（120＋50）×10%＝17（万元）","C":"120×10%＝12（万元）","D":"（120＋30＋50）×10%＝20（万元）"},"answer":["D"],"explanation":"进口小汽车车辆购置税的计税依据＝关税计税价格＋关税＋消费税＝120＋30\n＋50＝200（万元）；应纳车辆购置税＝计税依据×税率＝200×10%＝20（万元）。"},{"id":"q0158","chapter":"第4章","type":"single","stem":"甲汽车专卖店购入小汽车12 辆，下列行为中，应当由甲汽车专卖店作为纳税\n人缴纳车辆购置税的是（\n）。","options":{"A":"将其中6 辆销售给客户","B":"将其中2 辆作为董事长、总经理的专用轿车","C":"将其中1 辆赠送给乙企业","D":"库存3 辆尚未售出"},"answer":["B"],"explanation":"选项A，应当由购买方缴纳；选项B，属于“购买并自用”，甲汽车专卖店应当就\n该2 辆小汽车缴纳车辆购置税；选项C，应当由受赠方缴纳；选项D，购入待售\n车辆不需要缴纳车辆购置税，待进一步处置时再行确定纳税人、缴纳车辆购置税。"},{"id":"q0159","chapter":"第4章","type":"single","stem":"下列各项中，不需要缴纳车辆购置税的是（\n）。","options":{"A":"排气量200 毫升的摩托车","B":"汽车挂车","C":"电动自行车","D":"汽车"},"answer":["C"],"explanation":"车辆购置税的征税范围：汽车（选项D）、有轨电车、汽车挂车（选项B）、排\n气量超过150 毫升的摩托车（选项A）。"},{"id":"q0160","chapter":"第4章","type":"single","stem":"2026 年1 月甲汽车厂从境外乙公司处进口一批滚动轴承，成交价格为4 600\n万元，运抵我国关境内输入地点起卸前的运费及保险费共276 万元。已知关税税\n率为8%，计算甲汽车厂当月该笔业务应纳关税税额的下列算式中，正确的是\n（\n）。","options":{"A":"（4 600＋276）×8%＝390.08（万元）","B":"4 600÷（1－8%）×8%＝400（万元）","C":"4 600×8%＝368（万元）","D":"（4 600－276）×8%＝345.92（万元）"},"answer":["A"],"explanation":"进口货物的关税计税价格以成交价格（4 600 万元）以及该货物运抵我国境内输\n入地点起卸前的运输及其相关费用、保险费（276 万元）为基础确定，甲汽车厂\n当月该笔业务应纳关税税额＝关税计税价格×关税税率＝（4 600＋276）×8%＝"},{"id":"q0161","chapter":"第4章","type":"multiple","stem":"下列各项中，属于税法要素的有（\n）。","options":{"A":"税率","B":"征税对象","C":"纳税人","D":"税收优惠"},"answer":["A","B","C","D"],"explanation":"税法要素一般包括纳税人、征税对象、税率、计税依据、纳税环节、纳税期限、\n纳税地点、税收优惠、法律责任等。"},{"id":"q0162","chapter":"第4章","type":"multiple","stem":"海关负责征收的税种包括（\n）。","options":{"A":"关税","B":"车船税","C":"船舶吨税","D":"印花税"},"answer":["A","C"],"explanation":"海关主要负责下列税种的征收和管理：①关税；②船舶吨税；③进口环节的增值\n税、消费税由海关代征。"},{"id":"q0163","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，下列选项中，属于“建筑服务”的有（\n）。","options":{"A":"平整土地","B":"出售写字楼","C":"固定电话的开户费","D":"加工修理修配服务"},"answer":["A","C"],"explanation":"选项A，属于“建筑服务——其他建筑服务”；选项B，属于“销售不动产”；选项C，\n属于“建筑服务——安装服务”；选项D，加工修理修配服务不属于“建筑服务”。"},{"id":"q0164","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，下列各项中，属于“交通运输服务”的有（\n）。","options":{"A":"出租车公司向使用本公司自有出租车的出租车司机收取的管理费用","B":"水路运输的程租、期租业务","C":"航空运输的湿租业务","D":"无运输工具承运业务"},"answer":["A","B","C","D"],"explanation":"选项A，出租车公司向使用本公司自有出租车的出租车司机收取的管理费用，按\n照陆路运输服务缴纳增值税；选项B，水路运输的程租、期租业务，属于水路运\n输服务；选项C，航空运输的湿租业务，属于航空运输服务；选项D，无运输工\n具承运业务，按照交通运输服务缴纳增值税。"},{"id":"q0165","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，下列各项业务中，属于“电信服务—增值电信服务”\n的有（\n）。","options":{"A":"互联网接入服务","B":"宽带安装服务","C":"卫星电视信号落地转接服务","D":"信息技术服务"},"answer":["A","C"],"explanation":"选项B，属于“建筑服务—安装服务”；选项D，属于“生产生活服务”。"},{"id":"q0166","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，下列各项中，属于“租赁服务—不动产租赁服务”\n的有（\n）。","options":{"A":"融资性售后回租","B":"车辆停放服务","C":"道路通行服务","D":"飞机、车辆等有形动产的广告位出租"},"answer":["B","C"],"explanation":"选项A，属于“金融服务—贷款服务”；选项D，属于“租赁服务—有形动产租赁服\n务”。"},{"id":"q0167","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，下列选项中，应按照“金融服务”税目计算缴纳增\n值税的有（\n）。","options":{"A":"直接收费金融服务","B":"以货币资金投资收取的固定利润","C":"保险服务","D":"金融商品转让"},"answer":["A","B","C","D"],"explanation":"选项A、B、C、D，均按照“金融服务”税目计算缴纳增值税。"},{"id":"q0168","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，下列选项中，属于视同应税交易情形的有（\n）。","options":{"A":"单位将外购的货物用于个人消费","B":"个体工商户无偿转让货物","C":"个人无偿转让金融商品","D":"单位将自产的货物用于集体福利"},"answer":["B","C","D"],"explanation":"选项A，单位将外购的货物用于个人消费，不视同应税交易，其进项税额不得抵\n扣。"},{"id":"q0169","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，下列情形中，属于在境内发生应税交易的有\n（\n）。","options":{"A":"境内企业向境外企业销售在境内发行的金融商品","B":"境外企业向境外企业出租位于境内的办公楼","C":"境外企业向境内企业销售位于境内的货物","D":"境外企业向境内企业转让与境内自然资源直接相关的无形资产"},"answer":["A","B","C","D"],"explanation":"选项A、B、C、D，均属于在境内发生应税交易的情形。"},{"id":"q0170","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，下列各项中，属于增值税混合销售行为的有\n（\n）。","options":{"A":"购物中心既销售商品又提供餐饮服务","B":"空调专卖店在销售空调的同时提供安装服务","C":"家具厂既销售家具又提供设计服务","D":"歌舞厅向客户提供娱乐服务的同时又向其销售食品"},"answer":["B","D"],"explanation":"混合销售的本质是“一项应税交易”，需同时满足两个条件：（1）包含两个以上\n涉及不同税率、征收率的业务；（2）业务之间具有明显的主附关系。选项A、C，\n所涉及业务之间均不具有明显的主附关系，不属于混合销售；选项B、D，均属\n于两项涉及不同税率的业务，且二者具有明显的主附关系，应归属为一项应税交\n易，属于混合销售。"},{"id":"q0171","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，下列各项中，属于不征收增值税项目的有\n（\n）。","options":{"A":"行政机关取得的政府性基金","B":"企业取得的存款利息","C":"员工为受雇单位提供取得工资、薪金的服务","D":"企业销售货物同时取得的包装费"},"answer":["A","B","C"],"explanation":"选项D，包装费属于价外费用，在销售货物时随同货款一并计算缴纳增值税。"},{"id":"q0172","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，一般纳税人发生的下列应税交易中，可以选择\n适用简易计税方法的有（\n）。","options":{"A":"电影发行服务","B":"仓储服务","C":"销售以水泥为原料生产的商品混凝土","D":"销售自产自来水"},"answer":["B","C","D"],"explanation":"选项B、C、D，均可以选择适用简易计税方法；选项A，一般纳税人提供电影“放\n映”服务可以选择适用简易计税方法计税，不包括电影“发行”服务。"},{"id":"q0173","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，一般纳税人发生的下列应税交易中，可以选择\n简易计税方法的有（\n）。","options":{"A":"装卸搬运服务","B":"公共交通运输服务","C":"文化体育服务","D":"电影放映服务"},"answer":["A","B","C","D"],"explanation":"一般纳税人发生下列应税交易可以选择适用简易计税方法计税：①公共交通运输\n服务（选项B）；②动漫产品的设计、制作服务，以及在境内转让动漫版权；③\n电影放映服务（选项D）、仓储服务、装卸搬运服务（选项A）、收派服务、文\n化体育服务（选项C）；④以营改增试点前取得的有形动产为标的物提供的经营\n租赁服务；⑤营改增试点前签订的，尚未执行完毕的有形动产租赁合同。"},{"id":"q0174","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，下列各项中，一般纳税人在计算增值税销项税\n额时，不应并入销售额的有（\n）。","options":{"A":"销售货物向购买方收取的手续费","B":"以委托方名义开具发票代委托方收取的款项","C":"销售车辆的同时向购买方收取的代购买方缴纳的车辆购置税","D":"受托加工应征消费税的消费品所代收代缴的消费税"},"answer":["B","C","D"],"explanation":"销售额包括货币和非货币形式的经济利益对应的全部价款（包含价外费用，如选\n项A），不包括纳税人代为收取的下列税费或者款项：\n（1）按照一般计税方法计算的销项税额和按照简易计税方法计算的应纳税额；\n（2）政府性基金或者行政事业性收费；\n（3）受托加工应征消费税的消费品所产生的消费税（选项D）；\n（4）车辆购置税（选项C）、车船税；\n（5）以委托方名义开具发票代委托方收取的款项（选项B）。"},{"id":"q0175","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，下列关于包装物押金和租金的说法中，正确的\n有（\n）。","options":{"A":"对销售除啤酒、黄酒外的其他酒类产品而收取的包装物押金，无论是否返还以\n及会计上如何核算，均应并入当期销售额征收增值税","B":"包装物押金是含税收入，在并入销售额征税时，需要先将该押金换算为不含税\n收入，再计算应纳增值税税款","C":"包装物押金不同于包装物租金，包装物租金属于价外费用，在销售货物时随同\n货款一并计算增值税税款","D":"对销售啤酒而收取的1 年以上的押金，无论是否退还均并入销售额征税"},"answer":["A","B","C","D"],"explanation":"选项A、D，一般产品、啤酒、黄酒包装物押金收取时暂不并入销售额征税，若\n超过1 年或合同约定期仍未收回，才并入销售额计征增值税；而除啤酒、黄酒之\n外的酒类产品，无论是否返还以及会计上如何核算，均应并入当期销售额征收增\n值税。选项B、C，包装物租金属于价外费用，押金不一定属于价外费用，二者\n均为含税价，计算时需作价税分离换算为不含税收入。"},{"id":"q0176","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，一般纳税人取得的下列合法凭证中，属于增值\n税扣税凭证的有（\n）。","options":{"A":"农产品收购发票","B":"完税凭证","C":"海关进口增值税专用缴款书","D":"注明旅客身份信息的国内航空运输电子客票行程单"},"answer":["A","B","C","D"],"explanation":"增值税合法扣税凭证，包括增值税专用发票、海关进口增值税专用缴款书、农产\n品收购发票、农产品销售发票、完税凭证和符合规定的国内旅客运输发票。"},{"id":"q0177","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，一般纳税人发生的下列情形中，进项税额不得\n从销项税额中抵扣的有（\n）。","options":{"A":"购入货物用于个人消费","B":"购入原材料用于生产应税产品","C":"购进的商品因管理不善变质","D":"购进原材料生产的产成品因管理不善被盗"},"answer":["A","C","D"],"explanation":"选项A，购进并用于个人消费的货物，其对应的进项税额不得抵扣；选项C、D，\n非正常损失项目对应的进项税额不得抵扣。"},{"id":"q0178","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，一般纳税人发生的下列情形中，不得从销项税\n额中抵扣进项税额的有（\n）。","options":{"A":"非正常损失的不动产所耗用的建筑服务","B":"购进贷款服务的利息支出","C":"购进并直接用于消费的居民日常服务","D":"购进并直接用于消费的餐饮服务"},"answer":["A","B","C","D"],"explanation":"选项A，非正常损失的不动产，以及该不动产所耗用的购进货物和建筑服务，不\n得抵扣进项税额；选项B、C、D，购进并直接用于消费的餐饮服务、居民日常\n服务和娱乐服务，购进贷款服务的利息支出和直接相关的费用支出，不得抵扣进\n项税额。"},{"id":"q0179","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，一般纳税人发生的下列情形中，其进项税额不\n得从销项税额中抵扣的有（\n）。","options":{"A":"购进并直接用于消费的娱乐服务","B":"将购进的原料用于生产免税药品","C":"将购进的食用植物油用于职工福利","D":"将购进的建筑材料用于简易计税方法计税项目"},"answer":["A","B","C","D"],"explanation":"选项A，一般纳税人购进并直接用于消费的餐饮服务、居民日常服务和娱乐服务，\n购进贷款服务的利息支出和直接相关的费用支出，其对应的进项税额不得从销项\n税额中抵扣；选项B、D，用于简易计税方法计税项目、免征增值税项目对应的\n进项不得从销项税额中抵扣；选项C，购进并用于集体福利或者个人消费的货物、\n服务、无形资产和不动产对应的进项税额不得从销项税额中抵扣。"},{"id":"q0180","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，一般纳税人下列业务所对应的进项税额中，不\n得从销项税额中抵扣的有（\n）。","options":{"A":"购进一批原材料，因管理不善造成被盗","B":"购进装修材料，用于装修办公场所","C":"购进一批货物，被执法部门强令自行销毁","D":"购进一台设备，因地震造成毁损"},"answer":["A","C"],"explanation":"选项B，购进装修材料用于正常的生产经营，进项税额准予抵扣；选项D，因自\n然灾害（不可抗力）造成的损失，其进项税额准予抵扣。"},{"id":"q0181","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，下列各项中属于增值税免税项目的有（\n）。","options":{"A":"自然人销售的自己使用过的物品","B":"学生勤工俭学提供的服务","C":"直接用于科学研究的进口设备","D":"农业生产者销售的自产农产品"},"answer":["A","B","C","D"],"explanation":"选项A、B、C、D 均属于增值税免税项目。"},{"id":"q0182","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，下列各项中，免征增值税的有（\n）。","options":{"A":"婚姻介绍服务","B":"宗教场所举办文化、宗教活动的第一道门票收入","C":"医疗设备公司进口供残疾人使用的轮椅","D":"外国企业无偿援助的进口物资"},"answer":["A","B"],"explanation":"选项C，由“残疾人的组织”直接进口供残疾人专用的物品免征增值税，医疗设备\n公司进口不免征；选项D，“外国政府、国际组织”无偿援助的进口物资和设备免\n征增值税，外国“企业”无偿援助不免征。"},{"id":"q0183","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，下列关于增值税纳税义务发生时间的表述中，\n正确的有（\n）。","options":{"A":"纳税人进口货物的，为报关进口的当天","B":"纳税人无偿转让货物的，为对方收到货物的当天","C":"纳税人发生应税交易的，为收讫销售款项或者取得销售款项索取凭据的当天","D":"纳税人无偿转让金融商品的，为金融商品所有权转移的当天"},"answer":["A","C","D"],"explanation":"选项B，纳税人无偿转让货物的，为“发出”货物的当天，而不是对方“收到”的当\n天。"},{"id":"q0184","chapter":"第4章","type":"multiple","stem":"根据增值税法律制度的规定，一般纳税人发生的下列业务中，不得开具增值\n税专用发票的有（\n）。","options":{"A":"律师事务所向消费者个人提供咨询服务","B":"银行向一般纳税人转让金融商品","C":"农场向食品加工企业销售自产免税农产品","D":"装修公司向一般纳税人提供装修服务"},"answer":["A","B","C"],"explanation":"纳税人发生应税交易，应当向购买方开具发票。有下列情形之一的，不得开具增\n值税专用发票：（1）应税交易的购买方为自然人（选项A）；（2）应税交易免\n征增值税（选项C）；（3）国务院财政、税务主管部门规定的其他情形。选项\nB，金融商品转让，不得开具增值税专用发票。"},{"id":"q0185","chapter":"第4章","type":"multiple","stem":"根据消费税法律制度的规定，下列各项中，应缴纳消费税的有（\n）。","options":{"A":"进口电子烟","B":"零售超豪华小汽车","C":"销售自产高档化妆品","D":"委托加工白酒"},"answer":["A","B","C","D"],"explanation":"选项A、B、C、D，均属于消费税的征收范围。需注意选项B，（燃油）超豪华\n小汽车在零售环节加征一道消费税，（新能源）超豪华小汽车“仅”在零售环节征\n收消费税；由此可以得出结论，只要是超豪华小汽车，在零售环节均需要缴纳消\n费税。"},{"id":"q0186","chapter":"第4章","type":"multiple","stem":"根据消费税法律制度的规定，下列各项中，属于消费税征税范围的有（\n）。","options":{"A":"烟草批发企业将卷烟销售给其他烟草批发企业","B":"非工业企业将外购的消费税非应税产品以消费税应税产品对外销售","C":"企业生产销售木制一次性筷子","D":"商场零售钻石首饰"},"answer":["B","C","D"],"explanation":"卷烟在生产和批发环节征收消费税，批发指的是烟草批发企业将卷烟销售给零售\n单位，烟草批发企业将卷烟销售给其他烟草批发企业不属于批发环节，所以选项\nA 不属于消费税征税范围。"},{"id":"q0187","chapter":"第4章","type":"multiple","stem":"根据消费税法律制度的规定，纳税人销售自产白酒向购买方收取的下列款项\n中，应并入白酒计税销售额的有（\n）。","options":{"A":"品牌使用费","B":"包装费","C":"包装物押金","D":"包装物租金"},"answer":["A","B","C","D"],"explanation":"上述选项均需计入白酒的计税销售额中。"},{"id":"q0188","chapter":"第4章","type":"multiple","stem":"根据消费税法律制度的规定，下列关于确定从量计征消费税计税依据的说法\n中，正确的有（\n）。","options":{"A":"委托加工应税消费品的，为纳税人收回的应税消费品数量","B":"进口应税消费品的，为海关核定的应税消费品进口征税数量","C":"生产销售应税消费品的，为应税消费品的销售数量","D":"自产自用应税消费品的，为应税消费品的移送使用数量"},"answer":["A","B","C","D"],"explanation":"选项A、B、C、D，说法均正确。"},{"id":"q0189","chapter":"第4章","type":"multiple","stem":"根据关税法律制度的规定，下列说法中，不正确的有（\n）。","options":{"A":"进口货物由买方负担的购货佣金，应计入关税计税价格","B":"出口货物的收货人是关税纳税人","C":"进口原产于我国境内的货物，适用特惠税率","D":"进境物品的携带人是关税纳税人"},"answer":["A","B","C"],"explanation":"进口货物由买方负担的购货佣金“不得”计入计税价格，但买方负担的购货佣金以\n外的佣金应当计入计税价格，选项A 错误；进口原产于我国境内的货物，适用“最\n惠国税率”，选项C 错误；进口货物的收货人、出口货物的“发”货人、进境物品\n的携带人或者收件人，是关税纳税人，选项B 错误、选项D 正确。"},{"id":"q0190","chapter":"第4章","type":"multiple","stem":"下列各项中，可以免征关税的有（\n）。","options":{"A":"损毁的货物","B":"无商业价值的广告品和货样","C":"外国公司无偿赠送的物资","D":"进出境运输工具装载的途中必需的燃料、物料和饮食用品"},"answer":["B","D"],"explanation":"在海关放行前损毁或者灭失的货物、进境物品免征关税，选项A 错误；“外国政\n府、国际组织”无偿赠送的物资免税，选项C 错误。"},{"id":"q0191","chapter":"第4章","type":"judge","stem":"纳税人发生两项以上应税交易涉及不同税率、征收率的，应当按照应税交易的\n主要业务适用税率、征收率。（\n）","options":{"A":"正确","B":"错误"},"answer":["B"],"explanation":"纳税人发生两项以上应税交易涉及不同税率、征收率的，属于“兼营”行为，应当\n分别核算适用不同税率、征收率的销售额；未分别核算的，从高适用税率。"},{"id":"q0192","chapter":"第4章","type":"judge","stem":"自2023 年1 月1 日至2027 年12 月31 日，对月销售额10 万元以下(含本数)\n的增值税小规模纳税人，免征增值税。（\n）","options":{"A":"正确","B":"错误"},"answer":["A"],"explanation":"题目所述内容正确。"},{"id":"q0193","chapter":"第4章","type":"judge","stem":"原值超过300 万元的单项长期资产，购进时先全额抵扣进项税额，此后在用于\n混合用途期间，计算不得抵扣项目对应的不得从销项税额中抵扣的进项税额，逐\n年调整。（\n）","options":{"A":"正确","B":"错误"},"answer":["B"],"explanation":"原值超过“500 万元”的单项长期资产，购进时先全额抵扣进项税额，此后在用于\n混合用途期间，计算不得抵扣项目对应的不得从销项税额中抵扣的进项税额，逐\n年调整。"},{"id":"q0194","chapter":"第4章","type":"judge","stem":"享受增值税出口退税政策的不具有生产能力的出口企业或其他单位，执行免抵\n退税办法。（\n）","options":{"A":"正确","B":"错误"},"answer":["B"],"explanation":"享受增值税出口退税政策的不具有生产能力的出口企业或其他单位，执行“免退”\n税办法。"},{"id":"q0195","chapter":"第4章","type":"judge","stem":"消费税纳税人兼营不同税率的应税消费品，未分别核算销售额、销售数量的，\n从高适用税率。（\n）","options":{"A":"正确","B":"错误"},"answer":["A"],"explanation":"纳税人兼营不同税率的应税消费品，应当分别核算不同税率应税消费品的销售\n额、销售数量。未分别核算销售额、销售数量，或者将不同税率的应税消费品组\n成成套消费品销售的，从高适用税率。"},{"id":"q0196","chapter":"第4章","type":"judge","stem":"A 市甲企业委托B 市乙企业加工一批应税消费品，该批消费品应缴纳的消费税\n税款应由乙企业向B 市税务机关解缴。（\n）","options":{"A":"正确","B":"错误"},"answer":["A"],"explanation":"委托加工的应税消费品，受托方为单位的，由“受托方”向机构所在地或居住地的\n主管税务机关解缴，本题表述正确；若本题受托方为个人，则由“委托方”向机构\n所在地的税务机关申报纳税。"},{"id":"q0197","chapter":"第5章","type":"single","stem":"根据企业所得税法律制度的规定，下列关于来源于中国境内、境外所得确定原\n则的表述中，不正确的是（\n）。","options":{"A":"权益性投资资产转让所得，按照投资企业所在地确定","B":"不动产转让所得，按照不动产所在地确定","C":"销售货物所得，按照交易活动发生地确定","D":"提供劳务所得，按照劳务发生地确定"},"answer":["A"],"explanation":"权益性投资资产转让所得按照“被投资企业”所在地确定，选项A 错误。"},{"id":"q0198","chapter":"第5章","type":"single","stem":"甲公司2025 年度企业所得税应纳税所得额1 000 万元，减免税额5 万元，抵\n免税额10 万元。已知企业所得税税率为25%，下列计算甲公司当年企业所得税\n应纳税额的列式中，正确的是（\n）。","options":{"A":"1 000×25%＝250（万元）","B":"1 000×25%－15＝235（万元）","C":"1 000×25%－10＝240（万元）","D":"1 000×25%－5＝245（万元）"},"answer":["B"],"explanation":"企业所得税应纳税额＝应纳税所得额×适用税率－减免税额－抵免税额＝1 000\n×25%－5－10＝235（万元）。"},{"id":"q0199","chapter":"第5章","type":"single","stem":"甲公司2025 年度企业所得税收入总额10 000 万元，不征税收入200 万元，免\n税收入800 万元，各项扣除7 000 万元，允许弥补的以前年度亏损500 万元，甲\n公司企业所得税税率为25%。甲公司2025 年度应缴纳企业所得税税额为（\n）\n万元。","options":{"A":"375","B":"625","C":"1 500","D":"0"},"answer":["A"],"explanation":"应纳税所得额＝收入总额－不征税收入－免税收入－各项扣除－允许弥补的以\n前年度亏损＝10 000－200－800－7 000－500＝1 500（万元），应纳税额＝应\n纳税所得额×税率＝1 500×25%＝375（万元）。"},{"id":"q0200","chapter":"第5章","type":"single","stem":"企业取得的下列收入中，属于非货币形式收入的是（\n）。","options":{"A":"收到债务人用于抵偿货款的一台运输设备","B":"零售商品取得的现金","C":"出租经营场地取得的转账支票","D":"债务的豁免"},"answer":["A"],"explanation":"企业取得收入的非货币形式，包括固定资产（选项A）、生物资产、无形资产、\n股权投资、存货、不准备持有至到期的债券投资、劳务以及有关权益等。选项B、\nC、D，属于货币形式的收入。"},{"id":"q0201","chapter":"第5章","type":"single","stem":"根据企业所得税法律制度的规定，下列关于收入确认时间的表述中，正确的是\n（\n）。","options":{"A":"租金收入，按照承租人实际支付租金的日期确认","B":"销售货物采用预收款方式的，按照实际收到预收款的日期确认","C":"利息收入，按照合同约定的债务人应付利息的日期确认","D":"接受捐赠收入，按照合同约定的捐赠日期确认"},"answer":["C"],"explanation":"选项A，租金收入，一般情况下，按照合同约定的承租人应付租金的日期确认收\n入的实现；选项B，销售货物采用预收款方式的，在发出商品时确认收入的实现；\n选项D，接受捐赠收入，按实际收到捐赠资产的日期确认收入的实现。"},{"id":"q0202","chapter":"第5章","type":"single","stem":"甲公司对外销售W 货物，不含税价格100 万元，给予购买方商业折扣10 万元；\n销售Y 货物，不含税价格80 万元，给予购买方现金折扣5 万元。上述销售业务\n中，甲公司应确认的企业所得税收入金额为（\n）。","options":{"A":"180 万元","B":"175 万元","C":"170 万元","D":"165 万元"},"answer":["C"],"explanation":"（1）销售W 货物涉及商业折扣，应当按扣除“商业折扣后”的金额［100－10＝\n90（万元）］确定销售商品收入金额；（2）销售Y 货物涉及现金折扣，应当按\n扣除“现金折扣前”的金额（80 万元）确定销售商品收入金额；（3）甲公司应确\n认的企业所得税收入金额＝90＋80＝170（万元）。"},{"id":"q0203","chapter":"第5章","type":"single","stem":"某机械设备制造企业2025 年度实现销售收入3 000 万元，发生符合条件的广\n告费和业务宣传费支出400 万元，上年度未在税前扣除完的符合条件的广告费和\n业务宣传费支出60 万元。已知广告费和业务宣传费支出不超过当年销售（营业）\n收入15%的部分，准予扣除。在计算该企业2025 年度应纳税所得额时，允许扣\n除的广告费和业务宣传费支出为（\n）万元。","options":{"A":"410","B":"350","C":"450","D":"460"},"answer":["C"],"explanation":"（1）企业发生的符合条件的广告费和业务宣传费支出，除国务院财政、税务主\n管部门另有规定外，不超过当年销售（营业）收入15%的部分，准予扣除；超过\n部分，准予在以后纳税年度结转扣除。（2）扣除限额＝3 000×15%＝450（万元），\n待扣金额＝400（当年发生额）＋60（上年结转额）＝460（万元），460 万元＞\n450 万元，允许扣除限额450 万元，超过限额的10 万元可以继续结转到以后年\n度根据规定进行扣除。"},{"id":"q0204","chapter":"第5章","type":"single","stem":"境内某居民企业2025 年取得销售货物收入2 000 万元，出租设备取得租金收\n入200 万元，对外投资取得股息收入100 万元，当年发生的与生产经营活动有\n关的业务招待费120 万元。已知业务招待费支出按照发生额的60%扣除，但最高\n不超过当年销售（营业）收入的5‰。根据企业所得税法律制度的规定，该企业\n在计算2025 年应纳税所得额时，准予扣除的业务招待费是（\n）。","options":{"A":"11 万元","B":"72 万元","C":"120 万元","D":"61 万元"},"answer":["A"],"explanation":"（1）企业发生的与其生产、经营活动有关的业务招待费支出，按照实际发生额\n的60%在企业所得税税前扣除，但最高不得超过当年销售（营业）收入的5‰。\n（2）销售（营业）收入包括主营业务收入（销售货物收入属于此类）、其他业\n务收入（租金收入属于此类）和视同销售收入，不包括营业外收入和投资收益（股\n息收入属于此类）。（3）实际发生额的60%＝120×60%＝72（万元）＞销售（营\n业）收入×5‰＝（2 000＋200）×5‰＝11（万元）。（4）当年准予在企业所\n得税税前扣除的业务招待费为11 万元。"},{"id":"q0205","chapter":"第5章","type":"single","stem":"2025 年甲企业实现利润总额600 万元，通过县级人民政府向公益事业捐赠62\n万元。上年度未在税前扣除完的符合条件的公益性捐赠支出12 万元。已知公益\n性捐赠支出在年度利润总额12%以内的部分，准予扣除。计算甲企业2025 年度\n企业所得税应纳税所得额时，准予扣除的公益性捐赠支出是（\n）。","options":{"A":"72 万元","B":"84 万元","C":"60 万元","D":"74 万元"},"answer":["A"],"explanation":"（1）企业通过公益性社会组织或者县级以上人民政府及其部门，用于符合法律\n规定的慈善活动、公益事业的捐赠，可以按照规定限额扣除；超过部分，准予结\n转以后3 年内扣除。（2）公益性捐赠支出扣除限额＝利润总额×12%＝600×12%\n＝72（万元）；待扣金额＝62（当年发生额）＋12（上年结转额）＝74 万元。\n（3）实际发生额74 万元＞扣除限额72 万元，按照限额72 万元扣除。"},{"id":"q0206","chapter":"第5章","type":"single","stem":"甲企业2025 年年初在生产经营的过程中，经批准向业务单位经理借入生产用\n资金200 万元，借款期限1 年，支付借款利息12 万元（金融企业同期同类贷款\n年利率5%）。根据企业所得税法律制度的规定，甲企业在计算2025 年企业所得\n税应纳税所得额时，可以在税前扣除的利息支出为（\n）万元。","options":{"A":"12","B":"10","C":"8","D":"11"},"answer":["B"],"explanation":"企业向除股东或其他与企业有关联关系的自然人以外的内部职工或其他人员借\n款的利息支出，符合条件的情况下，其利息支出在不超过按照金融企业同期同类\n贷款利率计算的数额的部分，准予扣除；利息扣除限额＝200×5%＝10（万元），\n实际发生额12 万元超过了扣除限额，不得在税前据实扣除，甲企业可以在税前\n扣除的利息支出为10 万元。"},{"id":"q0207","chapter":"第5章","type":"single","stem":"2025 年甲公司发生合理的工资薪金支出1 000 万元，除基本社会保险费外，\n又为全体员工支付补充养老保险费60 万元，补充医疗保险费30 万元。已知在计\n算企业所得税应纳税所得额时，按规定为本企业全体员工支付的补充养老保险\n费、补充医疗保险费分别在不超过职工工资总额5%标准内的部分准予扣除。甲\n公司在计算2025 年度企业所得税应纳税所得额时，准予扣除的补充养老保险费、\n补充医疗保险费合计为（\n）。","options":{"A":"90 万元","B":"110 万元","C":"80 万元","D":"100 万元"},"answer":["C"],"explanation":"（1）为受雇的全体员工购买的补充养老保险，扣除限额为工资薪金总额的5%＝\n1 000×5%＝50（万元）＜实际发生额60 万元，因此准予按照限额50 万元扣除；\n（2）为受雇的全体员工购买的补充医疗保险扣除限额为工资薪金总额的5%＝1\n000×5%＝50（万元）＞实际发生额30 万元，因此实际发生的30 万元准予全额\n扣除；（3）甲公司2025 年度准予扣除的补充养老保险费、补充医疗保险费合\n计＝50＋30＝80（万元）。"},{"id":"q0208","chapter":"第5章","type":"single","stem":"2025 年甲公司发生合理的工资、薪金支出1 000 万元，发生职工福利费支出、\n职工教育经费支出、拨缴的工会经费分别为200 万元、70 万元、20 万元。在计\n算企业所得税应纳税所得额时，职工福利费支出、职工教育经费支出、工会经费\n支出，分别在不超过工资、薪金总额14%、8%、2%的部分，准予扣除。在计算甲\n公司2025 年度企业所得税应纳税所得额时，准予扣除的职工福利费、职工教育\n经费和工会经费合计为（\n）。","options":{"A":"230 万元","B":"240 万元","C":"290 万元","D":"300 万元"},"answer":["A"],"explanation":"（1）职工福利费：扣除限额＝1 000×14%＝140（万元）＜实际发生额200 万元，\n准予扣除限额140 万元；（2）职工教育经费：扣除限额＝1 000×8%＝80（万元）\n＞实际发生额70 万元，准予扣除实际发生额70 万元；（3）职工工会经费：扣\n除限额＝1 000×2%＝20（万元）＝实际发生额20 万元，准予扣除实际发生额20\n万元；（4）甲公司2025 年度准予在企业所得税税前扣除的三项经费合计＝140\n＋70＋20＝230（万元）。"},{"id":"q0209","chapter":"第5章","type":"single","stem":"甲居民企业2021 年设立，2021－2025 年未弥补亏损前的所得情况如下：\n假设无其他纳税调整项目，甲居民企业2025 年度企业所得税应纳税所得额为\n（\n）。","options":{"A":"200 万元","B":"160 万元","C":"210 万元","D":"260 万元"},"answer":["B"],"explanation":"2021 年20 万元的亏损2022 年弥补。2023 年的亏损，2024 年弥补180 万元，\n2025 年弥补40 万元，因此2025 年度企业所得税应纳税所得额＝200－40＝160\n（万元）。"},{"id":"q0210","chapter":"第5章","type":"single","stem":"科技型中小企业具备资格前一纳税年度发生的亏损，可以用下一年度的所得\n弥补，下一年度的所得不足以弥补的，可以逐年延续弥补，但最长不得超过（\n）\n年。","options":{"A":"1","B":"3","C":"5","D":"10"},"answer":["D"],"explanation":"自2018 年1 月1 日起，当年具备高新技术企业或科技型中小企业资格的企业，\n其具备资格年度之前5 个年度发生的尚未弥补完的亏损，准予结转以后年度弥\n补，最长结转年限由5 年延长至10 年。"},{"id":"q0211","chapter":"第5章","type":"single","stem":"某企业为创业投资企业，2023 年8 月1 日，该企业采取股权投资方式向境内\n未上市的某中小高新技术企业投资200 万元。2025 年度该创投企业利润总额900\n万元，适用所得税税率25%，假定不考虑其他纳税调整事项，该企业2025 年度\n应缴纳企业所得税（\n）万元。","options":{"A":"50","B":"175","C":"190","D":"225"},"answer":["C"],"explanation":"创业投资企业采取股权投资方式投资于未上市的中小高新技术企业2 年以上的，\n可以按照其投资额的70%在股权持有满2 年的当年抵扣该创业投资企业的应纳税\n所得额；当年不足抵扣的，可以在以后纳税年度结转抵扣。2025 年该企业应缴\n纳的企业所得税＝（900－200×70%）×25%＝190（万元）。"},{"id":"q0212","chapter":"第5章","type":"single","stem":"甲制造业企业2025 年度利润总额500 万元，实际发生未形成无形资产计入当\n期损益的研究开发费用100 万元，无其他纳税调整项目。计算甲企业2025 年度\n企业所得税应纳税所得额的下列算式中，正确的是（\n）。","options":{"A":"500－100×75%＝425（万元）","B":"500－100×100%＝400（万元）","C":"500－100×50%＝450（万元）","D":"500＋100＝600（万元）"},"answer":["B"],"explanation":"企业未形成无形资产计入当期损益的符合规定的研究开发费用，在按照规定据实\n扣除的基础上，自2023 年1 月1 日起，可以再按照实际发生额的100%在税前加\n计扣除，因此需要纳税调减100×100%＝100（万元），应纳税所得额＝500－100\n×100%＝400（万元）。"},{"id":"q0213","chapter":"第5章","type":"single","stem":"甲居民企业为小型微利企业，适用20%的企业所得税税率。2025 年实现年度\n会计利润150 万元。假设不考虑其他纳税调整事项，计算甲企业2025 年应缴纳\n企业所得税的算式中，正确的是（\n）。","options":{"A":"150×20%＝30（万元）","B":"100×25%×20%＋（150－100）×12.5%×20%＝6.25（万元）","C":"100×50%×20%＋（150－100）×12.5%×20%＝11.25（万元）"
