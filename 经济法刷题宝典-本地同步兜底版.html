,"D":"150×25%×20%＝7.5（万元）"},"answer":["D"],"explanation":"自2023 年1 月1 日至2027 年12 月31 日，对小型微利企业减按25%计算应纳\n税所得额，按20%的税率缴纳企业所得税。甲企业2025 年应缴纳企业所得税＝\n150×25%×20%＝7.5（万元）。"},{"id":"q0214","chapter":"第5章","type":"single","stem":"甲公司为居民企业，2025 年度取得符合条件的技术转让所得1 200 万元，在\n计算企业所得税应纳税所得额时，应当纳税调减的金额是（\n）万元。","options":{"A":"850","B":"1 200","C":"600","D":"500"},"answer":["A"],"explanation":"（1）税法规定：一个纳税年度内，居民企业取得500 万元以内的技术转让所得，\n免征企业所得税；取得技术转让所得超过500 万元的，超过部分减半征收。因此\n税法上确认的应纳税所得额的金额为：（1 200－500）×50%＝350（万元）；（2）\n该项技术转让对会计利润的影响为：增加1 200 万元；（3）税会存在差异，因\n此2025 年度甲公司技术转让所得应当纳税调减的金额＝1 200－350＝850（万\n元）。"},{"id":"q0215","chapter":"第5章","type":"single","stem":"根据个人所得税法律制度的规定，下列在中国境内无住所的外籍人员中，属\n于2025 年度居民个人的是（\n）。","options":{"A":"马丁2025 年8 月1 日来到中国，2025 年10 月31 日离开中国","B":"亨利2025 年7 月5 日来到中国，2026 年1 月5 日离开中国","C":"琼斯2025 年3 月1 日来到中国，2025 年12 月1 日离开中国","D":"路易2024 年9 月1 日来到中国，2025 年5 月1 日离开中国"},"answer":["C"],"explanation":"选项A、B、D，2025 纳税年度内在中国境内居住累计不满183 天，不属于居民\n个人。"},{"id":"q0216","chapter":"第5章","type":"single","stem":"根据个人所得税法律制度的规定，个人取得的下列所得中，应缴纳个人所得\n税的是（\n）。","options":{"A":"在任职公司担任董事所取得的董事费收入","B":"独生子女补贴","C":"差旅费津贴","D":"国债利息收入"},"answer":["A"],"explanation":"选项A，按照“工资、薪金所得”征收个人所得税；选项B、C，不属于工资、薪金\n性质的补贴、津贴，不征收个人所得税；选项D，属于免税收入。"},{"id":"q0217","chapter":"第5章","type":"single","stem":"根据个人所得税法律制度的规定，下列表述中，不正确的是（\n）。","options":{"A":"出租汽车经营单位对出租车驾驶员采取单车承包或承租方式运营，出租车驾驶\n员从事客货营运取得的收入，按“工资、薪金所得”征收个人所得税","B":"退休人员再任职取得的收入，按照“工资、薪金所得”征收个人所得税","C":"个人兼职取得的收入，应按照“劳务报酬所得”项目征收个人所得税","D":"兼职律师从律师事务所取得工资性质的所得，按照“劳务报酬所得”项目征收个\n人所得税"},"answer":["D"],"explanation":"选项D，兼职律师从律师事务所取得工资性质的所得，按照“工资、薪金所得”项\n目征收个人所得税。"},{"id":"q0218","chapter":"第5章","type":"single","stem":"根据个人所得税法律制度的规定，下列不按照“特许权使用费所得”项目征收个\n人所得税的是（\n）。","options":{"A":"个人取得特许权的经济赔偿收入","B":"个人转让土地使用权","C":"编剧从电视剧的制作单位取得的剧本使用费","D":"作者将自己的文字作品手稿复印件公开竞价拍卖取得的所得"},"answer":["B"],"explanation":"选项B，按照“财产转让所得”项目征收个人所得税。"},{"id":"q0219","chapter":"第5章","type":"single","stem":"根据个人所得税法律制度的规定，下列各项中，在计算综合所得应纳税所得\n额时，属于专项扣除的是（\n）。","options":{"A":"子女教育支出","B":"基本养老保险","C":"住房贷款利息支出","D":"继续教育支出"},"answer":["B"],"explanation":"选项B，专项扣除，包括居民个人按照国家规定的范围和标准缴纳的基本养老保\n险、基本医疗保险、失业保险等社会保险费和住房公积金等；选项A、C、D，\n专项附加扣除，包括子女教育、继续教育、大病医疗、住房贷款利息、住房租金、\n赡养老人和3 岁以下婴幼儿照护等支出。"},{"id":"q0220","chapter":"第5章","type":"single","stem":"居民个人谢某2025 年1-10 月累计工资收入150 000 元，累计专项扣除27 000\n元，累计专项附加扣除10 000 元。谢某1-9 月工资、薪金所得累计已预扣预缴\n个人所得税税额3 150 元。已知，累计预扣预缴应纳税所得额超过36 000 元至\n144 000 元的部分，预扣率为10%，速算扣除数为2 520。计算谢某当年10 月工\n资、薪金所得应预扣预缴个人所得税税额的下列算式中，正确的是（\n）。","options":{"A":"（150 000－5 000×10－27 000－10 000）×10%－2 520＝3 780（元）","B":"（150 000－5 000×10－27 000－10 000）×10%－2 520－3 150＝630（元）","C":"（150 000－10 000）×10%－2 520－3 150＝8 330（元）","D":"0"},"answer":["B"],"explanation":"本题考查工资、薪金所得预扣预缴应纳税额的计算。\n先算累计：累计预扣预缴应纳税额＝累计预扣预缴应纳税所得额×预扣率－速算\n扣除数＝（150 000－5 000×10－27 000－10 000）×10%－2 520＝3 780（元）。\n再算本期：谢某10 月应预扣预缴税额＝累计预扣预缴应纳税额－累计已预扣预\n缴税额－累计减免税额＝3 780－3 150－0＝630（元）。"},{"id":"q0221","chapter":"第5章","type":"single","stem":"中国公民张某任职于国内某软件公司，2026 年2 月在M 大学授课一次，取得\n劳务报酬所得3 500 元，自行负担交通费200 元。已知，劳务报酬所得个人所得\n税预扣率为20%；每次收入不超过4 000 元的，减除费用按800 元计算。计算张\n某当月该笔劳务报酬所得应预扣预缴个人所得税税额的下列算式中，正确的是\n（\n）。","options":{"A":"（3 500－200－800）×20%＝500（元）","B":"3 500×20%＝700（元）","C":"（3 500－800）×20%＝540（元）","D":"（3 500－200）×20%＝660（元）"},"answer":["C"],"explanation":"劳务报酬所得预扣预缴时，不超过4 000 元的，减除费用800 元，不能减除其他\n支出。"},{"id":"q0222","chapter":"第5章","type":"single","stem":"中国公民王某2026 年3 月因发表著作取得稿酬40 000 元，为编写著作所花\n费资料费5 000 元。已知稿酬所得个人所得税预扣率为20%，每次收入4 000 元\n以上的，减除费用按20%计算。下列计算王某稿酬所得预扣预缴个人所得税的算\n式中，正确的是（\n）。","options":{"A":"40 000×（1－20%）×70%×20%","B":"（40 000－5 000）×（1-20%）×70%×20%","C":"40 000×（1－20%）×20%","D":"（40 000－5 000）×（1-20%）×20%"},"answer":["A"],"explanation":"已知稿酬所得每次收入4 000 元以上的，减除费用按20%计算，不能减除其他费\n用，稿酬所得的收入额减按70%计算，因此，预扣预缴的个人所得税算式＝40 000\n×（1-20%）×70%×20%。"},{"id":"q0223","chapter":"第5章","type":"single","stem":"2026 年3 月，王某出租自有住房取得租金收入6 000 元（不含增值税），房\n屋租赁过程中缴纳的可以税前扣除的税费240 元，支付该房屋的修缮费1 000 元，\n当月支付水电费100 元。已知个人出租住房个人所得税税率暂减按10%，每次收\n入4 000 元以上的，减除20%的费用。计算王某当月出租住房应缴纳个人所得税\n税额的下列算式中，正确的是（\n）。","options":{"A":"（6 000－240－800－100）×（1－20%）×10%＝388.8（元）","B":"（6 000－240－1 000）×10%＝476（元）","C":"（6 000－240－1 000）×（1－20%）×10%＝380.8（元）","D":"（6 000－240－800）×（1－20%）×10%＝396.8（元）"},"answer":["D"],"explanation":"（1）“修缮费1 000 元”最高扣800 元，排除选项B、C；（2）水电费是干扰条\n件，不能扣除，排除选项A；（3）每次收入4 000 元以上的，减除20%的费用，\n选项D 正确。"},{"id":"q0224","chapter":"第5章","type":"single","stem":"2025 年居民个人王某取得国债利息收入5 000 元，储蓄存款利息收入1 000\n元，借款给企业取得的利息收入6 000 元。已知利息、股息、红利所得适用的个\n人所得税税率为20%。王某2025 年“利息、股息、红利所得”应缴纳的个人所得\n税税额为（\n）元。","options":{"A":"2 400","B":"1 200","C":"1 000","D":"2 200"},"answer":["B"],"explanation":"（1）国债利息收入，免征个人所得税；（2）储蓄存款利息，暂免征收个人所得\n税；（3）王某2025 年“利息、股息、红利所得”应缴纳的个人所得税税额＝6 000\n×20%＝1 200（元）。"},{"id":"q0225","chapter":"第5章","type":"single","stem":"2026 年1 月，李某购买福利彩票，取得一次中奖收入30 000 元，购买彩票支\n出400 元，领奖时发生交通费600 元（由李某承担）。通过非营利性机构向农\n村义务教育捐赠10 000 元。李某选择在该笔收入中扣除公益捐赠支出。已知偶\n然所得个人所得税税率为20%，计算李某中奖收入应缴纳个人所得税税额的下列\n算式中，正确的是（\n）。","options":{"A":"30 000×20%＝6 000（元）","B":"（30 000－400-600）×20%＝5 800（元）","C":"（30 000－10 000）×20%＝4 000（元）","D":"（30 000－400-600－10 000）×20%＝3 800（元）"},"answer":["C"],"explanation":"（1）个人购买彩票，一次中奖收入在1 万元以下的暂免征收个人所得税；超过\n1 万元的，全额征收个人所得税；（2）偶然所得以收入全额计入应纳税所得额，\n不得减除购买彩票和交通费支出；（3）李某选择在偶然所得中扣除捐赠支出，\n个人通过中国境内非营利性的社会团体向农村义务教育的捐赠，准予全额扣除；\n（4）李某该笔中奖收入应缴纳个人所得税＝（30 000－10 000）×20%＝4 000\n（元）。"},{"id":"q0226","chapter":"第5章","type":"single","stem":"根据个人所得税法律制度的规定，下列各项中，以一个月内取得的收入为一\n次的是（\n）。","options":{"A":"偶然所得","B":"利息、股息、红利所得","C":"财产租赁所得","D":"财产转让所得"},"answer":["C"],"explanation":"选项A、B、D，以取得一次收入为一次计缴个人所得税。"},{"id":"q0227","chapter":"第5章","type":"single","stem":"下列各项中，不属于免征个人所得税的是（\n）。","options":{"A":"县人民政府为教师王某颁发的教育奖金","B":"国家发行的金融债券利息收入","C":"按规定发放的育儿补贴","D":"军人的转业费"},"answer":["A"],"explanation":"选项A，“省级”人民政府、国务院部委和中国人民解放军军以上单位，以及外国\n组织、国际组织颁发的科学、教育、技术、文化、卫生、体育、环境保护等方面\n的奖金，免征个人所得税；“县”人民政府为教师王某颁发的教育奖金，应计算缴\n纳个人所得税。"},{"id":"q0228","chapter":"第5章","type":"multiple","stem":"根据企业所得税法律制度的规定，下列各项中，属于企业所得税纳税人的有\n（\n）。","options":{"A":"个人独资企业","B":"合伙企业","C":"民办非企业单位","D":"事业单位"},"answer":["C","D"],"explanation":"企业所得税的纳税人包括各类企业、事业单位、社会团体、民办非企业单位和从\n事生产经营活动的其他组织，不包括个人独资企业、合伙企业。"},{"id":"q0229","chapter":"第5章","type":"multiple","stem":"根据企业所得税法律制度的规定，下列收入中，应计入企业所得税收入总额的\n有（\n）。","options":{"A":"取得逾期未退包装物押金的收入","B":"已作坏账损失又重新收回的应收账款","C":"转让债权取得的收入","D":"提供固定资产使用权取得的收入"},"answer":["A","B","C","D"],"explanation":"企业以货币形式和非货币形式从各种来源取得的收入，为收入总额。具体包括销\n售货物收入，提供劳务收入，转让财产收入（选项C），股息、红利等权益性投\n资收益，利息收入，租金收入（选项D），特许权使用费收入，接受捐赠收入以\n及其他收入（选项A、B）。"},{"id":"q0230","chapter":"第5章","type":"multiple","stem":"根据企业所得税法律制度的规定，下列各项中，属于不征税收入的有（\n）。","options":{"A":"国债利息收入","B":"转让股权收入","C":"财政拨款","D":"依法收取并纳入财政管理的行政事业性收费"},"answer":["C","D"],"explanation":"不征税收入包括：（1）财政拨款；（2）依法收取并纳入财政管理的行政事业性\n收费、政府性基金；（3）国务院规定的其他不征税收入。选项A，属于免税收\n入；选项B，属于应税收入。"},{"id":"q0231","chapter":"第5章","type":"multiple","stem":"已知甲企业是我国的居民企业。根据企业所得税法律制度的规定，甲企业取得\n的下列收入中，属于免税收入的有（\n）。","options":{"A":"国债利息收入","B":"符合条件的居民企业之间的股息、红利等投资收益","C":"中国保险保障基金有限责任公司取得的银行存款利息收入","D":"违约金收入"},"answer":["A","B","C"],"explanation":"选项D，属于应税收入。"},{"id":"q0232","chapter":"第5章","type":"multiple","stem":"根据企业所得税法律制度的规定，企业缴纳的下列保险费用中，准予在税前扣\n除的有（\n）。","options":{"A":"企业财产保险费用","B":"为高空作业人员支付的人身安全商业保险费用","C":"为企业高管支付的人身安全商业保险费用","D":"企业职工因公出差乘坐交通工具发生的人身意外保险费支出"},"answer":["A","B","D"],"explanation":"选项C，企业为投资者或职工支付的商业保险费，不得扣除。"},{"id":"q0233","chapter":"第5章","type":"multiple","stem":"根据企业所得税法律制度的规定，下列各项中，属于不得税前扣除项目的有\n（\n）。","options":{"A":"企业所得税税款","B":"允许抵扣的增值税","C":"非广告性质的赞助支出","D":"向司法机关支付的罚金"},"answer":["A","B","C","D"],"explanation":"所列各项均不得在所得税税前扣除。"},{"id":"q0234","chapter":"第5章","type":"multiple","stem":"根据企业所得税法律制度的规定，下列各项资产中，不得计提折旧扣除的有\n（\n）。","options":{"A":"以经营租赁方式租出的固定资产","B":"未投入使用的厂房","C":"未投入使用的生产设备","D":"以融资租赁方式租出的生产设备"},"answer":["C","D"],"explanation":"选项B、C，“房屋、建筑物以外”未投入使用的固定资产不得计算折旧扣除；选\n项A、D，以经营租赁方式“租入”的固定资产、以融资租赁方式“租出”的固定资产，\n不得计算折旧扣除。"},{"id":"q0235","chapter":"第5章","type":"multiple","stem":"据企业所得税法律制度的规定，下列关于固定资产计税基础的表述中，正确的\n有（\n）。","options":{"A":"通过债务重组方式取得的固定资产，以该资产的公允价值和支付的相关税费为\n计税基础","B":"自行建造的固定资产，以竣工结算前发生的支出为计税基础","C":"盘盈的固定资产，以同类固定资产的重置完全价值为计税基础","D":"通过捐赠方式取得的固定资产，以该资产的公允价值和支付的相关税费为计税\n基础"},"answer":["A","B","C","D"],"explanation":"选项A、B、C、D 表述均正确。"},{"id":"q0236","chapter":"第5章","type":"multiple","stem":"生产性生物资产指为生产农产品、提供劳务或者出租等目的持有的生物资产，\n以下属于生产性生物资产的有（\n）。","options":{"A":"经济林","B":"薪炭林","C":"产畜","D":"役畜"},"answer":["A","B","C","D"],"explanation":"生产性生物资产，是指企业为生产农产品、提供劳务或者出租等目的而持有的生\n物资产，包括经济林、薪炭林、产畜和役畜。"},{"id":"q0237","chapter":"第5章","type":"multiple","stem":"根据企业所得税法律制度的规定，下列选项中，属于长期待摊费用的有\n（\n）。","options":{"A":"购入固定资产的支出","B":"固定资产的大修理支出","C":"租入固定资产的改建支出","D":"已足额提取折旧的固定资产的改建支出"},"answer":["B","C","D"],"explanation":"在计算应纳税所得额时，企业发生的下列支出，作为长期待摊费用，按照规定摊\n销的，准予扣除：①已足额提取折旧的固定资产的改建支出，按照固定资产预计\n尚可使用年限分期摊销（选项D）；②租入固定资产的改建支出，按照合同约定\n的剩余租赁期限分期摊销（选项C）；③固定资产的大修理支出，按照固定资产\n尚可使用年限分期摊销（选项B）。选项A，应计入固定资产的账面价值，按计\n提折旧的方式，分期扣除折旧费用。"},{"id":"q0238","chapter":"第5章","type":"multiple","stem":"根据企业所得税法律制度的规定，在中国境内未设立机构场所的非居民企业\n来源于中国境内的下列所得，应以收入全额为应纳税所得额的有（\n）。","options":{"A":"股息所得","B":"转让财产所得","C":"特许权使用费所得","D":"租金所得"},"answer":["A","C","D"],"explanation":"在中国境内未设立机构、场所的，或者虽设立机构、场所但取得的所得与其所设\n机构、场所没有实际联系的非居民企业，其取得的来源于中国境内的所得，按照\n下列方法计算其应纳税所得额：\n（1）股息、红利等权益性投资收益和利息、租金、特许权使用费所得，以收入\n全额为应纳税所得额；\n（2）转让财产所得，以收入全额减除财产净值后的余额为应纳税所得额。"},{"id":"q0239","chapter":"第5章","type":"multiple","stem":"根据企业所得税法律制度的规定，企业从事下列项目的所得，减半征收企业\n所得税的有（\n）。","options":{"A":"花卉种植","B":"远洋捕捞","C":"中药材种植","D":"海水养殖"},"answer":["A","D"],"explanation":"下列所得减半征收企业所得税：花卉、茶以及其他饮料作物和香料作物的种植；\n海水养殖、内陆养殖。选项B、C，免征企业所得税。"},{"id":"q0240","chapter":"第5章","type":"multiple","stem":"根据企业所得税法律制度的规定，下列行业中不适用税前研发费用加计扣除\n政策的有（\n）。","options":{"A":"烟草制造业","B":"住宿和餐饮业","C":"娱乐业","D":"房地产业"},"answer":["A","B","C","D"],"explanation":"下列行业不适用研发费用税前加计扣除政策：烟草制造业；住宿和餐饮业；批发\n和零售业；房地产业；租赁和商务服务业；娱乐业。"},{"id":"q0241","chapter":"第5章","type":"multiple","stem":"根据企业所得税法律制度的规定，下列关于企业所得税纳税期限的表述中，\n正确的有（\n）。","options":{"A":"企业在一个纳税年度中间开业，或者终止经营活动，使该纳税年度的实际经营\n期不足12 个月的，应当以其实际经营期为1 个纳税年度","B":"企业依法清算时，应当以清算期间作为1 个纳税年度","C":"企业应当自年度终了之日起3 个月内，向税务机关报送年度企业所得税纳税申\n报表，并汇算清缴，结清应缴应退税款","D":"企业在年度中间终止经营活动的，应当自实际经营终止之日起60 日内，向税\n务机关办理当期企业所得税汇算清缴"},"answer":["A","B","D"],"explanation":"选项C，企业应当自年度终了之日起5 个月内，向税务机关报送年度企业所得税\n纳税申报表，并汇算清缴，结清应缴应退税款。"},{"id":"q0242","chapter":"第5章","type":"multiple","stem":"根据个人所得税法律制度的规定，李某从不存在雇佣关系的单位中取得下列\n收入，应按照“劳务报酬所得”项目征收个人所得税的有（\n）。","options":{"A":"审稿收入","B":"遗作稿酬","C":"技术服务收入","D":"作为证券经纪人取得的佣金收入"},"answer":["A","C","D"],"explanation":"选项B，按“稿酬所得”项目征收个人所得税。"},{"id":"q0243","chapter":"第5章","type":"multiple","stem":"根据个人所得税法律制度的规定，下列各项中，属于“稿酬所得”的有（\n）。","options":{"A":"画家将书画作品以图书的形式出版取得的所得","B":"科研工作者取得的专利赔偿所得","C":"摄影师将自己的摄影作品发表在书画杂志取得的所得","D":"作者将自己的文字作品手稿原件拍卖取得的所得"},"answer":["A","C"],"explanation":"选项B、D，属于特许权使用费所得。"},{"id":"q0244","chapter":"第5章","type":"multiple","stem":"根据个人所得税法律制度的规定，下列各项支出中，可以作为个人专项附加\n扣除的有（\n）。","options":{"A":"子女抚养","B":"继续教育","C":"赡养老人","D":"失业保险费"},"answer":["B","C"],"explanation":"专项附加扣除包括子女教育、继续教育（选项B）、赡养老人（选项C）、住房\n贷款利息、住房租金、大病医疗和3 岁以下婴幼儿照护等支出。选项D，属于专\n项扣除项目。"},{"id":"q0245","chapter":"第5章","type":"multiple","stem":"根据个人所得税法律制度的规定，下列各项中，不得在计算个体工商户经营\n所得中扣除的有（\n）。","options":{"A":"业主本人的工资薪金支出","B":"仅用于个人和家庭的支出","C":"直接向某灾区小学的捐赠支出","D":"个人所得税税款"},"answer":["A","B","C","D"],"explanation":"选项A，个体工商户业主本人的工资薪金支出不能扣除；选项B，“仅”用于个人\n和家庭的支出，属于与取得生产经营收入无关的支出，不得扣除，对于生产经营\n与个人、家庭生活“混用”难以分清的费用，其40%视为与生产经营有关的费用，\n准予扣除；选项C，直接捐赠不属于符合规定的公益性捐赠，不能扣除；选项D，\n个人所得税税款不得在计算所得时扣除。"},{"id":"q0246","chapter":"第5章","type":"multiple","stem":"根据个人所得税法律制度的规定，下列表述中，正确的有（\n）。","options":{"A":"对个人出租住房取得的所得减按10%的税率征收个人所得税","B":"居民个人李某取得境外所得需要申报缴纳个人所得税","C":"张某转让自用达3 年以上且唯一家庭生活用房免征个人所得税","D":"累积消费达到一定额度获得额外抽奖机会后，个人的获奖所得需要缴纳个人所\n得税"},"answer":["A","B","D"],"explanation":"选项C，对个人转让自用达5 年以上并且是家庭唯一生活用房取得的所得，暂免\n征收个人所得税，3 年不满足规定年限。"},{"id":"q0247","chapter":"第5章","type":"multiple","stem":"根据个人所得税法律制度的规定，下列各项中，应按照“财产转让所得”项目计\n缴个人所得税的有（\n）。","options":{"A":"个人通过网络收购玩家的虚拟货币，加价后向他人出售取得的所得","B":"个人转让新三板挂牌公司原始股取得的所得","C":"个人通过竞拍购置债权后，通过司法程序主张债权而取得的所得","D":"个人以非货币性资产投资取得的所得"},"answer":["A","B","C","D"],"explanation":"选项A、B、C、D，均按“财产转让所得”项目征收个人所得税。"},{"id":"q0248","chapter":"第5章","type":"multiple","stem":"根据个人所得税法律制度的规定，下列根据“偶然所得”项目征收个人所得税的\n有（\n）。","options":{"A":"参加宣传活动获赠的U 盘","B":"取得单张有奖发票奖金所得1 000 元","C":"提供担保取得的收入","D":"公司赠送的8 折优惠券"},"answer":["A","B","C"],"explanation":"企业在业务宣传、广告等活动中，随机向本单位以外的个人赠送礼品、红包，按\n照“偶然所得”项目计算缴纳个人所得税，但企业赠送的具有价格折扣或折让性质\n的消费券、代金券、抵用券、优惠券（选项D）等礼品除外。"},{"id":"q0249","chapter":"第5章","type":"multiple","stem":"根据个人所得税法律制度的规定，个人发生的下列公益性捐赠支出中，准予\n税前全额扣除的有（\n）。","options":{"A":"通过国家机关向红十字事业的捐赠","B":"通过国家机关向贫困地区的捐赠","C":"通过非营利社会团体向农村义务教育的捐赠","D":"通过非营利社会团体向公益性青少年活动场所的捐赠"},"answer":["A","C","D"],"explanation":"选项B，个人将其所得对教育、扶贫、济困等公益慈善事业进行捐赠，捐赠额未\n超过纳税人申报的应纳税所得额30%的部分，可以从其应纳税所得额中扣除。"},{"id":"q0250","chapter":"第5章","type":"multiple","stem":"根据个人所得税法律制度的规定，发生下列（\n）情形之一的纳税人，应\n当按照规定依法办理纳税申报。","options":{"A":"取得应税所得没有扣缴义务人","B":"取得境外所得","C":"非居民个人在中国境内从两处以上取得工资、薪金所得","D":"因移居境外注销中国户籍"},"answer":["A","B","C","D"],"explanation":"有下列情形之一的，纳税人应当依法办理纳税申报：\n（1）取得综合所得需要办理汇算清缴；（2）取得应税所得没有扣缴义务人；（3）\n取得应税所得，扣缴义务人未扣缴税款；（4）取得境外所得；（5）因移居境外\n注销中国户籍；（6）非居民个人在中国境内从两处以上取得工资、薪金所得；\n（7）国务院规定的其他情形。"},{"id":"q0251","chapter":"第5章","type":"judge","stem":"居民企业在汇总计算缴纳企业所得税时，其境外营业机构的亏损可以抵减境内\n营业机构的盈利。（\n）","options":{"A":"正确","B":"错误"},"answer":["B"],"explanation":"居民企业在汇总计算缴纳企业所得税时，其境外营业机构的亏损“不得抵减”境内\n营业机构的盈利，即“外亏不能内抵”。"},{"id":"q0252","chapter":"第5章","type":"judge","stem":"个体工商户生产经营活动中，应当分别核算生产经营费用和个人、家庭费用。\n对于生产经营与个人、家庭生活混用难以分清的费用，全部视为个人、家庭生活\n费用，不允许在税前扣除。（\n）","options":{"A":"正确","B":"错误"},"answer":["B"],"explanation":"个体工商户生产经营活动中，应当分别核算生产经营费用和个人、家庭费用。对\n于生产经营与个人、家庭生活混用难以分清的费用，其40%视为与生产经营有关\n费用，准予扣除。"},{"id":"q0253","chapter":"第5章","type":"judge","stem":"纳税人取得经营所得，按年计算个人所得税，由纳税人在月度或者季度终了后\n15 日内向税务机关报送纳税申报表，并预缴税款；在取得所得的次年5 月31 日\n前办理汇算清缴。（\n）","options":{"A":"正确","B":"错误"},"answer":["B"],"explanation":"纳税人取得经营所得，按年计算个人所得税，由纳税人在月度或者季度终了后\n15 日内向税务机关报送纳税申报表，并预缴税款；在取得所得的次年3 月31 日\n前办理汇算清缴。"},{"id":"q0254","chapter":"第6章","type":"single","stem":"下列选项中，属于房产税征税范围的是（\n）。","options":{"A":"工厂的烟囱","B":"室外游泳池","C":"建立在县城的办公楼","D":"坐落于农村的仓储用房"},"answer":["C"],"explanation":"（1）房产税的征税范围为城市、县城、建制镇和工矿区的房屋，不包括农村的\n房屋（选项D）；（2）独立于房屋之外的建筑物，如围墙、烟囱（选项A）、\n水塔、菜窖、室外游泳池（选项B）等，不属于房产税的征税范围。"},{"id":"q0255","chapter":"第6章","type":"single","stem":"甲公司一处办公用房原值600 万元，由于价值50 万元的配套设施损坏，2024\n年12 月以价值80 万元的配套设施对其予以更换。已知，房产原值的减除比例为\n30%，房产税从价计征税率为1.2%。根据房产税法律制度的规定，计算甲公司该\n办公用房2025 年度应缴纳房产税税额的下列算式中，正确的是（\n）。","options":{"A":"（600＋80）×（1－30%）×1.2%＝5.712（万元）","B":"（600－50）×（1－30%）×1.2%＝4.62（万元）","C":"600×（1－30%）×1.2%＝5.04（万元）","D":"（600＋80－50）×（1－30%）×1.2%＝5.292（万元）"},"answer":["D"],"explanation":"（1）对更换房屋附属设备和配套设施的，在将其价值（80 万元）计入房产原值\n时，可扣减原来相应设备和设施的价值（50 万元）；（2）从价计征的房产税应\n纳税额＝应税房产原值×（1－扣除比例）×1.2%＝（600＋80－50）×（1－30%）\n×1.2%＝5.292（万元）。"},{"id":"q0256","chapter":"第6章","type":"single","stem":"甲公司为增值税一般纳税人，拥有一处原值500 万元的仓库。2025 年5 月甲\n公司将仓库由自用转为出租，并于当月将仓库交付给承租方乙公司使用。至年底\n共收取当年不含增值税租金7 万元。已知，房产税从价计征税率为1.2%，从租计\n征税率为12%。当地规定的房产税扣除比例为30%。计算甲公司该仓库2025 年\n度应缴纳房产税税额的下列算式中，正确的是（\n）。","options":{"A":"500×（1－30%）×1.2%÷12×4＋7×12%＝2.24（万元）","B":"500×（1－30%）×1.2%＝4.2（万元）","C":"7×12%＝0.84（万元）","D":"500×（1－30%）×1.2%÷12×5＋7×12%＝2.59（万元）"},"answer":["D"],"explanation":"（1）纳税人出租、出借房产，自交付出租、出借房产之次月起缴纳房产税；甲\n公司5 月由自用转为出租并交付使用，前5 个月从价计征房产税，自6 月起从租\n计征房产税（从价计征5 个月，从租计征7 个月）。（2）从价计征的房产税应\n纳税额＝应税房产原值×（1－扣除比例）×1.2%＝500×（1－30%）×1.2%÷12×5\n＝1.75（万元）。（3）从租计征的房产税应纳税额＝不含增值税的租金收入×12%\n＝7×12%＝0.84（万元）。（4）甲公司该仓库2025 年度房产税应纳税额＝从价\n计征的房产税＋从租计征的房产税＝1.75＋0.84＝2.59（万元）。"},{"id":"q0257","chapter":"第6章","type":"single","stem":"甲公司2025 年实际占地面积30 000 平方米，其中位于市区的办公区占地27\n000 平方米、职工生活区占地2 000 平方米，位于农村的仓库占地1\n000 平方米。已知，城镇土地使用税适用税率为每平方米年税额5 元。计算甲公\n司2025 年度应缴纳城镇土地使用税税额的下列算式中，正确的是（\n）。","options":{"A":"27 000×5＝135 000（元）","B":"30 000×5＝150 000（元）","C":"（27 000＋2 000）×5＝145 000（元）","D":"（27 000＋1 000）×5＝140 000（元）"},"answer":["C"],"explanation":"（1）农村土地不属于城镇土地使用税的征税范围，市区的办公区占地、职工生\n活区占地均应照章纳税；（2）甲公司2025 年度应缴纳城镇土地使用税税额＝\n（27 000＋2 000）×5＝145 000（元）。"},{"id":"q0258","chapter":"第6章","type":"single","stem":"根据契税法律制度的规定，下列行为中，属于契税征税范围的是（\n）。","options":{"A":"房屋出租","B":"房屋典当","C":"房屋赠与","D":"房屋抵押"},"answer":["C"],"explanation":"选项C，房屋的买卖、赠与、互换等属于契税征税范围。土地、房屋典当（选项\nB）、分拆（分割）、抵押（选项D）以及出租（选项A）等行为，土地、房屋\n权属未发生转移，不属于契税的征税范围。"},{"id":"q0259","chapter":"第6章","type":"single","stem":"李某拥有一套价值72 万元的住房，张某拥有一套价值52 万元的住房，双方交\n换住房，由张某补差价20 万元给李某。已知契税的税率为3%。不考虑其他因素，\n下列各项中正确的是（\n）。","options":{"A":"李某应缴纳契税2.16 万元","B":"张某应缴纳契税0.6 万元","C":"李某应缴纳契税0.6 万元","D":"张某应缴纳契税2.16 万元"},"answer":["B"],"explanation":"（1）房屋互换价格不相等的，以其互换的价格差额为计税依据，由支付差额的\n一方缴纳契税；（2）张某应缴纳契税＝20×3%＝0.6（万元）。"},{"id":"q0260","chapter":"第6章","type":"single","stem":"2026 年1 月甲公司购入乙公司原值1 000 万元的办公楼，不含增值税成交价为\n1300 万元。甲公司以银行存款支付价款900 万元，同时抵减乙公司债务350 万\n元和利息50 万元。已知契税适用税率为4%，计算甲公司购买该办公楼应缴纳契\n税税额的下列算式中，正确的是（\n）。","options":{"A":"（900＋350）×4%＝50（万元）","B":"1 000×4%＝40（万元）","C":"1 300×4%＝52（万元）","D":"900×4%＝36（万元）"},"answer":["C"],"explanation":"（1）以作价投资（入股）、偿还债务等应交付经济利益的方式转移土地、房屋\n权属的，参照土地使用权出让、出售或房屋买卖确定契税适用税率、计税依据等；\n（2）土地使用权出让、出售及房屋买卖，以不含增值税的成交价格作为计税依\n据；（3）甲公司购买该办公楼应缴纳契税税额＝1 300×4%＝52（万元）。"},{"id":"q0261","chapter":"第6章","type":"single","stem":"根据土地增值税法律制度的规定，下列行为中应征收土地增值税的是（\n）。","options":{"A":"个人出租不动产","B":"双方合作建成商品房后转让","C":"房地产公司将开发的商品房转为办公自用","D":"政府出让国有土地使用权"},"answer":["B"],"explanation":"选项A，不动产出租，未发生权属转移，不征收土地增值税；选项B，对于一方\n出地，另一方出资金，双方合作建房，建成后按比例分房自用的，暂免征收土地\n增值税；建成后转让的，应征收土地增值税；选项C，房地产公司将开发的商品\n房转为办公自用的，因产权未发生转移，因此不征收土地增值税；选项D，土地\n增值税只对“转让”国有土地使用权的行为征税，对“出让”国有土地的行为不征税。"},{"id":"q0262","chapter":"第6章","type":"single","stem":"2026 年3 月甲房地产开发公司销售自行开发的一处住宅项目，取得不含增值\n税价款8\n000 万元，扣除项目金额5\n000 万元。已知，土地增值税税率为40%，速算扣除系数为5%。根据土地增值税\n法律制度的规定，计算甲房地产开发公司销售该住宅项目应缴纳土地增值税税额\n的下列算式中，正确的是（\n）。","options":{"A":"8 000×40%＝3 200（万元）","B":"（8 000－5 000）×（40%－5%）＝1 050（万元）","C":"（8 000－5 000）×40%×5%＝60（万元）","D":"（8 000－5 000）×40%－5 000×5%＝950（万元）"},"answer":["D"],"explanation":"甲房地产开发公司销售该住宅项目应缴纳土地增值税税额＝增值额×税率－扣\n除项目金额×速算扣除系数＝（8 000－5 000）×40%－5 000×5%＝950（万元）。"},{"id":"q0263","chapter":"第6章","type":"single","stem":"2026 年1 月甲公司转让办公楼，取得不含增值税收入550 万元。该办公楼2022\n年1 月购入，购房发票注明不含增值税价格为400 万元，购房时缴纳契税16 万\n元并取得完税凭证。甲公司转让该办公楼不能取得评估价格，在计算土地增值税\n时允许扣除的相关税费为5 万元。计算甲公司转让该办公楼增值额的下列算式\n中，正确的是（\n）。","options":{"A":"550－（400＋16）×（1＋4×5%）＝50.8（万元）","B":"550－400－16－5＝129（万元）","C":"550－400－5＝145（万元）","D":"550－[400×（1＋4×5%）＋16＋5]＝49（万元）"},"answer":["D"],"explanation":"本题考查转让旧房不能取得评估价格，按购房发票金额计算扣除项目，进而确定\n转让该办公楼增值额，具体分析如表所示。"},{"id":"q0264","chapter":"第6章","type":"single","stem":"2025 年6 月15 日，甲公司购买2 辆乘用车。已知乘用车发动机气缸容量排\n气量为2.0 升，当地规定的车船税年基准税额为480 元/辆。甲公司2025 年应纳\n车船税税额的下列计算中，正确的是（\n）。","options":{"A":"2×480×7÷12＝560（元）","B":"2×480×（6＋15÷30）÷12＝520（元）","C":"2×480×6÷12＝480（元）","D":"2×480＝960（元）"},"answer":["A"],"explanation":"（1）购置的新车船，购置当年的应纳税额自纳税义务发生的当月起按月计算；\n（2）乘用车、摩托车、商用客车以辆数为计税单位；（3）甲公司2025 年应纳\n车船税税额＝辆数×适用年基准税额/12×应纳税月份数＝2×480×7÷12＝560\n（元）。"},{"id":"q0265","chapter":"第6章","type":"single","stem":"2025 年甲公司拥有整备质量为20 吨的商用货车10 辆，整备质量为10 吨的\n挂车8 辆。已知，货车的车船税适用年基准税额为整备质量每吨80 元。根据车\n船税法律制度的规定，计算甲公司上述车辆当年应缴纳车船税税额的下列算式\n中，正确的是（\n）。","options":{"A":"10×20×80＋8×10×80×50%＝19 200（元）","B":"10×20×80×50%＋8×10×80×50%＝11 200（元）","C":"10×20×80＋8×10×80＝22 400（元）","D":"10×20×80×50%＋8×10×80＝14 400（元）"},"answer":["A"],"explanation":"（1）挂车的车船税年基准税额按照货车税额的50%计算；（2）甲公司当年应缴\n纳车船税税额＝10×20×80＋8×10×80×50%＝19 200（元）。"},{"id":"q0266","chapter":"第6章","type":"single","stem":"某企业2025 年初拥有小轿车2 辆；当年4 月，1 辆小轿车被盗，已按照规定\n办理退税。通过公安机关的侦查，9 月份被盗车辆失而复得，并取得公安机关的\n相关证明。已知当地小轿车车船税年税额为500 元/辆，该企业2025 年实际应缴\n纳的车船税为（\n）元。","options":{"A":"500","B":"625","C":"792","D":"1 000"},"answer":["C"],"explanation":"（1）车船被盗抢、报废、灭失：自被盗抢、报废、灭失的“当月”起可申请退还\n税款；（2）失而复得：自公安机关出具证明的“当月”起计算纳税；（3）该小轿\n车于2025 年4 月被盗，因而从4 月起的车船税可申请退还；9 月被盗车辆失而\n复得，即从9 月开始至12 月，需照章计缴车船税，因此该车辆2025 年需缴纳\n车船税的月份为1—3 月、9—12 月，共计7 个月；（4）该企业2025 年实际应\n缴纳的车船税＝500＋500×7÷12＝792（元）。"},{"id":"q0267","chapter":"第6章","type":"single","stem":"甲公司与乙公司签订买卖合同，合同约定丙为担保人，丁为鉴定人。下列关\n于该合同印花税纳税人的表述中，正确的是（\n）。","options":{"A":"甲、乙、丙和丁为纳税人","B":"甲、乙和丁为纳税人","C":"甲、乙为纳税人","D":"甲、乙和丙为纳税人"},"answer":["C"],"explanation":"根据书立、使用应税凭证的不同，印花税纳税人可分为立合同人（甲、乙）、立\n账簿人、立据人和使用人等，不包括合同的担保人（丙）、证人和鉴定人（丁）。"},{"id":"q0268","chapter":"第6章","type":"single","stem":"某电厂与某运输公司签订了两份运输保管合同：第一份合同载明的金额合计\n50 万元（运费和保管费并未分别记载）；第二份合同中注明运费为30 万元、保\n管费10 万元。已知运输合同印花税税率为0.3‰，保管合同印花税税率为1‰。\n分别计算该电厂第一份、第二份合同应缴纳的印花税税额为（\n）。","options":{"A":"500 元、400 元","B":"150 元、190 元","C":"500 元、190 元","D":"150 元、400 元"},"answer":["C"],"explanation":"第一份合同运费和保管费并未分别记载，从高适用税率，应缴纳印花税税额＝500\n000×1‰＝500（元）；第二份合同应缴纳印花税税额＝300 000×0.3‰＋100 000\n×1‰＝190（元）。"},{"id":"q0269","chapter":"第6章","type":"single","stem":"甲公司向乙公司租赁2 台起重机并签订租赁合同，合同注明起重机总价值为\n80 万元，租期为2 个月，每台每月租金2 万元，增值税4800 元。已知租赁合同\n适用印花税税率为1‰。根据印花税法律制度的规定，甲公司和乙公司签订该租\n赁合同共计应缴印花税（\n）元。","options":{"A":"40","B":"80","C":"160","D":"180"},"answer":["C"],"explanation":"（1）增值税是价外税，不应计入计税依据计算印花税；（2）甲公司承租2 台起\n重机，每月租金2 万元，2 个月租期内全部租金＝20 000×2×2＝80 000（元），\n租赁合同应当以凭证所载租金作为计税依据；（3）签订合同的各方当事人都是\n印花税的纳税人，该租赁合同双方当事人甲公司和乙公司共计应缴印花税＝80\n000×1‰×2＝160（元）。"},{"id":"q0270","chapter":"第6章","type":"single","stem":"下列各项中，应当征收印花税的是（\n）。","options":{"A":"甲公司与乙公司签订的货物运输合同","B":"会计咨询合同","C":"企业与主管部门签订的租赁承包合同","D":"电网与用户之间签订的供用电合同"},"answer":["A"],"explanation":"选项B，一般的法律、会计、审计等方面的咨询不属于技术咨询，其所立合同不\n贴印花；选项C，印花税征税范围中的租赁合同，不包括企业与主管部门签订的\n租赁承包合同；选项D，电网与用户之间签订的供用电合同不征收印花税；对发\n电厂与电网之间、电网与电网之间签订的购售电合同，应按买卖合同征收印花税。"},{"id":"q0271","chapter":"第6章","type":"single","stem":"根据印花税法律制度的规定，下列合同中，应征收印花税的是（\n）。","options":{"A":"金融机构与小型微型企业订立的借款合同","B":"农民销售自产农产品订立的买卖合同","C":"发电厂与电网之间签订的购售电合同","D":"与高校学生签订的高校学生公寓租赁合同"},"answer":["C"],"explanation":"选项C，对发电厂与电网之间、电网与电网之间签订的购售电合同，应按买卖合\n同征收印花税，电网与用户之间签订的供用电合同不征收印花税；选项A、B、\nD，免征印花税。"},{"id":"q0272","chapter":"第6章","type":"single","stem":"根据资源税法律制度的规定，下列各项中，属于资源税纳税人的是（\n）。","options":{"A":"进口金属矿石的冶炼企业","B":"销售精盐的商场","C":"开采销售原煤的公司","D":"销售柴油的加油站"},"answer":["C"],"explanation":"选项A，进口矿产品不征收资源税；选项B、D，精盐和柴油（属于成品油）并\n非直接从自然中开采，不属于资源税征税范围。"},{"id":"q0273","chapter":"第6章","type":"single","stem":"某铜矿2026 年1 月销售铜矿石原矿收取不含增值税价款合计600 万元，其中\n从坑口到车站的运输费用20 万元，随运销产生的装卸、仓储费用10 万元，均取\n得增值税发票。已知该矿山铜矿石原矿适用的资源税税率为6%，增值税税率为\n13%。计算该铜矿1 月份应纳资源税税额的列式中正确的是（\n）。","options":{"A":"600×6%＝36（万元）","B":"600×（1＋13%）×6%＝40.68（万元）","C":"（600－20－10）×6%＝34.2（万元）","D":"（600＋20＋10）×6%＝37.8（万元）"},"answer":["C"],"explanation":"（1）资源税应税产品销售额是指纳税人销售应税产品向购买方收取的全部价款，\n但不包括收取的增值税税款；（2）计入销售额中的相关运杂费用，凡取得增值\n税发票或者其他合法有效凭证的，准予从销售额中扣除；（3）该铜矿1 月份应\n纳资源税税额＝（600－20－10）×6%＝34.2（万元）。"},{"id":"q0274","chapter":"第6章","type":"single","stem":"下列各项中，不征收环境保护税的是（\n）。","options":{"A":"光污染","B":"工业噪声","C":"水污染","D":"大气污染"},"answer":["A"],"explanation":"环境保护税的征税范围包括大气污染物（选项D）、水污染物（选项C）、固体\n废物和噪声（选项B）等应税污染物。"},{"id":"q0275","chapter":"第6章","type":"multiple","stem":"根据房产税法律制度的规定，下列有关房产税纳税人的表述中，正确的有\n（\n）。","options":{"A":"产权未确定以及租典纠纷未解决的，房产代管人或者使用人为纳税人","B":"产权所有人、承典人均不在房产所在地的，房产代管人或者使用人为纳税人","C":"产权出典的，承典人为纳税人","D":"房产出租的，承租人为纳税人"},"answer":["A","B","C"],"explanation":"选项D，房产经营租赁的，出租人为纳税人；房产融资租赁的，承租人为纳税人。"},{"id":"q0276","chapter":"第6章","type":"multiple","stem":"下列各项中，以房产余值为计税依据计算缴纳房产税的有（\n）。","options":{"A":"融资租赁房屋","B":"经营租赁房屋","C":"投资联营房产，投资者参与投资利润分红，共担风险","D":"高校学生公寓"},"answer":["A","C"],"explanation":"选项A，融资租赁房屋实质是承租人分期付款购买固定资产，以房产余值为计税\n依据从价计征房产税；选项B，以租金收入为计税依据从租计征房产税；选项C，\n属于“真投资”，以房产余值为计税依据从价计征房产税；选项D，高校学生公寓\n免征房产税。"},{"id":"q0277","chapter":"第6章","type":"multiple","stem":"根据房产税法律制度的规定，下列选项中，应计入房产原值计征房产税的有\n（\n）。","options":{"A":"不可随意移动的配套设施","B":"对厂房进行扩建的支出","C":"与房屋不可分割的附属设备","D":"独立于房屋之外的水塔"},"answer":["A","B","C"],"explanation":"独立于房屋之外的建筑物，如围墙、烟囱、水塔（选项D）、变电塔、酒窖、菜\n窖、室外游泳池、玻璃暖房等，不属于房产税征税范围，不需要缴纳房产税。"},{"id":"q0278","chapter":"第6章","type":"multiple","stem":"根据房产税法律制度的规定，下列表述中，正确的有（\n）。","options":{"A":"公园内开设的照相馆免征房产税","B":"对军队空余房产租赁收入暂免征收房产税","C":"纳税人自行新建房屋用于生产经营，从建成之月起缴纳房产税","D":"个人对外出租的住房应照章缴纳房产税"},"answer":["B","D"],"explanation":"选项A，公园内自用房产免征房产税，自用房产指供公共参观游览的房屋及其管\n理单位的办公用房屋；公园内开设的照相馆属于营利性用房，应照章纳税。选项\nC，纳税人“自行新建”房屋用于生产经营，从建成之“次月”起，缴纳房产税。"},{"id":"q0279","chapter":"第6章","type":"multiple","stem":"根据城镇土地使用税法律制度的规定，下列表述中，正确的有（\n）。","options":{"A":"城镇土地使用税由拥有土地使用权的单位或个人缴纳","B":"拥有土地使用权的纳税人不在土地所在地的，由代管人或实际使用人缴纳","C":"土地使用权未确定或权属纠纷未解决的，由实际使用人缴纳","D":"土地使用权共有的，共有方均为纳税人，由共有各方分别缴纳"},"answer":["A","B","C","D"],"explanation":"选项A、B、C、D 表述均正确。"},{"id":"q0280","chapter":"第6章","type":"multiple","stem":"根据城镇土地使用税法律制度的规定，下列各项中，属于城镇土地使用税征税\n范围的有（\n）。","options":{"A":"市区内某工厂用地","B":"镇政府所在地所辖行政村的集体土地","C":"工矿区内的集体土地","D":"县政府所在地的国有土地"},"answer":["A","C","D"],"explanation":"选项B，“建制镇”，是经省级人民政府批准设立的建制镇，建制镇的征税范围为\n镇人民政府所在地的地区，但不包括镇政府所在地所辖行政村。"},{"id":"q0281","chapter":"第6章","type":"multiple","stem":"根据城镇土地使用税法律制度的规定，下列城市用地中，应缴纳城镇土地使用\n税的有（\n）。","options":{"A":"民航机场场内道路用地","B":"商业企业经营用地","C":"火电厂厂区围墙内的用地","D":"市政街道公共用地"},"answer":["A","B","C"],"explanation":"选项A，民航机场用地中，“场外”道路免征城镇土地使用税，“场内”道路依照规\n定征收城镇土地使用税。选项B，商业企业经营用地，应照章缴纳城镇土地使用\n税。选项C，火电厂厂区围墙外的灰场、输灰管、输油（气）管道、铁路专用线\n用地，免征城镇土地使用税；厂区围墙外的其他用地和厂区围墙内的用地均应照\n章缴纳城镇土地使用税。选项D，市政街道公共用地，免征城镇土地使用税。"},{"id":"q0282","chapter":"第6章","type":"multiple","stem":"根据城镇土地使用税法律制度的规定，下列关于城镇土地使用税纳税义务发生\n时间的表述中，正确的有（\n）。","options":{"A":"纳税人出租房产，自交付出租房产之次月起，缴纳城镇土地使用税","B":"纳税人新征用的耕地，自批准征用之日起满1 年时开始缴纳城镇土地使用税","C":"纳税人购置存量房，自房地产权属登记机关签发房屋权属证书之次月起，缴纳\n城镇土地使用税","D":"纳税人以出让方式有偿取得土地使用权，合同未约定交付土地时间的，自合同\n签订的次月起缴纳城镇土地使用税"},"answer":["A","B","C","D"],"explanation":"选项A、B、C、D 表述均正确。"},{"id":"q0283","chapter":"第6章","type":"multiple","stem":"根据契税法律制度的规定，下列各项中，属于契税纳税人的有（\n）。","options":{"A":"购买房屋的乙公司","B":"受赠房屋的李某","C":"将自有房产用于抵偿债务的邓某","D":"出售房屋的甲公司"},"answer":["A","B"],"explanation":"契税的纳税人指在我国境内承受土地、房屋权属转移的单位和个人，即由通过受\n让、购买、受赠、互换等方式“取得”土地、房屋权属的一方缴纳契税，选项A、\nB 当选。"},{"id":"q0284","chapter":"第6章","type":"multiple","stem":"根据契税法律制度的规定，下列各项中，免征契税的有（\n）。","options":{"A":"法定继承人通过继承承受房屋权属","B":"国家机关承受房屋用于办公","C":"纳税人承受荒山土地使用权用于农业生产","D":"婚姻关系存续期间，夫妻之间进行房产转让"},"answer":["A","B","C","D"],"explanation":"选项A、B、C、D 均属于免征契税的情形。"},{"id":"q0285","chapter":"第6章","type":"multiple","stem":"根据土地增值税法律制度的规定，下列各项中，在计算土地增值税时应计入\n房地产开发成本的有（\n）。","options":{"A":"公共配套设施费","B":"建筑安装工程费","C":"取得土地使用权所支付的地价款","D":"土地征用及拆迁补偿费"},"answer":["A","B","D"],"explanation":"选项C，属于“取得土地使用权所支付的金额”。"},{"id":"q0286","chapter":"第6章","type":"multiple","stem":"根据车船税法律制度的规定，下列有关车船税计税依据的表述中，正确的有\n（\n）。","options":{"A":"商用客车以辆数为计税依据","B":"机动船舶以整备质量吨位数为计税依据","C":"游艇以艇身长度为计税依据","D":"商用货车以净吨位数为计税依据"},"answer":["A","C"],"explanation":"选项B，机动船舶以净吨位数为计税依据；选项D，商用货车以整备质量吨位数\n为计税依据。"},{"id":"q0287","chapter":"第6章","type":"multiple","stem":"根据车船税法律制度的规定，下列车船中，应征收车船税的有（\n）。","options":{"A":"摩托车","B":"地铁列车","C":"非机动驳船","D":"电动自行车"},"answer":["A","C"],"explanation":"车船税的税目分为六大类，包括乘用车、商用车、挂车、其他车辆、摩托车（选\n项A）和船舶。选项C，非机动驳船属于船舶，应缴纳车船税。"},{"id":"q0288","chapter":"第6章","type":"multiple","stem":"根据车船税法律制度的规定，下列各项中，免（不）征车船税的有（\n）。","options":{"A":"拖拉机","B":"捕捞、养殖渔船","C":"警用车船","D":"纯电动商用车"},"answer":["A","B","C","D"],"explanation":"选项A，不属于车船税征税范围；选项B、C、D，免征车船税。"},{"id":"q0289","chapter":"第6章","type":"multiple","stem":"根据印花税法律制度的规定，下列选项中，属于印花税征税范围的有（\n）。","options":{"A":"人身保险合同","B":"财产保险合同","C":"土地使用权出让书据","D":"银行同业拆借合同"},"answer":["B","C"],"explanation":"根据规定人身保险合同（选项A）和银行同业拆借合同（选项D）不属于印花税\n的征税范围。"},{"id":"q0290","chapter":"第6章","type":"multiple","stem":"关于印花税计税依据的下列表述中，符合法律规定的有（\n）。","options":{"A":"租赁合同以租金为计税依据","B":"财产保险合同以保险费为计税依据","C":"运输合同以运输费用为计税依据","D":"应税营业账簿以账簿所记载实收资本（股本）和资本公积的合计金额为计税依\n据"},"answer":["A","B","C","D"],"explanation":"选项A、B、C，印花税应税合同的计税依据为合同列明的价款或者报酬；选项D，\n应税营业账簿的计税依据为营业账簿所记载的实收资本（股本）、资本公积合计\n金额。"},{"id":"q0291","chapter":"第6章","type":"multiple","stem":"根据印花税法律制度的规定，下列各项中，免征印花税的有（\n）。","options":{"A":"发行单位与订阅单位之间书立的征订凭证","B":"无息、贴息借款合同","C":"应税凭证的副本","D":"财产所有权人将财产赠给学校所立的书据"},"answer":["A","B","C","D"],"explanation":"选项A、B、C、D 均属于印花税免税情形。"},{"id":"q0292","chapter":"第6章","type":"multiple","stem":"下列各项中，属于资源税征税范围的有（\n）。","options":{"A":"花岗石","B":"人造石油","C":"海盐","D":"煤成（层）气"},"answer":["A","C","D"],"explanation":"按照现行资源税征税范围规定，人造石油不属于资源税征税范围，不征收资源税，\n而花岗石、海盐和煤成（层）气属于资源税征税范围。"},{"id":"q0293","chapter":"第6章","type":"multiple","stem":"下列各项中，属于水资源税征税范围的有（\n）。","options":{"A":"微咸水","B":"地下水","C":"地表水","D":"再生水"},"answer":["B","C"],"explanation":"水资源税的征税对象为地表水（选项C）和地下水（选项B），不包括再生水、\n集蓄雨水、海水及海水淡化水、微咸水等非常规水。"},{"id":"q0294","chapter":"第6章","type":"multiple","stem":"下列情形中，应缴纳资源税的有（\n）。","options":{"A":"纳税人将自产的资源税应税产品用于连续生产应税产品","B":"纳税人将自产的资源税应税产品用于换取生产设备","C":"纳税人将自产的资源税应税产品用于偿债","D":"纳税人将自产的资源税应税产品用于职工福利"},"answer":["B","C","D"],"explanation":"（1）开采或者生产应税产品自用，视同销售，应当缴纳资源税；但是自用于连\n续生产应税产品的（选项A），不缴纳资源税。（2）纳税人自用应税产品应当\n缴纳资源税的情形，包括纳税人以应税产品用于非货币性资产交换（选项B）、\n捐赠、偿债（选项C）、赞助、集资、投资、广告、样品、职工福利（选项D）、\n利润分配或者连续生产非应税产品等。"},{"id":"q0295","chapter":"第6章","type":"multiple","stem":"根据资源税法律制度的规定，下列各项中，免征资源税的有（\n）。","options":{"A":"开采原油过程中用于加热的原油、天然气","B":"开采后出口的原油、天然气","C":"因安全生产需要抽采的煤成（层)气","D":"开采后自用的煤成（层)气"},"answer":["A","C"],"explanation":"有下列情形之一的，免征资源税：（1）开采原油以及在油田范围内运输原油过\n程中用于加热的原油、天然气；（2）煤炭开采企业因安全生产需要抽采的煤成\n（层)气。"},{"id":"q0296","chapter":"第6章","type":"multiple","stem":"下列各项中，免征环境保护税的有（\n）。","options":{"A":"规模化养鸡场排放应税污染物","B":"机动车排放应税污染物","C":"洗碗厂排放应税污染物","D":"航空器排放应税污染物"},"answer":["B","D"],"explanation":"选项A，农业生产排放应税污染物，暂予免征环境保护税，但不包括规模化养殖；\n选项B、D，机动车、铁路机车、非道路移动机械、船舶和航空器等流动污染源\n排放应税污染物的，暂予免征环境保护税；选项C，应照章缴纳环境保护税。"},{"id":"q0297","chapter":"第6章","type":"multiple","stem":"根据环境保护税法律制度的规定，下列表述正确的有（\n）。","options":{"A":"环境保护税由税务机关依法征收","B":"纳税义务发生时间为纳税人排放应税污染物的当日","C":"纳税人应当向应税污染物排放地的税务机关申报缴纳环境保护税","D":"环境保护税按月计算，按季申报缴纳，不能按固定期限计算缴纳的，可以按次\n申报缴纳"},"answer":["A","B","C","D"],"explanation":"选项A、B、C、D 表述均正确。"},{"id":"q0298","chapter":"第6章","type":"judge","stem":"根据契税法律制度的规定，土地使用权转让包括土地承包经营权和土地经营权\n的转移。（\n）","options":{"A":"正确","B":"错误"},"answer":["B"],"explanation":"契税征税范围中的土地使用权转让，是指土地使用者以出售、赠与、互换或者其\n他方式将土地使用权转移给其他单位和个人的行为。不包括土地承包经营权和土\n地经营权的转移。"},{"id":"q0299","chapter":"第6章","type":"judge","stem":"契税的纳税义务发生时间为纳税人签订土地、房屋权属转移合同的当天，或者\n纳税人取得其他具有土地、房屋权属转移合同性质凭证的当天。（\n）","options":{"A":"正确","B":"错误"},"answer":["A"],"explanation":"题目所述内容正确。"},{"id":"q0300","chapter":"第7章","type":"single","stem":"根据税收征收管理法律制度的规定，下列各项中，属于纳税主体权利的是\n（\n）。","options":{"A":"按期办理纳税申报","B":"委托税务代理权","C":"代扣、代收税款","D":"税务检查权"},"answer":["B"],"explanation":"选项A、C，属于纳税主体的义务；选项D，属于征税主体的职权。"},{"id":"q0301","chapter":"第7章","type":"single","stem":"根据税收征收管理法律制度的规定，关于发票的下列表述中，正确的是（\n）。","options":{"A":"销售货物开具发票时，可按付款方要求变更品名和金额","B":"经单位财务负责人批准后，可拆本使用发票","C":"税务机关进行发票检查需要将空白发票调出查验时，应当开具发票换票证","D":"收购单位向个人支付收购款项时，由付款方向收款方开具发票"},"answer":["D"],"explanation":"选项A，取得发票的主体在取得发票时，“不得”要求开票主体变更品名和金额（含\n单价和数量）；选项B，“不得”拆本使用发票；选项C，税务机关需要将“空白发\n票”调出查验时，需向被查验方开具“收据”；税务机关调出“已开具的发票”查验，\n才向其开具“发票换票证”；选项D，一般情况下由收款方向付款方开具发票。特\n殊情况下，收购单位和扣缴义务人支付个人款项时，由付款方向收款方开具发票，\n比如收购企业收购农产品时，由收购企业向农民开具农产品收购发票。"},{"id":"q0302","chapter":"第7章","type":"single","stem":"下列税款征收方式中，适用于纳税人财务制度不健全，生产经营不固定，零星\n分散、流动性大的税源的是（\n）。","options":{"A":"查账征收","B":"查定征收","C":"查验征收","D":"定期定额征收"},"answer":["C"],"explanation":"选项A，适用于财务会计制度健全，能够如实核算和提供生产经营状况，并能正\n确计算应纳税款和如实履行纳税义务的纳税人；选项B，适用于生产经营规模较\n小、产品零星、税源分散、会计账册不健全，但能“控制原材料”或进销货的小型\n厂矿和作坊；选项D，适用于税务机关批准的生产、经营规模小，达不到建账标\n准，难以查账征收，不能准确计算计税依据的个体工商户和个人独资企业。"},{"id":"q0303","chapter":"第7章","type":"single","stem":"甲公司为大型国有企业，财务会计制度健全，能够如实核算和提供生产经营情\n况，并能正确计算应纳税款和如实履行纳税义务，其适用的税款征收方式是\n（\n）。","options":{"A":"定期定额征收","B":"查账征收","C":"查定征收","D":"查验征收"},"answer":["B"],"explanation":"选项A，适用于经认定批准的生产、经营规模小，达不到建账标准，难以查账征\n收，不能准确计算计税依据的个体工商户和个人独资企业；选项C，适用于生产\n经营规模较小、产品零星、税源分散、会计账册不健全，但能控制原材料或进销\n货的小型厂矿和作坊；选项D，适用于纳税人财务制度不健全、生产经营不固定、\n零星分散、流动性大的税源。"},{"id":"q0304","chapter":"第7章","type":"single","stem":"甲公司按照规定，最晚应于2026 年1 月15 日缴纳应纳税款30 万元，该公司\n迟迟未缴。主管税务机关责令其于2026 年2 月28 日前缴纳，并加收滞纳金。\n但直到2026 年3 月15 日该公司才缴纳税款。已知税收滞纳金按照每日万分之\n五加收，则该公司应缴纳的滞纳金金额为（\n）元。","options":{"A":"8 850","B":"8 700","C":"9 000","D":"6 600"},"answer":["A"],"explanation":"税收滞纳天数的起止时间为自税款法定缴纳期限届满次日（1 月16 日）至实际\n缴纳税款之日（3 月15 日），从1 月16 日（含）到3 月15 日（含），共计16\n＋28＋15＝59（天）。滞纳金＝300 000×0.5‰×59＝8 850（元）。"},{"id":"q0305","chapter":"第7章","type":"single","stem":"以下属于税收强制执行措施的是（\n）。","options":{"A":"责令提供纳税担保","B":"书面通知开户银行扣缴税款","C":"冻结纳税人的金额相当于应纳税款的存款","D":"阻止出境"},"answer":["B"],"explanation":"税收强制执行措施具体包括：（1）强制扣款，即书面通知其开户银行或者其他\n金融机构从其存款中扣缴税款（选项B）；（2）拍卖变卖，即扣押、查封、依\n法拍卖或者变卖其价值相当于应纳税款的商品、货物或者其他财产，以拍卖或者\n变卖所得抵缴税款。"},{"id":"q0306","chapter":"第7章","type":"single","stem":"下列各项中，属于税收保全措施的是（\n）。","options":{"A":"责令纳税人提供纳税担保","B":"书面通知纳税人开户银行从其存款中扣缴税款","C":"扣押、查封纳税人的价值相当于应纳税款的财产","D":"拍卖纳税人的价值相当于应纳税款的财产"},"answer":["C"],"explanation":"税收保全措施包括：（1）书面通知纳税人开户银行或者其他金融机构冻结纳税\n人的金额相当于应纳税款的存款；（2）“扣押、查封”纳税人的价值相当于应纳\n税款的商品、货物或者其他财产。选项B、D，属于税收强制执行措施；选项A，\n责令提供纳税担保与税收保全措施、税收强制执行措施均属于税款征收的保障措\n施。"},{"id":"q0307","chapter":"第7章","type":"single","stem":"因税务机关的责任，致使纳税人少缴税款的，税务机关在（\n）内可以要求\n纳税人补缴税款。","options":{"A":"1 年","B":"3 年","C":"5 年","D":"2 年"},"answer":["B"],"explanation":"因税务机关的责任，致使纳税人、扣缴义务人未缴或者少缴税款的，税务机关在\n“3 年内”可以要求纳税人、扣缴义务人补缴税款，但是不得加收滞纳金。因纳税\n人、扣缴义务人计算错误等失误，未缴或者少缴税款的，税务机关在3 年内可以\n追征税款、滞纳金；有特殊情况的，追征期可以延长到5 年。"},{"id":"q0308","chapter":"第7章","type":"single","stem":"根据税收征收管理法律制度的规定，下列各项中，（\n）不属于确定失信主\n体的依据。","options":{"A":"骗取国家出口退税款的","B":"虚开增值税专用发票的","C":"虚开增值税普通发票100 份或者金额400 万元以上的","D":"为纳税人非法提供银行账户，导致未缴、少缴税款50 万元以上的"},"answer":["D"],"explanation":"选项A、B、C，属于确定失信主体的依据；选项D，为纳税人、扣缴义务人非法\n提供银行账户、发票、证明或其他方便，导致未缴、少缴税款“100 万元”以上或\n骗取国家出口退税款的，属于确定失信主体的依据。"},{"id":"q0309","chapter":"第7章","type":"single","stem":"根据税收征收管理法律制度的规定，下列关于税务行政复议管辖的表述中，\n不正确的是（\n）。","options":{"A":"对税务局的稽查局的行政行为不服的，向其所属税务局申请行政复议","B":"对计划单列市税务局的行政行为不服的，向其所在省的省税务局申请行政复议","C":"对市辖区税务局的行政行为不服的，向市税务局申请行政复议","D":"对国家税务总局的行政行为不服的，向国家税务总局申请行政复议"},"answer":["B"],"explanation":"选项B，对“计划单列市”税务局的行政行为不服的，向“国家税务总局”申请行政\n复议。"},{"id":"q0310","chapter":"第7章","type":"single","stem":"H 市M 县税务局对甲公司的违法行为处以罚款，甲公司未及时缴纳罚款，M\n县税务局又加处罚款。甲公司对已处罚款和加处罚款均不服，欲申请行政复议。\n下列关于税务行政复议管辖的表述中，正确的是（\n）。","options":{"A":"向H 市税务局申请行政复议","B":"向M 县税务局申请行政复议","C":"加处罚款向H 市税务局申请行政复议，罚款向M 县税务局申请行政复议","D":"加处罚款向M 县税务局申请行政复议，罚款向H 市税务局申请行政复议"},"answer":["A"],"explanation":"对税务机关作出逾期不缴纳罚款加处罚款的决定不服的，向作出行政处罚决定的\n税务机关申请行政复议，但是对“已处罚款和加处罚款”都不服的，一并向作出行\n政处罚决定的税务机关的上一级税务机关（H 市税务局）申请行政复议。因此本\n题选项A 当选。"},{"id":"q0311","chapter":"第7章","type":"multiple","stem":"根据《税收征收管理法》的规定，下列关于税务登记的表述，正确的有（\n）。","options":{"A":"已领取营业执照的纳税人，向税务机关申报办理税务登记的时间为自领取营业\n执照之日起15 日内","B":"按规定纳税人不需要在市场监管部门办理变更登记的，应当自税务登记内容实\n际发生变化起30 日内，到原税务登记机关申报办理变更税务登记","C":"实行定期定额征收方式的个体工商户需要停业的，应当在停业前向税务机关申\n报办理停业登记","D":"纳税人被市场监管部门吊销营业执照的，应当自营业执照被吊销之日起15 日\n内，向原税务登记机关申报办理注销税务登记"},"answer":["B","C","D"],"explanation":"选项A，已领取营业执照的纳税人，向税务机关申报办理税务登记的时间为自领\n取营业执照之日起“30 日”内。"},{"id":"q0312","chapter":"第7章","type":"multiple","stem":"根据税收征收管理法律制度的规定，下列表述错误的有（\n）。","options":{"A":"纳税人被市场监管部门吊销营业执照，应在原税务登记机关办理停业登记","B":"纳税人的停业期限不得超过6 个月","C":"纳税人负有纳税申报义务，但连续3 个月所有税种均未纳税申报，税收征管系\n统自动将其认定为非正常户","D":"已办理税务登记的扣缴义务人发生扣缴税款义务的，无须办理扣缴税款登记"},"answer":["A","B","D"],"explanation":"选项A，纳税人被市场监督管理部门吊销营业执照，应在原税务登记机关办理“注\n销”税务登记；选项B，纳税人的停业期限不得超过1 年；选项D，已办理税务\n登记的扣缴义务人应在自扣缴义务发生之日起30 日内，向税务登记地税务机关\n申报办理扣缴税款登记。"},{"id":"q0313","chapter":"第7章","type":"multiple","stem":"根据税收征收管理法律制度的规定，下列关于发票、账簿和凭证管理的说法中，\n正确的有（\n）。","options":{"A":"从事生产、经营的纳税人应当自领取营业执照或者发生纳税义务之日起15 日\n内设置账簿","B":"扣缴义务人应当自税收法律、行政法规规定的扣缴义务发生之日起10 日内设\n置账簿","C":"账簿、记账凭证、报表、完税凭证、发票、出口凭证及其他涉税资料应保存5\n年","D":"已经开具的发票存根联应保存10 年"},"answer":["A","B"],"explanation":"选项C，账簿、记账凭证、报表、完税凭证、发票、出口凭证及其他有关涉税资\n料应保存10 年；选项D，已经开具的发票存根联应保存5 年。"},{"id":"q0314","chapter":"第7章","type":"multiple","stem":"根据税收征收管理法律制度的规定，下列关于纳税申报的表述中，正确的有\n（\n）。","options":{"A":"邮寄申报以税务机关收到的邮戳日期为实际申报日期","B":"采用数据电文申报的，以税务机关的计算机网络系统收到该数据电文的时间为\n实际申报日期","C":"经核准延期办理纳税申报、报送事项的，应当在纳税期内按照上期实际缴纳的\n税额或者税务机关核定的税额预缴税款，并在核准的延期内办理税款结算","D":"纳税人在纳税期内没有应纳税款的，也应当按照规定办理纳税申报"},"answer":["B","C","D"],"explanation":"选项A，邮寄申报以“寄出”的邮戳日期为实际申报日期。"},{"id":"q0315","chapter":"第7章","type":"multiple","stem":"根据税收征收管理法律制度的规定，下列情形中税务机关有权核定纳税人应纳\n税额的有（\n）。","options":{"A":"纳税人设置的账簿账目混乱难以查账的","B":"纳税人按法律、行政法规规定应当设置但未设置账簿的","C":"纳税人与其关联企业之间的业务往来不符合独立交易原则的","D":"纳税人未按照规定的期限缴纳税款，经税务机关责令限期缴纳，逾期仍不缴纳\n的"},"answer":["A","B"],"explanation":"选项C，纳税人与其关联企业之间的业务往来不符合独立交易原则的，税务机关\n有权对其应纳税额进行合理“调整”，而非“核定”；选项D，纳税人未按照规定的\n期限“缴纳税款”，经税务机关责令限期缴纳，逾期仍不缴纳的，税务机关可以采\n取强制执行措施，而非核定其应纳税额。"},{"id":"q0316","chapter":"第7章","type":"multiple","stem":"根据税收征收管理法律制度的规定，下列关于纳税担保的表述中，正确的有\n（\n）。","options":{"A":"纳税担保方式包括质押、扣押、抵押","B":"纳税担保的范围包括税款、罚款、滞纳金和实现税款、滞纳金的费用","C":"纳税保证期间内税务机关未通知纳税保证人缴纳税款及滞纳金以承担担保责\n任的，纳税保证人免除担保责任","D":"欠缴税款的纳税人需要出境的，应当在出境前向税务机关结清应纳税款、滞纳\n金或者提供担保"},"answer":["C","D"],"explanation":"选项A，纳税担保方式包括质押、保证、抵押，不包括扣押；选项B，纳税担保\n的范围包括税款、滞纳金和实现税款、滞纳金的费用，不包括罚款。"},{"id":"q0317","chapter":"第7章","type":"multiple","stem":"税务机关拟对个体工商户业主王某采取税收保全措施，王某的下列财产中，可\n以采取税收保全措施的有（\n）。","options":{"A":"现金","B":"价值10 万元的金银首饰","C":"价值2 000 元的电视机","D":"维持自己生活必需的唯一普通住房"},"answer":["A","B"],"explanation":"选项C，税务机关对单价5 000 元以下的其他生活用品，不采取税收保全措施；\n选项D，个人及其所扶养家属维持生活必需的住房和用品，不在税收保全措施的\n范围之内。"},{"id":"q0318","chapter":"第7章","type":"multiple","stem":"根据税收征收管理法律制度的规定，下列税务机关进行税务检查的做法中，正\n确的有（\n）。","options":{"A":"检查扣缴义务人代扣代缴、代收代缴税款账簿、记账凭证和有关资料","B":"检查纳税人托运、邮寄应税商品、货物或者其他财产的有关单据","C":"检查纳税人存放在生产、经营场所的应纳税的货物","D":"调查税务违法案件时，对与案件有关的情况和资料，进行记录、录音、录像、\n照相和复制"},"answer":["A","B","C","D"],"explanation":"选项A、B、C、D 做法均正确。"},{"id":"q0319","chapter":"第7章","type":"multiple","stem":"根据纳税缴费信用管理的规定，下列说法中，正确的有（\n）。","options":{"A":"纳税缴费信用评价周期为6 个月","B":"有严重失信行为的纳税人，纳税缴费信用评价采取直接判级方式","C":"纳税缴费信用级别分为A、B、C、D、E 五级","D":"距首次在税务机关办理税费事宜时间不满一个评价年度的经营主体，不参加本\n期年度评价"},"answer":["B","D"],"explanation":"选项A，纳税缴费信用评价周期为一个公历年度；选项C，纳税缴费信用级别分\n为A、B、M、C、D 五级。"},{"id":"q0320","chapter":"第7章","type":"multiple","stem":"根据税收征收管理法律制度的规定，纳税人对税务机关的下列行政行为不服\n时，可以直接提起行政诉讼的有（\n）。","options":{"A":"征税行为","B":"行政罚款","C":"纳税缴费信用等级评定","D":"税收强制执行"},"answer":["B","C","D"],"explanation":"选项A，申请人对税务机关作出的征税行为不服的，应当先向复议机关申请行政\n复议，对行政复议决定不服的，可以再向人民法院提起行政诉讼（必经复议）。"},{"id":"q0321","chapter":"第7章","type":"multiple","stem":"根据税收征收管理法律制度的规定，纳税人对税务机关的下列行政行为不服\n时，应当先向复议机关申请行政复议的有（\n）。","options":{"A":"加收滞纳金","B":"资格认定行为","C":"税收保全措施","D":"确认纳税主体"},"answer":["A","D"],"explanation":"必经复议的范围：申请人对复议范围中的“征税行为”不服的，应当先向复议机关\n申请行政复议；对行政复议决定不服的，可以再向人民法院提起行政诉讼。选项\nA、D，属于征税行为，应当必经复议；选项B、C，属于选择复议的行政行为。"},{"id":"q0322","chapter":"第7章","type":"multiple","stem":"根据税收征收管理法律制度的规定，关于税务行政复议管辖的下列表述中，\n正确的有（\n）。","options":{"A":"对两个以上税务机关以共同的名义作出的行政行为不服的，向共同上一级税务\n机关申请行政复议","B":"对被撤销的税务机关在撤销以前所作出的行政行为不服的，向继续行使其职权\n的税务机关的上一级税务机关申请行政复议","C":"对税务机关作出的逾期不缴纳罚款加处罚款的决定不服的，向作出行政处罚决\n定的税务机关的上一级税务机关申请行政复议","D":"对税务机关与其他行政机关以共同的名义作出的行政行为不服的，向其共同上\n一级行政机关申请行政复议"},"answer":["A","B","D"],"explanation":"选项C，对税务机关作出的逾期不缴纳罚款加处罚款的决定不服的，向作出行政\n处罚决定的税务机关申请行政复议，而非其上一级。"},{"id":"q0323","chapter":"第7章","type":"multiple","stem":"根据税收征收管理法律制度的规定，下列关于税务行政复议的表述中，正确\n的有（\n）。","options":{"A":"税务机关收到不属于本机关管辖的行政复议申请，应当告知申请人有管辖权的\n复议机关","B":"纳税人对税务机关作出逾期不缴纳罚款加处罚款的决定不服的，应当先缴纳罚\n款和加处罚款，再申请行政复议","C":"申请人对逾期未缴纳税款加收滞纳金的行政行为不服的，不用先行解缴税款及\n滞纳金，可以直接提出税务行政复议申请","D":"行政复议决定书一经送达，即发生法律效力"},"answer":["A","B","D"],"explanation":"选项C，申请人对征税行为不服申请税务行政复议的，必须依照税务机关根据法\n律、行政法规确定的税额、期限，先行缴纳或者解缴税款及滞纳金，或者提供相\n应的担保，才可以在实际缴清税款和滞纳金后或者所提供的担保得到作出行政行\n为的税务机关确认之日起60 日内提出行政复议申请。"},{"id":"q0324","chapter":"第7章","type":"multiple","stem":"下列属于税法规定的逃税手段的有（\n）。","options":{"A":"伪造变造账簿、记账凭证","B":"以暴力拒不缴纳税款","C":"隐匿、擅自销毁账簿和记账凭证","D":"转移或者隐匿财产"},"answer":["A","C"],"explanation":"选项B，属于抗税行为；选项D，属于欠税行为的手段。"},{"id":"q0325","chapter":"第7章","type":"judge","stem":"国家机关、个人和无固定生产经营场所的流动性农村小商贩，无须办理税务登\n记。（\n）","options":{"A":"正确","B":"错误"},"answer":["A"],"explanation":"题目所述内容正确。"},{"id":"q0326","chapter":"第7章","type":"judge","stem":"根据税收征收管理法律制度，纳税人确有困难，可延期缴纳税款，但最长不得\n超过6 个月。（\n）","options":{"A":"正确","B":"错误"},"answer":["B"],"explanation":"纳税人因有特殊困难不能按期缴纳税款的，经批准可以延期缴纳税款，但最长不\n得超过“3 个月”。"},{"id":"q0327","chapter":"第7章","type":"judge","stem":"对纳税人已缴纳税款，但拒不缴纳滞纳金的，税务机关不可以单独对纳税人应\n缴未缴的滞纳金采取强制执行措施。（\n）","options":{"A":"正确","B":"错误"},"answer":["B"],"explanation":"对纳税人已缴纳税款但拒不缴纳滞纳金的，税务机关“可以”单独对纳税人应缴未\n缴的滞纳金采取强制执行措施。"},{"id":"q0328","chapter":"第8章","type":"single","stem":"周某于2025 年4 月11 日进入甲公司就职，双方于2026 年4 月11 日签订劳\n动合同。已知周某每月工资2 000 元，已按时足额领取。甲公司应向周某支付工\n资补偿的金额是（\n）元。","options":{"A":"0","B":"2 000","C":"22 000","D":"24 000"},"answer":["C"],"explanation":"用人单位自用工之日起满1 年未与劳动者订立书面劳动合同，应当从用工之日起\n满1 个月的次日，至满1 年的前一日向劳动者每月支付2 倍的工资，所以甲公司\n应向周某支付工资补偿的金额是2 000×11＝22 000（元）。"},{"id":"q0329","chapter":"第8章","type":"single","stem":"公司职工甲因工作疏忽给公司造成经济损失10 000 元，已知甲每月工资收入\n为2 500 元，当地月最低工资为1 800 元。根据劳动合同法律制度的规定，该公\n司每月可从甲工资中扣除的最高限额为（\n）元。","options":{"A":"500","B":"700","C":"800","D":"1 000"},"answer":["A"],"explanation":"本题考查扣工资以赔偿经济损失的规定。计算思路如下：（1）准予按劳动者当\n月工资的20%扣除＝当月工资×20%＝2 500×20%＝500（元）；（2）扣除后的剩\n余工资＝2 500－500＝2 000（元）；（3）将扣除后的剩余工资（2 000 元）与\n当地月最低工资标准（1 800 元）进行比较，二者较高者作为实际发放的工资，\n即实际发放2 000 元。因此公司每月可以从甲工资中扣除的最高限额为2 500－2\n000＝500（元）。"},{"id":"q0330","chapter":"第8章","type":"single","stem":"2025 年10 月甲公司安排职工李某于10 月1 日（国庆节）、10 月12 日（周日）\n分别加班1 天，事后未安排其补休。已知甲公司实行标准工时制，李某的日工资\n为400 元。计算甲公司应支付李某10 月最低加班工资的下列算式中，正确的是\n（\n）。","options":{"A":"1×400×300%＋1×400×300%＝2 400（元）","B":"1×400×300%＋1×400×200%＝2 000（元）","C":"0","D":"1×400×100%＋1×400×200%＝1 200（元）"},"answer":["B"],"explanation":"本题考查最低加班工资的支付规定：用人单位安排劳动者休息日加班（10 月12\n日加班1 天），未安排补休的，加班工资不低于劳动者本人日工资标准的200%；\n法定休假节日加班（10 月1 日加班1 天），无论是否补休，加班工资不低于劳\n动者本人日工资标准的300%。因此甲公司应支付李某10 月最低加班工资为1×\n400×300%＋1×400×200%＝2 000（元）。"},{"id":"q0331","chapter":"第8章","type":"single","stem":"贾某自2013 年1 月3 日开始工作，2021 年5 月23 日，贾某到甲公司工作。\n2025 年5 月7 日，贾某向公司提出休年休假申请。贾某依法可享受的年休假天\n数为（\n）。","options":{"A":"0","B":"5 天","C":"10 天","D":"15 天"},"answer":["C"],"explanation":"带薪年休假天数跟职工“累计工作年限”有关，累计工作年限，指劳动者自参加工\n作以来的工作年限总和。职工累计工作已满1 年不满10 年的，年休假5 天；已\n满10 年不满20 年的，年休假10 天；已满20 年的，年休假15 天。贾某累计工\n作年限超过12 年（2013 年1 月3 日—2025 年5 月7 日），可享受的带薪年休\n假为10 天，需注意“2021 年5 月23 日”为干扰条件，解题时无须考虑。"},{"id":"q0332","chapter":"第8章","type":"single","stem":"方某工作已满15 年，2025 年上半年在甲公司已休带薪年休假（以下简称年休\n假）5 天；2025 年7 月1 日调到乙公司工作，提出补休年休假的申请，按照法\n律规定方某可以补休（\n）天年休假。","options":{"A":"0","B":"5","C":"10","D":"15"},"answer":["B"],"explanation":"职工累计工作已满10 年不满20 年的，年休假10 天。方某2025 年7 月1 日进\n入乙公司，新进职工本年剩余年休假天数＝（当年度在本单位剩余日历天数/365\n天）×职工本人全年应享受的年休假天数＝184÷365×10＝5（天）（折算后不足\n1 整天的，不享受年休假）。所以方某在乙公司可以补休5 天年休假。"},{"id":"q0333","chapter":"第8章","type":"single","stem":"2025 年3 月1 日，甲公司聘用赵某并与其订立了2 年期限劳动合同，约定试\n用期4 个月，试用期月工资3 600 元，试用期满月工资4 500 元。试用期间，甲\n公司依照约定向赵某支付了试用期工资。2025 年11 月4 日，赵某以试用期约定\n违法为由，要求甲公司支付赔偿金。已知，甲公司所在地月最低工资标准为2 000\n元。根据劳动合同法律制度的规定，甲公司依法应向赵某支付的赔偿金数额为\n（\n）。","options":{"A":"4 000 元","B":"1 800 元","C":"9 000 元","D":"7 200 元"},"answer":["C"],"explanation":"（1）劳动合同期限为2 年的，试用期最长为2 个月，甲公司和赵某约定的试用\n期有2 个月属于违法试用期；（2）违法约定的试用期已经履行的，由用人单位\n以劳动者试用期满月工资（4 500 元）为标准，按已经履行的超过法定试用期的\n期间（2 个月）向劳动者支付赔偿金（4 500×2＝9 000 元）。"},{"id":"q0334","chapter":"第8章","type":"single","stem":"甲企业与职工刘某签订劳动合同，安排刘某参加专项技术培训并为此支付培训\n费用6 000 元，双方约定了4 年服务期及10 000 元的违约金。刘某工作1 年后，\n因甲企业未按劳动合同约定提供劳动保护，遂书面通知甲企业解除劳动合同。下\n列说法中，符合法律规定的是（\n）。","options":{"A":"刘某需支付违约金10 000 元，且甲企业无需支付经济补偿","B":"刘某无需支付违约金，但甲企业需支付经济补偿","C":"刘某需支付违约金4 500 元，且甲企业无需支付经济补偿","D":"双方不得在服务期协议中约定违约金"},"answer":["B"],"explanation":"（1）《劳动合同法》第二十五条明确规定，禁止用人单位对劳动合同服务期和\n竞业限制之外的其他事项与劳动者约定由劳动者承担违约金，本题涉及服务期，\n因此可以约定违约金，选项D 错误。（2）用人单位与劳动者约定了服务期，劳\n动者因用人单位有过错解除劳动合同的，不属于违反服务期的约定，用人单位不\n得要求劳动者支付违约金。本题中甲企业有过错，不得要求刘某支付违约金，选\n项A、C 错误。（3）用人单位未按照劳动合同约定提供劳动保护的，劳动者可\n随时通知用人单位解除劳动合同，用人单位应当向劳动者支付经济补偿。综上，\n选项B 表述正确。"},{"id":"q0335","chapter":"第8章","type":"single","stem":"下列各项中，属于劳动者不需事先告知用人单位即可解除劳动合同的情形是\n（\n）。","options":{"A":"劳动者在试用期内，因个人原因决定离职的","B":"用人单位以欺诈、胁迫的手段或者乘人之危，使劳动者在违背真实意思的情况\n下订立或者变更劳动合同致使劳动合同无效的","C":"用人单位违反法律、行政法规强制性规定的","D":"用人单位以暴力、威胁或者非法限制人身自由的手段强迫劳动者劳动的"},"answer":["D"],"explanation":"选项A，属于劳动者需要提前3 日通知用人单位解除劳动合同的情形；选项B、\nC，属于劳动者可以随时通知解除劳动合同的情形。"},{"id":"q0336","chapter":"第8章","type":"single","stem":"吴某为甲公司员工，劳动合同期满时已在甲公司连续工作4 年零1 个月。甲公\n司提出续签劳动合同，但将吴某月工资降至原有的80%，吴某因此拒绝续签并要\n求甲公司支付经济补偿金。已知吴某在劳动合同解除前12 个月的平均工资为6\n000 元，当地上年度职工月平均工资为7 000 元。根据劳动合同法律制度的规定，\n关于经济补偿金的计算，下列选项中正确的是（\n）。","options":{"A":"4×7 000＝28 000（元）","B":"4.5×6 000＝27 000（元）","C":"4.5×（7 000×3）＝94 500（元）","D":"0"},"answer":["B"],"explanation":"（1）根据《劳动合同法》的规定，当劳动合同期满，用人单位维持或者提高劳\n动合同约定条件续订劳动合同，劳动者不同意续订的，用人单位不需要支付经济\n补偿金。但如果用人单位降低条件续订劳动合同，劳动者不同意续订，用人单位\n应当支付经济补偿金。本题中甲公司因降低工资条件导致吴某拒绝续签劳动合\n同，甲公司需支付经济补偿金。（2）吴某原月平均工资为6 000 元，未超过当\n地上年度职工月平均工资三倍（7 000×3＝21 000 元），同时题目未给出当地最\n低工资标准，因此直接按吴某原月平均工资作为补偿基数。（3）吴某在甲公司\n工作4 年零1 个月，根据“每满1 年支付1 个月工资，不满6 个月的部分支付半\n个月工资的经济补偿”的规定，本题应按4.5 年作为补偿年限。（4）经济补偿金\n＝补偿年限×补偿基数＝4.5×6 000＝27 000（元）。"},{"id":"q0337","chapter":"第8章","type":"single","stem":"赵某在甲企业工作3 年，今年年初赵某因病住院，甲企业以赵某无法继续工\n作为由与其解除劳动合同。后赵某以在规定的医疗期内解除劳动合同违法为由，\n要求甲企业支付赔偿金。已知赵某上年度月平均工资为6 000 元，当地上年度职\n工月平均工资为5 000 元，根据劳动合同法律制度的规定，甲企业依法应向赵某\n支付的赔偿金数额为（\n）元。","options":{"A":"18 000","B":"36 000","C":"15 000","D":"30 000"},"answer":["B"],"explanation":"（1）用人单位违反《劳动合同法》规定解除或者终止劳动合同，劳动者不要求\n继续履行劳动合同或劳动合同已不能继续履行的，用人单位应当依照《劳动合同\n法》规定的经济补偿标准的2 倍向劳动者支付赔偿金；（2）赵某月平均工资（6\n000 元），未超过当地上年度职工月平均工资三倍（5 000×3＝15 000 元），同\n时题目未给出当地最低工资标准，因此以6 000 元作为计算基数；（3）赔偿金\n＝经济补偿金×2＝本单位工作年限×月平均工资×2＝3×6 000×2＝36 000（元）。"},{"id":"q0338","chapter":"第8章","type":"single","stem":"2012 年2 月1 日，郑某到甲公司工作。2025 年5 月7 日，郑某因公司未及时\n足额向其支付劳动报酬而解除劳动合同。已知郑某离职前12 个月的平均工资是\n20 000 元，当地上年度职工月平均工资是5 000 元，计算劳动合同解除时甲公司\n应向郑某支付经济补偿数额的下列算式中，正确的是（\n）。","options":{"A":"5 000×3×12","B":"5 000×3×13.5","C":"20 000×12","D":"20 000×13.5"},"answer":["A"],"explanation":"劳动者月工资高于用人单位所在直辖市、设区的市级人民政府公布的本地区上年\n度职工月平均工资三倍的，向其支付经济补偿的标准按职工月平均工资三倍的数\n额支付，向其支付经济补偿的年限最高不超过十二年。"},{"id":"q0339","chapter":"第8章","type":"single","stem":"根据劳动合同法律制度的规定，下列关于劳务派遣的说法中，不正确的是\n（\n）。","options":{"A":"劳务派遣单位和用工单位不得向被派遣劳动者收取费用","B":"在劳务派遣关系中，签署劳动合同的当事人是劳务派遣单位和被派遣劳动者","C":"劳务派遣单位应当与被派遣劳动者订立1 年期限书面劳动合同","D":"被派遣劳动者在无工作期间，劳务派遣单位应当按照所在地人民政府规定的最\n低工资标准，向其按月支付报酬"},"answer":["C"],"explanation":"选项C，劳务派遣单位应当与被派遣劳动者订立2 年以上的固定期限书面劳动合\n同，按月支付劳动报酬。"},{"id":"q0340","chapter":"第8章","type":"single","stem":"2025 年7 月10 日，刘某到甲公司上班，公司自9 月10 日起一直拖欠其劳动\n报酬，直至2026 年1 月10 日双方劳动关系终止。下列关于刘某申请劳动仲裁\n的期间的表述中，正确的是（\n）。","options":{"A":"应自2025 年9 月10 日起1 年内提出申请","B":"应自2025 年9 月10 日起3 年内提出申请","C":"应自2026 年1 月10 日起1 年内提出申请","D":"应自2025 年7 月10 日起3 年内提出申请"},"answer":["C"],"explanation":"劳动关系存续期间因拖欠劳动报酬发生争议的，劳动者申请仲裁不受1 年仲裁时\n效期间的限制；但是，劳动关系终止的，应当自劳动关系终止之日起1 年内提出。"},{"id":"q0341","chapter":"第8章","type":"single","stem":"根据劳动争议调解仲裁法律制度的规定，下列表述中不正确的是（\n）。","options":{"A":"劳动关系存续期间因拖欠劳动报酬发生争议，之后劳动关系终止的，应当自劳\n动关系终止之日起1 年内提出劳动仲裁","B":"劳动者和用人单位发生劳动争议，双方当事人分别向劳动合同履行地和用人单\n位所在地的仲裁委员会申请仲裁的，由劳动合同履行地的仲裁委员会管辖","C":"一般情况下，劳动仲裁的时效期间为当事人知道或者应当知道其权利被侵害之\n日起3 年","D":"书写仲裁申请确有困难的，可以口头申请，由劳动争议仲裁委员会记入笔录，\n经申请人签名、盖章或者捺印确认，并告知对方当事人"},"answer":["C"],"explanation":"一般情况下，劳动仲裁的时效期间为当事人知道或者应当知道其权利被侵害之日\n起“1 年”。"},{"id":"q0342","chapter":"第8章","type":"single","stem":"根据社会保险法律制度的规定，下列选项中，职工不需要缴纳的是（\n）。","options":{"A":"职工基本养老保险费","B":"工伤保险费","C":"职工基本医疗保险费","D":"失业保险费"},"answer":["B"],"explanation":"职工应当参加工伤保险，由用人单位缴纳工伤保险费，职工不缴纳工伤保险费。"},{"id":"q0343","chapter":"第8章","type":"single","stem":"制胜公司职工王某患病住院。已知王某月工资为4 000 元，当地月最低工资\n标准为2 000 元。制胜公司每月向其支付的病假工资不得低于（\n）元。","options":{"A":"1 600","B":"3 200","C":"2 000","D":"4 000"},"answer":["A"],"explanation":"企业职工医疗期的病假工资或疾病救济费可以低于当地最低工资标准，但不能低\n于最低工资标准的80%，因此王某病假工资不得低于2 000×80%＝1 600（元）。"},{"id":"q0344","chapter":"第8章","type":"single","stem":"周某系A 公司正式员工，后经A 公司同意，到B 公司兼职，并与B 公司签订\n了劳动合同，周某在兼职过程中因工受伤。已知A 公司按照规定按时为周某缴\n纳了工伤保险费，B 公司并未为周某缴纳工伤保险费。下列说法正确的是（\n）。","options":{"A":"应当由A 公司支付工伤保险待遇","B":"应当由B 公司支付工伤保险待遇","C":"A 公司和B 公司共同支付工伤保险待遇","D":"员工可以指定A 公司或B 公司支付工伤保险待遇"},"answer":["B"],"explanation":"（1）周某在两个用人单位同时就业，各用人单位应当分别为职工缴纳工伤保险\n费，职工发生工伤，由职工“受到伤害时”工作的单位（B 公司）依法承担工伤保\n险责任；（2）职工所在用人单位未依法缴纳工伤保险费，发生工伤事故的，由\n用人单位支付工伤保险待遇，因此应该由B 公司支付工伤保险待遇。"},{"id":"q0345","chapter":"第8章","type":"single","stem":"根据社会保险法律制度的规定，职工出现伤亡的下列情形中，应当认定为工\n伤的是（\n）。","options":{"A":"在下班途中受到本人负主要责任交通事故伤害的","B":"因本人故意犯罪导致在工作中伤亡的","C":"在工作时间和工作岗位，突发疾病72 小时后死亡的","D":"工作时间前在工作场所内，从事与工作有关的预备性工作受到事故伤害的"},"answer":["D"],"explanation":"选项A，在上下班途中，受到非本人主要责任的交通事故伤害的，才能应当认定\n为工伤；选项B，故意犯罪、醉酒或者吸毒、自残或者自杀，不能认定为工伤；\n选项C，在工作时间和工作岗位，突发疾病死亡或者在48 小时内经抢救无效死\n亡的，可以视同工伤，所以选项C 既不能视同工伤，也不能认定为工伤。"},{"id":"q0346","chapter":"第8章","type":"single","stem":"根据工伤保险法律制度的规定，下列表述中不正确的是（\n）。","options":{"A":"在停工留薪期内，原工资福利待遇不变，从工伤保险基金中按月支付","B":"停工留薪期一般不超过12 个月","C":"一次性工亡补助金的标准为上一年度全国城镇居民人均可支配收入的20 倍","D":"工伤职工评定伤残等级后，停止享受停工留薪期待遇，按照规定享受伤残待遇"},"answer":["A"],"explanation":"选项A，在停工留薪期内，原工资福利待遇不变，由“所在单位”按月支付，而非\n从工伤保险基金支付。"},{"id":"q0347","chapter":"第8章","type":"single","stem":"失业人员失业前用人单位和本人累计缴费满1 年不足5 年的，领取失业保险\n金的最长期限为（\n）。","options":{"A":"6 个月","B":"12 个月","C":"18 个月","D":"24 个月"},"answer":["B"],"explanation":"失业人员失业前用人单位和本人累计缴费满1 年不足5 年的，领取失业保险金的\n期限最长为12 个月；缴费满5 年不足10 年的，领取失业保险金的期限最长为\n18 个月；缴费10 年以上的，领取失业保险金的期限最长为24 个月。"},{"id":"q0348","chapter":"第8章","type":"single","stem":"根据社会保险法律制度的规定，下列关于失业保险待遇的表述中，不正确的\n是（\n）。","options":{"A":"失业保险金领取期限自办理失业登记之日起计算","B":"失业人员在领取失业保险金期间，参加职工基本医疗保险，享受基本医疗保险\n待遇","C":"失业保险金的标准一般不低于当地最低工资标准","D":"对领取失业保险金期满仍未就业且距法定退休年龄不足1 年的失业人员，可继\n续发放失业保险金至法定退休年龄"},"answer":["C"],"explanation":"选项C，失业保险金的标准，不得低于城市居民最低生活保障标准，一般也不高\n于当地最低工资标准，即城市居民最低生活保障标准≤失业保险金≤当地最低工\n资标准。"},{"id":"q0349","chapter":"第8章","type":"multiple","stem":"根据劳动合同法律制度的规定，下列选项中，符合法律规定的有（\n）。","options":{"A":"丙超市可以与刚满15 周岁的初中毕业生赵某订立劳动合同","B":"乙公司与劳动者李某在用工前订立劳动合同的，劳动关系自用工之日起建立","C":"甲公司设立的分公司已领取营业执照，该分公司可以与张某订立劳动合同","D":"丁公司要求王某提供2 000 元保证金后才与其订立劳动合同"},"answer":["B","C"],"explanation":"选项A，一般单位，禁止招用未满16 周岁的未成年人，赵某未满16 周岁，且丙\n超市属于一般单位（非文艺、体育、特种工艺单位），其招用赵某的做法不符合\n法律规定；选项D，用人单位招用劳动者，不得扣押劳动者的居民身份证和其他\n证件，不得要求劳动者提供担保或者以其他名义向劳动者收取财物。"},{"id":"q0350","chapter":"第8章","type":"multiple","stem":"保洁员刘女士与甲公司于2026 年1 月1 日订立了期限为2 年的非全日制用工\n合同。下列选项中，不符合我国劳动合同法律制度规定的有（\n）。","options":{"A":"甲公司可以与刘女士订立口头协议","B":"刘女士只有经甲公司同意才可与其解除劳动合同","C":"每月月底结算工资","D":"刘女士可以同时在乙公司做保洁，但不得影响与甲公司劳动合同的履行"},"answer":["B","C"],"explanation":"选项A，非全日制用工双方当事人可以订立口头协议；选项B，非全日制用工双\n方当事人任何一方都可以随时通知对方终止用工；选项C，用人单位可以按小时、\n日或周为单位结算工资，但非全日制用工劳动报酬结算支付周期最长不得超过\n15 日；选项D，从事非全日制用工的劳动者可以与一个或者一个以上用人单位\n订立劳动合同；但是，后订立的劳动合同不得影响先订立的劳动合同的履行。"},{"id":"q0351","chapter":"第8章","type":"multiple","stem":"2025 年6 月1 日，华某进入甲公司工作。2025 年10 月1 日，甲公司提出订立\n书面劳动合同。下列关于双方劳动关系的表述中，正确的有（\n）。","options":{"A":"甲公司应向华某支付2025 年6 月1 日至2025 年9 月30 日期间的2 倍工资","B":"若华某拒绝补订劳动合同，甲公司应向华某支付经济补偿","C":"应视为自2025 年7 月1 日起甲公司已与华某订立无固定期限劳动合同","D":"若华某拒绝补订劳动合同，甲公司应书面通知华某终止劳动关系"},"answer":["B","D"],"explanation":"选项A，用人单位超过1 个月不满1 年未与劳动者订立书面劳动合同的，自用工\n之日起满1 个月的次日（2025 年7 月1 日）至补订书面劳动合同的前一日（2025\n年9 月30 日）应当向劳动者每月支付2 倍的工资，“2025 年6 月1 日”表述错误；\n选项C，用人单位自用工之日起满1 年未与劳动者订立书面劳动合同的，视为自\n用工之日起满1 年的当日（2026 年6 月1 日）已经与劳动者订立无固定期限劳\n动合同，本题未满1 年且“2025 年7 月1 日”表述错误。"},{"id":"q0352","chapter":"第8章","type":"multiple","stem":"根据劳动合同法律制度的规定，下列情形中，可导致劳动合同无效或者部分无\n效的有（\n）。","options":{"A":"劳动合同条款违反法律、行政法规强制性规定的","B":"劳动合同欠缺必备条款的","C":"一方当事人以胁迫的手段，使对方在违背真实意思的情况下订立的","D":"劳动合同签订后，用人单位发生分立的"},"answer":["A","C"],"explanation":"下列劳动合同无效或者部分无效：\n（1）以欺诈、胁迫的手段或者乘人之危，使对方在违背真实意思的情况下订立\n或者变更劳动合同的；\n（2）用人单位免除自己的法定责任、排除劳动者权利的；\n（3）违反法律、行政法规强制性规定的。"},{"id":"q0353","chapter":"第8章","type":"multiple","stem":"根据我国劳动合同法律制度的规定，下列属于劳动合同必备条款的有（\n）。","options":{"A":"工作内容","B":"休息休假","C":"竞业限制","D":"工作地点"},"answer":["A","B","D"],"explanation":"选项C，属于可备条款。"},{"id":"q0354","chapter":"第8章","type":"multiple","stem":"根据劳动合同法律制度的规定，下列关于劳动报酬支付的表述中，正确的有\n（\n）。","options":{"A":"工资至少每月支付一次，实行周、日、小时工资制的，可按周、日、小时支付\n工资","B":"用人单位依法安排劳动者在日标准工作时间以外延长工作时间的，按照不低于\n劳动合同规定的劳动者本人小时工资标准的150%支付劳动者工资","C":"用人单位与劳动者约定的报酬支付日期遇节假日或休息日，应推迟在最近的工\n作日支付","D":"工资应当以法定货币支付，不得以实物及有价证券替代货币支付"},"answer":["A","B","D"],"explanation":"选项C，用人单位与劳动者约定的报酬支付日期遇节假日或休息日，应“提前”（而\n非延后）在最近的工作日支付。"},{"id":"q0355","chapter":"第8章","type":"multiple","stem":"根据劳动合同法律制度的规定，下列劳动合同中，不可以约定试用期的有\n（\n）。","options":{"A":"无固定期限劳动合同","B":"劳动合同期限不满3 个月的","C":"非全日制用工劳动合同","D":"以完成一定工作任务为期限的劳动合同"},"answer":["B","C","D"],"explanation":"选项A，3 年以上固定期限和无固定期限的劳动合同，试用期不得超过6 个月；\n选项B、C、D，期限不满3 个月、非全日制用工、以完成一定工作任务为期限\n的劳动合同，不得约定试用期。"},{"id":"q0356","chapter":"第8章","type":"multiple","stem":"甲公司与其职工对试用期期限的下列约定中，符合法律规定的有（\n）。","options":{"A":"夏某的劳动合同期限4 年，双方约定的试用期为4 个月","B":"周某的劳动合同期限1 年，双方约定的试用期为1 个月","C":"刘某的劳动合同期限2 年，双方约定的试用期为3 个月","D":"林某的劳动合同期限5 个月，双方约定的试用期为5 日"},"answer":["A","B","D"],"explanation":"劳动合同期限3 个月以上(含本数，下同)不满1 年的，试用期不得超过1 个月；\n劳动合同期限1 年以上不满3 年的，试用期不得超过2 个月；3 年以上固定期限\n和无固定期限的劳动合同，试用期不得超过6 个月。"},{"id":"q0357","chapter":"第8章","type":"multiple","stem":"根据劳动合同法律制度的规定，下列关于劳动合同履行和变更的表述中，正确\n的有（\n）。","options":{"A":"用人单位应当将直接涉及劳动者切身利益的规章制度和重大事项决定公示，或\n者告知劳动者","B":"用人单位发生合并或者分立等情况，原劳动合同不再继续履行","C":"以口头形式变更的劳动合同无效","D":"用人单位变更名称的，不影响劳动合同的履行"},"answer":["A","D"],"explanation":"选项B，用人单位发生合并或者分立等情况，原劳动合同继续有效，劳动合同由\n承继其权利和义务的用人单位继续履行；选项C，变更劳动合同应当采用书面形\n式，未采用书面形式，但已经实际履行了口头变更的劳动合同超过1 个月，且变\n更后的劳动合同内容不违反法律、行政法规、国家政策以及公序良俗，当事人以\n未采用书面形式为由主张劳动合同变更无效的，人民法院不予支持。"},{"id":"q0358","chapter":"第8章","type":"multiple","stem":"根据劳动合同法律制度的规定，劳动合同解除的下列情形中，用人单位应当\n向劳动者支付经济补偿的有（\n）。","options":{"A":"劳动者达到法定退休年龄，因退休解除劳动合同的","B":"用人单位因劳动者在试用期间被证明不符合录用条件而解除劳动合同的","C":"以完成一定工作任务为期限的劳动合同因任务完成而终止的","D":"用人单位向劳动者提出解除劳动合同并与劳动者协商一致的"},"answer":["C","D"],"explanation":"选项A，不需要向劳动者支付经济补偿；选项B，劳动者有过错或试用期被证明\n不符合录用条件属于用人单位随时通知解除的情形，用人单位无需支付经济补\n偿。"},{"id":"q0359","chapter":"第8章","type":"multiple","stem":"甲公司与刘某签订了2 年期限劳动合同。合同履行1 年时，刘某因自主创业\n而向甲公司提出解除劳动合同。根据劳动合同法律制度的规定，下列关于刘某单\n方解除劳动合同方式及后果的表述中，正确的有（\n）。","options":{"A":"刘某应向甲公司支付违约金","B":"刘某应提前3 日以书面形式通知甲公司","C":"刘某应提前30 日以书面形式通知甲公司","D":"甲公司不需向刘某支付经济补偿"},"answer":["C","D"],"explanation":"选项A，《劳动合同法》第二十五条明确规定，禁止用人单位对劳动合同“服务\n期”和“竞业限制”之外的其他事项与劳动者约定由劳动者承担违约金。本题未涉及\n服务期和竞业限制，因此不应支付违约金；选项B、C、D，劳动者在非试用期\n单方解除劳动合同的，应提前30 日以书面形式通知用人单位，且劳动者不能获\n得经济补偿。"},{"id":"q0360","chapter":"第8章","type":"multiple","stem":"根据我国劳动合同法律制度的规定，下列选项中，用人单位既不得解除劳动\n合同，也不得终止劳动合同，劳动合同应当续延至相应的情形消失时终止的有\n（\n）。","options":{"A":"张某疑似患上职业病，尚在医学观察期间","B":"李某怀有身孕，还有5 天即是预产期","C":"郝某非因工负伤，尚在医疗期内","D":"王某在甲公司连续工作满10 年，并且距离法定退休年龄已不足10 年"},"answer":["A","B","C"],"explanation":"选项D，用人单位不得解除和终止劳动合同需满足：在本单位连续工作满15 年，\n且距法定退休年龄不足5 年。"},{"id":"q0361","chapter":"第8章","type":"multiple","stem":"根据我国劳动合同法律制度的规定，甲公司提出并与韩某协商解除了劳动合\n同。关于甲公司解除劳动合同后果的下列表述中，正确的有（\n）。","options":{"A":"甲公司与韩某应当按照双方约定，办理工作交接","B":"甲公司应在解除劳动合同后15 日内为韩某办理档案和社会保险关系转移手续","C":"甲公司应为韩某出具解除劳动合同证明","D":"甲公司对韩某的劳动合同文本，至少保存2 年备查"},"answer":["A","B","C","D"],"explanation":"劳动合同解除的法律后果：劳动合同解除或终止的，用人单位应当在解除或者终\n止劳动合同时出具解除或者终止劳动合同的证明（选项C），并在15 日内为劳\n动者办理档案和社会保险关系转移手续（选项B）；劳动者应当按照双方约定，\n办理工作交接（选项A）；用人单位对已经解除或者终止的劳动合同文本，至少\n保存2 年备查（选项D）。"},{"id":"q0362","chapter":"第8章","type":"multiple","stem":"根据劳动争议调解仲裁法律制度的规定，下列劳动争议中，劳动仲裁机构作\n出的仲裁裁决，除劳动者提起诉讼外，该裁决为终局裁决的有（\n）。","options":{"A":"因执行国家的劳动标准在工作时间方面发生的争议","B":"因确认劳动关系发生的争议","C":"因订立劳动合同发生的争议","D":"追索赔偿金，不超过当地月最低工资标准12 个月金额的争议"},"answer":["A","D"],"explanation":"以下情况适用终局裁决：①追索劳动报酬、工伤医疗费、经济补偿或者赔偿金，\n不超过当地月最低工资标准12 个月金额的争议；②因执行国家的劳动标准在工\n作时间、休息休假、社会保险等方面发生的争议。选项A、D 正确。"},{"id":"q0363","chapter":"第8章","type":"multiple","stem":"下列关于医疗期的表述中，符合法律规定的有（\n）。","options":{"A":"实际工作年限不足10 年的，在本单位工作年限5 年以上的，医疗期为3 个月","B":"公休、假日和法定节日包括在医疗期内","C":"医疗期3 个月的，按6 个月内累计病休时间计算","D":"医疗期的计算从病休第一天开始，累计计算"},"answer":["B","C","D"],"explanation":"选项A，实际工作年限不足10 年的，在本单位工作年限5 年以上的，医疗期为\n6 个月。"},{"id":"q0364","chapter":"第8章","type":"multiple","stem":"伤残职工在停工留薪期内因工伤导致死亡的，其近亲属享受（\n）待遇。","options":{"A":"供养亲属抚恤金","B":"停工留薪期的工资","C":"丧葬补助金","D":"一次性工亡补助金"},"answer":["A","C","D"],"explanation":"职工因工死亡，或者伤残职工在停工留薪期内因工伤导致死亡的，其近亲属按照\n规定从工伤保险基金领取丧葬补助金、供养亲属抚恤金和一次性工亡补助金。"},{"id":"q0365","chapter":"第8章","type":"multiple","stem":"王某认定十级伤残，本人提出解除劳动合同，则王某可以领取（\n）。","options":{"A":"一次性工伤医疗补助金","B":"一次性伤残补助金","C":"伤残津贴","D":"一次性伤残就业补助金"},"answer":["A","B","D"],"explanation":"王某经鉴定委员会鉴定为十级伤残，且主动提出解除劳动合同，由工伤保险基金\n支付一次性工伤医疗补助金（选项A），由用人单位支付一次性伤残就业补助金\n（选项D）；职工因工致残被鉴定为一级至十级伤残的，从工伤保险基金按伤残\n等级支付一次性伤残补助金（选项B）；职工因工致残被鉴定为一级至六级伤残\n的，可以领取伤残津贴，王某的伤残等级为十级，故选项C 不当选。"},{"id":"q0366","chapter":"第8章","type":"multiple","stem":"根据社会保险法律制度的规定，下列关于失业保险待遇的享受条件中，正确\n的有（\n）。","options":{"A":"失业前用人单位和本人已经缴纳失业保险费满1 年的","B":"因用人单位转产解除劳动合同","C":"因本人意愿由劳动者解除劳动合同","D":"已经进行失业登记，并有求职要求的"},"answer":["A","B","D"],"explanation":"失业人员符合下列条件的，可以申请领取失业保险金并享受其他失业保险待遇：\n（1）失业前用人单位和本人已经缴纳失业保险费满1 年的。（2）非因本人意愿\n中断就业的，包括劳动合同终止；被用人单位解除劳动合同；被用人单位开除、\n除名和辞退；因用人单位过错由劳动者解除劳动合同；法律、行政法规规定的其\n他情形。（3）已经进行失业登记，并有求职要求的。"},{"id":"q0367","chapter":"第8章","type":"multiple","stem":"下列失业人员中不可再继续领取失业保险金的有（\n）。","options":{"A":"重新就业的","B":"依法享受基本养老保险待遇的","C":"服兵役的","D":"移民国外的"},"answer":["A","B","C","D"],"explanation":"失业人员在领取失业保险金期间有下列情形之一的，停止领取失业保险金，并同\n时停止享受其他失业保险待遇：重新就业的；应征服兵役的；移居境外的；享受\n基本养老保险待遇的；被判刑收监执行的；无正当理由，拒不接受当地人民政府\n指定部门或者机构介绍的适当工作或者提供培训的。"},{"id":"q0368","chapter":"第8章","type":"judge","stem":"用人单位与劳动者订立的劳动合同中劳动条件和劳动报酬等标准可以高于集\n体合同规定的标准。（\n）","options":{"A":"正确","B":"错误"},"answer":["A"],"explanation":"题目所述内容正确。集体合同中劳动报酬和劳动条件等标准不得低于当地人民政\n府规定的最低标准；用人单位与劳动者订立的劳动合同中劳动报酬和劳动条件等\n标准不得低于集体合同规定的标准。"},{"id":"q0369","chapter":"第8章","type":"judge","stem":"2030 年1 月1 日起，领取基本养老金的最低缴费年限由15 年逐步提高到20\n年。（\n）","options":{"A":"正确","B":"错误"},"answer":["A"],"explanation":"2030 年1 月1 日起，领取基本养老金的最低缴费年限由15 年逐步提高到20 年，\n每年提高6 个月，2039 年1 月1 日之后领取基本养老金的最低缴费年限为20 年。"},{"id":"q0370","chapter":"第8章","type":"judge","stem":"非全日制从业人员应当通过其用人单位参加职工基本养老保险，并与用人单位\n共同缴纳基本养老保险。（\n）","options":{"A":"正确","B":"错误"},"answer":["B"],"explanation":"无雇工的个体工商户、未在用人单位参加基本养老保险的非全日制从业人员以及\n其他灵活就业人员“可以”参加基本养老保险，由个人缴纳基本养老保险费。本题\n题干中“应当”的表述过于绝对，因此说法错误。"},{"id":"q0371","chapter":"第8章","type":"judge","stem":"个人死亡同时符合领取基本养老保险丧葬补助金、工伤保险丧葬补助金和失业\n保险丧葬补助金条件的，其遗属只能选择领取其中的一项。（\n）","options":{"A":"正确","B":"错误"},"answer":["A"],"explanation":"题目所述内容正确。\n不定项\n不定项选择题"},{"id":"q0372","chapter":"第8章","type":"judge","stem":"甲公司相关资料如下：\n（1）2025 年1 月甲公司一批会计档案保管期满。其中有尚未结清的债权债务原\n始凭证。甲公司档案管理机构请会计机构负责人张某及相关人员在会计档案销毁\n清册上签署意见，将该批会计档案全部销毁。\n（2）2025 年9 月出纳郑某调岗，与接替其工作的王某办理了会计工作交接。\n（3）2025 年12 月为完成利润指标，会计机构负责人张某采取虚增营业收入等\n方法，调整了财务会计报告，并经单位负责人周某同意，向乙公司提供了未经审\n计的财务会计报告。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n关于甲公司销毁会计档案的下列表述中，正确的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["A","B","C"],"explanation":"单位负责人、档案管理机构负责人、会计管理机构负责人、档案管理机构经办人、\n会计管理机构经办人在会计档案销毁清册上签署意见，选项A、B 正确，选项D\n错误；保管期满但未结清的债权债务会计凭证和涉及其他未了事项的会计凭证不\n得销毁，选项C 正确。\n第2 小题\n下列关于会计人员郑某与王某交接会计工作的表述中，正确的是（\n）。\nA.移交完毕，王某可自行另立新账进行会计记录\nB.应由会计机构负责人张某监交\nC.郑某与王某应按移交清册逐项移交，核对点收\nD.移交完毕，郑某与王某以及监交人应在移交清册上签名或盖章"},{"id":"q0373","chapter":"第8章","type":"judge","stem":"甲企业为国有工业生产企业，其会计相关工作情况如下：\n（1）由于业务调整，安排会计机构负责人王某的同学的女儿小王担任出纳，登\n记库存现金、银行存款日记账、费用明细账以及会计档案保管。\n（2）单位招聘一名管理会计人员小赵，已知小赵已从事会计工作3 年，但因交\n通肇事罪被判处有期徒刑，现已刑满释放满1 年。\n（3）往来会计小李由于个人原因离职，与小孙进行了会计工作交接，由单位会\n计机构负责人监交。小孙接替之后为了分清责任，将原账簿保存好之后另立账簿\n进行接手之后会计事项的记录。后发现小李任职期间存在账目问题，小李与小孙\n之间相互推卸责任。\n（4）税务部门发现报税资料存在疑点，因此派专员到甲企业进行调查，遭到甲\n企业拒绝，甲企业认为只有财政部门有权对本企业进行监管。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n根据资料（1），下列表述错误的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["B","C"],"explanation":"出纳人员不得兼管稽核、会计档案保管（选项B）和收入、支出、费用（选项C）、\n债权债务账目的登记工作。\n第2 小题\n根据资料（2），下列表述正确的是（\n）。\nA.小赵因被追究过刑事责任，不得再从事会计工作\nB.小赵刑满释放只满1 年，未满5 年不得从事会计工作\nC.小赵可以担任甲企业会计人员\nD.小赵的刑满释放时间不影响小赵能否从事会计工作"},{"id":"q0374","chapter":"第8章","type":"judge","stem":"95 万元。该生产设备既用于生产应税药品，又用于生产免税药品。\n（5）购进一批盐酸，取得增值税专用发票注明税额39 万元；该批盐酸共用于应\n税药品及免税药品的生产，无法划分进项税额；生产的药品当月全部销售，其中\n应税药品销售额400 万元（不含增值税），免税药品销售额200 万元。\n（6）销售自产500 箱W 型感冒药，其中300 箱不含增值税单价1.6 万元/箱，\n200 箱不含增值税单价1.4 万元/箱，共取得不含增值税销售额760 万元；另将自\n产100 箱W 型感冒药无偿转让给M 医院临床使用，该批感冒药不含增值税市场\n单价为1.52 万元/箱。\n已知：销售货物增值税税率为13%；购进用于生产9%税率货物的农产品，按照\n9%的扣除率计算进项税额。甲制药厂取得的扣税凭证均符合抵扣规定。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n计算甲制药厂当月收购金银花准予抵扣进项税额的下列算式中，正确的是\n（\n）。","options":{"A":"正确","B":"错误"},"answer":["B"],"explanation":"（1）购进农产品取得（开具）农产品销售发票或者收购发票的，进项税额＝买\n价×扣除率，选项A、C 错误；（2）因管理不善造成的非正常损失，对应的进项\n税额（30%）不得抵扣，选项D 错误，选项B 正确。\n第2 小题\n甲制药厂下列进项税额中，不得从销项税额中抵扣的是（\n）。\nA.生产设备的进项税额40.95 万元\nB.移动硬盘的进项税额1.95 万元\nC.运输原材料的进项税额0.15 万元\nD.原材料的进项税额0.18 万元"},{"id":"q0375","chapter":"第8章","type":"judge","stem":"甲公司为增值税一般纳税人，2 月有关经营情况如下：\n（1）委托加工收回一批A 产品，20%用于个人消费，50%作为继续加工B 产品的\n原材料，10%无偿转让给乙公司，剩余部分全部作为办公物资。\n（2）向丙公司出租Y 型设备5 台，从2 月开始起租，租赁期1 个月，每台设备\n含增值税租金135 600 元/月。甲公司收取5 台设备含增值税租金678 000 元，\n支付设备维护费16 000 元。\n（3）进口一辆小汽车用于日常生产经营活动，海关确定的关税计税价格为200\n000 元，已缴纳关税30 000 元，已缴纳消费税12 105.26 元。\n（4）购进生产原材料，取得增值税专用发票注明税额104 000 元，当月因自然\n灾害造成该批原材料毁损50%；购进管理部门办公用物资，取得增值税专用发票\n注明税额26 000 元；购进用于职工福利的货物，取得增值税专用发票注明税额\n6 500 元；购进并直接用于消费的餐饮服务，取得增值税普通发票注明税额900\n元；因公司业务需要购进国内旅客运输服务，取得增值税电子普通发票注明税额\n9 000 元。\n已知：销售货物增值税税率为13%，有形动产租赁服务增值税税率为13%，进口\n货物增值税税率为13%。\n要求：根据上述资料，不考虑其他因素，回答下列小题。\n第1 小题\n根据资料（1），下列属于视同应税交易的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["A","C"],"explanation":"选项B、D，将委托加工收回的货物用于正常的生产经营，不属于视同应税交易\n情形。\n第2 小题\n根据资料（2），计算甲公司出租Y 型设备当月增值税销项税额的下列算式中，\n正确的是（\n）。\nA.（678 000－16 000）×13%＝86 060（元）\nB.678 000×13%＝88 140（元）\nC.（678 000－16 000）÷（1＋13%）×13%＝76 159.29（元）\nD.678 000÷（1＋13%）×13%＝78 000（元）"},{"id":"q0376","chapter":"第8章","type":"judge","stem":"根据资料（4），甲公司当月可以从销项税额中抵扣的进项税额合计为（\n）。","options":{"A":"正确","B":"错误"},"answer":["A"],"explanation":"根据资料（4）对应的业务，分析如下：（1）购进用于集体福利的货物对应的进\n项税额（6 500 元）、购进并直接用于消费的餐饮服务对应的进项税额（900 元），\n均不得从销项税额中抵扣；（2）因自然灾害造成货物毁损，对应进项税额准予\n抵扣；（3）纳税人购进国内旅客运输服务取得增值税电子普通发票的，按照发\n票上注明的税额抵扣进项；（4）甲公司当月可以从销项税额中抵扣的进项税额\n＝104 000＋26 000＋9 000＝139 000（元）。"},{"id":"q0377","chapter":"第8章","type":"judge","stem":"甲公司为增值税一般纳税人，主要从事洗衣机的生产和销售业务。1 月有关经\n营情况如下：\n（1）购进一批生产用零部件，取得增值税专用发票注明税额260 000 元。\n（2）购进一批生产工具，取得增值税专用发票注明税额1 040 元；因管理不善，\n该批工具当月全部被盗。\n（3）购进并直接用于消费的居民日常服务，取得增值税普通发票注明税额1 200\n元。\n（4）购进与生产经营有关的住宿服务，取得增值税专用发票注明税额300 元。\n（5）购进国内旅客运输服务，取得注明员工身份信息的航空运输电子客票行程\n单，票价共计21 800 元；取得公路客票，票面金额共计3 090 元，其中有309\n元的客票没有注明员工身份信息。\n（6）采取折扣方式销售M 型洗衣机300 台，含增值税单价5 650 元/台，折扣\n额565 元/台，销售额与折扣额在同一张发票上的“金额”栏分别注明；另收取洗\n衣机的包装物押金67 800 元，约定3 个月后返还包装物押金。\n（7）采取以旧换新方式销售N 型洗衣机400 台，含增值税单价4 520 元/台，旧\n洗衣机折价339 元/台。\n已知：增值税税率为13%；航空旅客运输服务按9%计算进项税额；公路旅客运输\n服务按3%计算进项税额；甲公司取得的扣税凭证均符合抵扣规定。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n甲公司的下列进项税额中，准予从销项税额中抵扣的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["C","D"],"explanation":"（1）选项A，购进并直接用于消费的餐饮服务、居民日常服务和娱乐服务，购\n进贷款服务的利息支出和直接相关的费用支出，其对应的进项税额不得从销项税\n额中抵扣；（2）选项B，因管理不善损失的购进货物，不得抵扣进项税额。\n第2 小题\n计算甲公司当月购进国内旅客运输服务准予抵扣进项税额的下列算式中，正确的\n是（\n）。\nA.21 800×9%＋3 090×3%＝2 054.7（元）\nB.21 800×9%＋（3 090－309）×3%＝2 045.43（元）\nC.21 800÷（1＋9%）×9%＋3 090÷（1＋3%）×3%＝1 890（元）\nD.21 800÷（1＋9%）×9%＋（3 090－309）÷（1＋3%）×3%＝1 881（元）"},{"id":"q0378","chapter":"第8章","type":"judge","stem":"甲公司为增值税一般纳税人，主要从事化妆品的生产和销售业务，2026 年3\n月有关经营情况如下：\n（1）销售自产高档美容类化妆品，取得不含增值税销售额3 000 000 元。\n（2）将100 套自产高档美容类化妆品无偿赠送客户，当月同类化妆品不含增值\n税市场价格为1 000 元/套。\n（3）将40 套自产高档护肤类化妆品奖励给公司优秀员工，当月同类化妆品不含\n增值税市场价格为500 元/套。\n（4）购进料酒用于职工食堂，取得增值税专用发票注明税额65 元。\n（5）受托为丙公司加工一批高档修饰类化妆品，收取加工费开具增值税专用发\n票，注明金额250 000 元（其中包括收取的代垫辅助材料成本4 000 元）、税额\n32 500 元，丙公司提供材料成本600 000 元，甲公司无同类化妆品销售价格。\n（6）进口一批成套化妆品，海关确定关税计税价格935 000 元，取得海关进口\n增值税专用缴款书。\n已知：销售高档化妆品增值税税率为13%，消费税税率为15%，关税税率为5%，\n甲公司取得的扣税凭证均符合抵扣规定。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n甲公司当月下列业务中，应缴纳消费税的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["A","B","D"],"explanation":"纳税人自产自用的应税消费品，用于连续生产应税消费品的，不纳税；凡用于其\n他方面（选项A、B）的，于移送使用时缴纳消费税。选项D，高档化妆品在生\n产销售环节，应当缴纳消费税。选项C，“料酒”不属于应税消费品，且为“购进行\n为”，不缴纳消费税。\n第2 小题\n计算甲公司当月受托加工高档修饰类化妆品应代收代缴消费税税额的下列算式\n中，正确的是（\n）。\nA.（600 000＋250 000＋32 500）×15%＝132 375（元）\nB.600 000×15%＝90 000（元）\nC.（600 000＋250 000－4 000）÷（1－15%）×15%＝149 294.12（元）\nD.（600 000＋250 000）÷（1－15%）×15%＝150 000（元）"},{"id":"q0379","chapter":"第8章","type":"judge","stem":"甲公司为增值税一般纳税人，主要从事涂料生产销售业务，2026 年1 月发生\n如下业务：\n（1）以直接销售方式销售自产W 型涂料取得含增值税销售额3 390 000 元，以\n预收货款方式销售自产W 型涂料，当月应收含增值税预收款2 260 000 元，涂\n料当月尚未发出，且甲公司未开具发票。\n（2）移送自产Y 型涂料500 桶用于和原材料供应商换取生产用原材料、100 桶\n用于本公司在建办公楼，50 桶用于赞助某电视台综艺节目组，10 桶用于客户样\n品试用，自产Y 型涂料当月含增值税平均售价为565 元/桶。\n（3）委托乙公司加工Z 型涂料，甲公司提供的材料成本为816 000 元，支付不\n含增值税加工费84 000 元，其中包含乙公司代垫辅助材料费用9 600 元，乙公\n司无同类涂料销售价格，乙公司加工完成后，甲公司于当月提货。\n（4）采用分期收款方式销售X 型涂料300 桶，含增值税售价为339 元/桶，合\n同约定本月应收取其中200 桶X 型涂料的销售款，但截止月底只收到100 桶X\n型涂料的销售款，甲公司未开具发票。\n已知：增值税税率为13%，涂料消费税税率为4%。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n计算甲公司销售自产W 型涂料当月应缴纳消费税税额下列算式中，正确的是\n（\n）。","options":{"A":"正确","B":"错误"},"answer":["A"],"explanation":"（1）以直接收款方式销售货物的，消费税纳税义务发生时间为收到销售款或取\n得索取销售款凭据的当天；以预收货款方式销售货物的，消费税纳税义务发生时\n间为货物发出的当天，涂料当月尚未发出，无须缴纳消费税。甲公司当月仅对以\n直接收款方式收取的销售额3 390 000 元缴纳消费税，据此可排除选项B、C。\n（2）销售额3 390 000 元含增值税，需作价税分离，因此甲公司销售自产W 型\n涂料当月应缴纳消费税税额＝含税销售额÷（1＋增值税税率）×消费税税率＝3\n390 000÷（1＋13%）×4%＝120 000（元）。\n第2 小题\n甲公司自产Y 型涂料用于下列业务中，应缴纳消费税的是（\n）。\nA.用于客户样品试用\nB.用于赞助某电视台综艺节目组\nC.用于甲公司在建办公楼\nD.换取生产用原料"},{"id":"q0380","chapter":"第8章","type":"judge","stem":"制胜公司为增值税一般纳税人，主要从事金银首饰、珠宝玉石相关的零售业务，\n2026 年2 月有关经营情况如下：\n（1）进口一批翡翠手镯，海关核定的关税计税价格为450 000 元。\n（2）零售春节套装25 套，每套含增值税售价为9 040 元，该套装由含增值税售\n价8 475 元的金手链与含增值税售价565 元的小礼品组成。\n（3）采取以旧换新方式零售一批金手链，该批金手链含增值税售价为169 000\n元，制胜公司实际收取的含增值税价款为90 400 元。\n（4）将一批金戒指分别用于广告样品、赞助影视剧的拍摄、奖励优秀员工和无\n偿赠送客户。\n已知：销售货物的增值税税率为13%；进口翡翠手镯的关税税率为10%；生产销\n售珠宝玉石的消费税税率为10%；零售金首饰的消费税税率为5%。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n计算制胜公司进口翡翠手镯应缴纳消费税税额的下列算式中，正确的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["C"],"explanation":"（1）纳税人进口应税消费品，按照组成计税价格和规定的税率计算应纳消费税\n税额；（2）组成计税价格＝（关税计税价格＋关税）÷（1－消费税比例税率）\n＝（450 000＋450 000×10%）÷（1－10%）＝550 000（元）；（3）制胜公司进\n口翡翠手镯应缴纳消费税税额＝组成计税价格×消费税比例税率＝550 000×10%\n＝55 000（元）。\n第2 小题\n计算制胜公司零售春节套装应缴纳消费税税额的下列算式中，正确的是（\n）。\nA.25×9 040÷（1＋13%）×5%＝10 000（元）\nB.25×8 475×5%＝10 593.75（元）\nC.25×（8 475－565）÷（1＋13%）×5%＝8 750（元）\nD.25×9 040×5%＝11 300（元）"},{"id":"q0381","chapter":"第8章","type":"judge","stem":"甲企业为生产电器的居民企业。2025 年有关收支情况如下：\n（1）取得产品销售收入4 000 万元，特许权使用费收入100 万元，国债利息收\n入50 万元，接受捐赠收入100 万元。\n（2）业务招待费支出50 万元，广告费支出500 万元。\n（3）支付司法机关罚金20 万元，支付给客户的违约金10 万元。\n（4）直接向某希望小学捐款100 万元；计提准备金50 万元，未经税务机关核\n定。\n（5）其他可在企业所得税税前扣除的成本、费用、税金合计2 000 万元。\n已知：在计算企业所得税应纳税所得额时，业务招待费支出按实际发生额的60%\n扣除，但最高不得超过当年销售（营业）收入的5‰；广告费、业务宣传费支出，\n不超过当年销售（营业）收入15%的部分，允许税前扣除。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n甲企业下列收入中，应计入企业所得税应纳税所得额的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["A","B","D"],"explanation":"选项C，国债利息收入属于免税收入，不计入企业所得税应纳税所得额。\n第2 小题\n甲企业在计算2025 年度应纳税所得额时，下列关于业务招待费和广告费准予扣\n除数额的表述中，正确的是（\n）。\nA.业务招待费准予扣除的数额为20.5 万元\nB.业务招待费准予扣除的数额为30 万元\nC.广告费准予扣除的数额为500 万元\nD.广告费准予扣除的数额为615 万元"},{"id":"q0382","chapter":"第8章","type":"judge","stem":"甲公司为我国居民企业，主要从事家具的生产和销售，2025 年度有关经营情\n况如下：\n（1）取得家具销售收入8 000 万元。\n（2）取得国债利息收入5 万元，持有乙机械公司债券取得利息收入3 万元，投\n资未上市的居民企业丙公司取得股息、红利1618 万元。\n（3）确实无法偿付的应付款项1.5 万元。\n（4）发生符合条件的广告费和业务宣传费支出1 800 万元。\n（5）当年3 月向丁设备公司借入500 万元的生产用资金，期限6 个月，年利率\n9%，金融企业同期同类贷款年利率为4.86%。该笔利息费用已支付。\n（6）库房中的一批油漆因管理不善造成被盗，该批油漆账面成本为6 万元，购\n进时已抵扣进项税额0.78 万元，该损失由责任人赔偿5 万元。\n已知：符合条件的广告费和业务宣传费支出，不超过当年销售（营业）收入15%\n的部分，准予扣除。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n在计算甲公司2025 年度企业所得税应纳税所得额时，准予扣除的广告费和业务\n宣传费支出为（\n）万元。","options":{"A":"正确","B":"错误"},"answer":["B"],"explanation":"广告费和业务宣传费按实际发生额（待抵扣金额）和税法规定的扣除限额孰低扣\n除。（1）广宣费的扣除限额为当年销售（营业）收入的15%：8000×15%＝1 200\n（万元）；（2）扣除限额1 200 万元＜实际发生额1 800 万元，因此甲公司2025\n年度准予扣除的广宣费为1 200 万元。\n第2 小题\n计算甲公司2025 年度企业所得税应纳税所得额时，准予扣除的借款利息费用的\n下列算式中，正确的是（\n）。\nA.500×4.86%＝24.3（万元）\nB.500×9%＝45（万元）\nC.500×4.86%÷12×6＝12.15（万元）\nD.500×9%÷12×6＝22.5（万元）"},{"id":"q0383","chapter":"第8章","type":"judge","stem":"甲公司为居民企业，同时是一家符合条件的集成电路（或工业母机）企业，\n2025 年有关经营情况如下：\n（1）取得销售货物收入8 000 万元，厂房租赁收入100 万元，国债利息收入10\n万元，接受捐赠收入20 万元。\n（2）直接向受灾地区捐赠5 万元；通过省级人民政府向科学事业捐赠200 万元。\n（3）开展研发活动发生未形成无形资产的研发支出500 万元。\n（4）当年实现会计利润3 000 万元。\n已知：企业当年发生以及以前年度结转的公益性捐赠支出，不超过年度利润总额\n12%的部分，准予在计算企业所得税应纳税所得额时扣除。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n甲公司2025 年取得的下列收入中，应计入企业所得税应纳税所得额的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["A","B","D"],"explanation":"应计入企业所得税应纳税所得额的收入，可理解为“应税收入”。选项A、B、D，\n均属于应税收入，因此当选；选项C，国债利息收入属于免税收入，不计入应纳\n税所得额。\n第2 小题\n甲公司当年发生的公益性捐赠支出，在计算企业所得税应纳税所得额时，允许扣\n除的金额为（\n）万元。\nA.200\nB.360\nC.365\nD.205"},{"id":"q0384","chapter":"第8章","type":"judge","stem":"中国公民王某为境内甲公司研发人员，其独生子正在读小学。2025 年王某有\n关收支情况如下：\n（1）每月工资、薪金所得22 000 元，每月缴纳的基本养老保险费、基本医疗保\n险费、失业保险费、住房公积金3 900 元。1－11 月工资、薪金所得累计已预扣\n预缴个人所得税税额8 590 元。\n（2）为乙公司提供技术服务，取得一次性劳务报酬5 000 元。\n（3）购买福利彩票，取得一次中奖收入3 000 元。\n（4）网约车充值获赠价值2 500 元的返券。\n（5）储蓄存款利息收入1 750 元。\n（6）将一套住房出租，全年租金收入37 200 元。\n已知：工资、薪金所得预扣预缴个人所得税减除费用为5 000 元/月；综合所得\n减除费用为60 000 元；子女教育专项附加扣除标准为2 000 元/月（由王某按扣\n除标准的100%扣除）；劳务报酬所得个人所得税预扣率为20%，每次收入4 000\n元以上的，减除费用按20%计算；劳务报酬所得在计入综合所得时以收入减除20%\n的费用后的余额为收入额。\n个人所得税预扣率表（部分）\n（居民个人工资、薪金所得预扣预缴适用）\n个人所得税税率表（部分）\n（综合所得适用）\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n计算王某12 月份工资、薪金所得应预扣预缴个人所得税税额的下列算式中，正\n确的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["D"],"explanation":"居民个人工资薪金所得应当按照累计预扣法计算预扣税款，累计预扣预缴应纳税\n所得额＝累计收入－累计免税收入－累计减除费用－累计专项扣除－累计专项\n附加扣除－累计依法确定的其他扣除＝22 000×12－5 000×12－3 900×12－2\n000×12＝133 200（元）﹔本期应预扣预缴税额＝（累计预扣预缴应纳税所得额\n×预扣率－速算扣除数）－累计减免税额－累计已预扣预缴税额＝133 200×10%\n－2 520－8 590＝2 210（元）。\n第2 小题\n计算王某一次性劳务报酬应预扣预缴个人所得税税额的下列算式中，正确的是\n（\n）。\nA.5 000×（1－20%）×20%＝800（元）\nB.5 000÷（1－20%）×20%＝1 250（元）\nC.5 000×20%＝1 000（元）\nD.5 000×20%×20%＝200（元）"},{"id":"q0385","chapter":"第8章","type":"judge","stem":"甲出版社为中国境内居民企业。2026 年1 月从该出版社取得所得的有关人员\n资料及所得情况如下：\n（1）雇员何某税前工资14 200 元，专项扣除2 602 元。何某为独生子，其父母\n均已年满60 周岁；何某的女儿现就读小学二年级，子女教育专项附加扣除由何\n某按扣除标准的100%扣除。\n（2）与雇员何某签订租赁合同，承租何某的一处住房作为员工宿舍，合同约定\n每月租金5 000 元。\n（3）购得漫画师郑某设计的标识的使用权，支付特许权使用费130 000 元。\n（4）出版高校教师张某的绘画作品，支付稿酬7 200 元。\n已知：工资、薪金所得预扣预缴个人所得税累计减除费用为每月5 000 元；子女\n教育专项附加扣除按照每个子女每月2 000 元的标准定额扣除，赡养老人专项附\n加扣除按照每月3 000 元的标准定额扣除；特许权使用费所得预扣预缴个人所得\n税每次收入4 000 元以上的，减除费用按20%计算；稿酬所得预扣预缴个人所得\n税每次收入4 000 元以上的，减除费用按20%计算，收入额减按70%计算；稿酬\n所得、特许权使用费所得适用20%的比例预扣率。工资、薪金所得累计预扣预缴\n应纳税所得额不超过36 000 元的，预扣率为3%；应纳税所得额超过36 000 元至\n144 000 元的部分，预扣率为10%，速算扣除数为2 520。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n计算何某2026 年1 月工资、薪金所得应预扣预缴个人所得税税额的下列算式中，\n正确的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["C"],"explanation":"（1）累计预扣预缴应纳税所得额＝累计收入－累计免税收入－累计减除费用－\n累计专项扣除－累计专项附加扣除－累计依法确定的其他扣除＝14 200－5 000\n－2 602－3 000－2 000＝1 598（元），因此适用的预扣率为3%；（2）1 月应预\n扣预缴税额＝（累计预扣预缴应纳税所得额×预扣率－速算扣除数）－累计减免\n税额－累计已预扣预缴税额＝1 598×3%＝47.94（元）。\n第2 小题\n计算郑某特许权使用费所得应预扣预缴个人所得税税额的下列算式中，正确的是\n（\n）。\nA.130 000÷（1－20%）×20%＝32 500（元）\nB.130 000×（1＋20%）×20%＝31 200（元）\nC.130 000×20%＝26 000（元）\nD.130 000×（1－20%）×20%＝20 800（元）"},{"id":"q0386","chapter":"第8章","type":"judge","stem":"中国公民张某为境内甲公司技术人员，2025 年5 月有关收支情况如下：\n（1）取得境内A 上市公司非限售股股息6 000 元，该股票于当月转让，持有期\n限为5 个月。\n（2）出租住房，取得不含税租金收入3 000 元，发生相关税费168 元，修缮费\n2 000 元。\n（3）取得企业债券利息3 000 元；取得机动车保险赔偿款40 000 元；参加有奖\n竞赛活动取得奖金2 000 元；电台抽奖获得价值5 000 元免费旅游一次。\n（4）花费8 000 元购买体育彩票，中奖20 000 元。\n已知：利息、股息、红利所得个人所得税税率为20%；偶然所得个人所得税税率\n为20%；个人出租住房个人所得税暂减按10%的税率征收，每次收入不超过4 000\n元的，减除费用800 元。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n张某当月非限售股息所得应缴纳个人所得税（\n）。","options":{"A":"正确","B":"错误"},"answer":["D"],"explanation":"个人从公开发行和转让市场取得的上市公司股票，持股期限在1 个月以内（含1\n个月）的，其股息红利所得全额计入应纳税所得额；持股期限在1 个月以上至1\n年（含1 年）的，暂减按50%计入应纳税所得额。本题张某持股期限为5 个月，\n取得的6 000 元股息减按50%计入应纳税所得额，张某当月非限售股息所得应缴\n纳个人所得税税额＝6 000×50%×20%＝600（元）。\n第2 小题\n张某出租住房应缴纳个人所得税（\n）。\nA.3 000×10%＝300（元）\nB.（3 000－168－800）×10%＝203.2（元）\nC.（3 000－168－800－800）×10%＝123.2（元）\nD.（3 000－168－800－2 000）×10%＝3.2（元）"},{"id":"q0387","chapter":"第8章","type":"judge","stem":"2024 年10 月12 日，王某到甲公司应聘工作，10 月15 日，王某开始在甲公\n司工作，10 月20 日双方订立了书面劳动合同，合同约定：合同期限3 年（不包\n含试用期），试用期3 个月；试用期月工资2 400 元，试用期满月工资3 000 元；\n试用期内王某若严重违反公司规章制度，甲公司可随时通知其解除劳动合同。\n2025 年8 月甲公司派王某去德国接受2 个月的高级技术培训，双方补充协议约\n定：公司支付培训费用100 000 元，王某的服务期为5 年，违反服务期约定应支\n付违约金100 000 元，培训结束后月工资提高至6 000 元。王某培训期满回国后\n成为公司的技术骨干，并与公司签订了竞业限制协议。\n2026 年3 月1 日，甲公司得知王某私下与乙公司也建立了劳动关系，遂要求王\n某解除与乙公司的劳动关系，王某拒绝并于次日离开甲公司到乙公司工作，由此\n给甲公司造成重大经济损失。\n已知：甲公司所在地月最低工资标准为2 000 元。\n要求：根据上述资料，不考虑其他因素，分析回答下列问题。\n第1 小题\n王某与甲公司之间劳动关系建立的时间是（\n）。","options":{"A":"正确","B":"错误"},"answer":["B"],"explanation":"用人单位自“用工之日”起即与劳动者建立劳动关系。\n第2 小题\n双方在劳动合同中对试用期所作的下列约定中，符合法律规定的是（\n）。\nA.试用期3 个月\nB.试用期内王某若严重违反公司规章制度，甲公司可随时通知其解除劳动合同\nC.试用期月工资2 400 元\nD.试用期不包含在劳动合同期限内"},{"id":"q0388","chapter":"第8章","type":"judge","stem":"2025 年1 月，甲公司与乙公司签订劳务派遣协议，派遣刘某到乙公司从事临\n时性工作，期间刘某曾被乙公司派遣至丙公司（乙公司的子公司）工作15 天。\n2025 年5 月，临时性工作结束。两公司未再给刘某安排工作，也未再向其支付\n任何报酬，2025 年7 月，刘某得知自2025 年1 月被派遣以来，两公司均未为其\n缴纳社会保险费，遂提出解除劳动合同。\n要求：根据上述资料，不考虑其他因素，分析回答下列问题。\n第1 小题\n下列关于劳务派遣产生的法律关系的表述中，正确的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["A","C"],"explanation":"用人单位（甲公司）与劳动者建立劳动关系。用工单位不得将被派遣劳动者再派\n遣到其他用人单位。\n第2 小题\n下列关于刘某无工作期间报酬待遇的表述中，正确的是(\n)。\nA.刘某不享受报酬\nB.乙公司应按月向其支付报酬\nC.刘某报酬待遇的标准为支付单位所在地的最低工资标准\nD.甲公司应按月向其支付报酬"},{"id":"q0389","chapter":"第8章","type":"judge","stem":"2024 年3 月1 日，甲公司聘请魏某为公司技术部门经理，双方在劳动合同中\n约定，劳动合同期限2 年，月工资9 000 元，魏某在职期间及离职后3 年内不得\n从事与甲公司相竞争的业务，公司在其离职后按月向其支付经济补偿3 500 元，\n若魏某违反该约定，则一次性向公司支付10 万元违约金。\n2026 年1 月，魏某在上班途中遭遇非本人主要责任交通事故受伤住院治疗，2026\n年2 月28 日，甲公司以劳动合同期满为由向仍在住院治疗的魏某提出终止劳动\n合同，魏某拒绝，双方发生争议。\n已知：魏某实际工作年限8 年，甲公司所在地月最低工资标准2 120 元。\n要求：根据上述资料。不考虑其他因素，分析回答下列问题。\n第1 小题\n甲公司与魏某约定的下列条款中，符合法律规定的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["B","C","D"],"explanation":"选项A，竞业限制期限，不得超过2 年；选项C，约定在职期间劳动者不得从事\n与甲公司相竞争的业务，不属于限制劳动者择业权的情形，符合法律规定。\n第2 小题\n魏某所受伤害及享受待遇的下列表述中，正确的是（\n）。\nA.魏某治疗期间，甲公司每月应按9 000 元的标准向其支付工资\nB.魏某伤情应当认定为工伤，享受工伤保险待遇\nC.魏某属于非因工负伤，应享受医疗期待遇\nD.魏某治疗期间，甲公司每月向其支付的工资福利待遇最低不得低于1 696 元"},{"id":"q0390","chapter":"第8章","type":"judge","stem":"2025 年2 月3 日，张某入职甲公司。当日甲公司代张某在P 银行申请开立代\n发工资的银行卡。\n（1）2025 年2 月10 日，张某在P 银行进行身份信息核验，将甲公司代为办理\n的工资卡升级为Ⅰ类户。\n（2）2025 年3 月，张某申请开通信用卡账户，额度为1 万元。\n（3）2025 年4 月，张某在自助机具另开立一个Ⅱ类个人银行结算账户。\n（4）2025 年5 月，张某在M 支付机构开立Ⅰ类支付账户。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n关于甲公司代张某开通银行卡的下列表述中，正确的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["A","B","C","D"],"explanation":"选项A、B，单位代理开立的个人银行账户，在被代理人持本人有效身份证件到\n开户银行办理身份确认、密码设（重）置等激活手续前，该银行账户只收不付；\n选项C、D，单位代理个人开立银行账户的，应提供单位证明材料、被代理人有\n效身份证件的复印件或影印件。\n第2 小题\n张某通过信用卡办理的下列业务中，符合规定的是（\n）。\nA.向其他个人信用卡转账\nB.向本人Ⅰ类个人银行结算账户转账\nC.提取现金\nD.向其他个人支付账户转账"},{"id":"q0391","chapter":"第8章","type":"judge","stem":"2025 年5 月10 日，甲公司向乙公司签发一张金额为50 万元，出票后1 个月\n付款的银行承兑汇票，经其开户银行P 银行承兑后交付乙公司。5 月15 日，乙\n公司将该票据背书转让给丙公司。5 月20 日，丙公司将该票据背书转让给丁公\n司，并在票据上记载“不得转让”字样；5 月25 日，丁公司在票据上记载“只有戊\n公司交货后，该背书转让方发生效力”的字样，将该票据背书转让给戊公司。6\n月12 日，戊公司向P 银行提示付款时，P 银行以甲公司存款不足为由拒绝付款。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n关于该票据当事人的下列表述中，正确的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["A","B","C","D"],"explanation":"票据的当事人包括：出票人、付款人、收款人、承兑人、背书人、被背书人、保\n证人。\n第2 小题\n下列票据当事人中，丙公司应对其承担保证付款责任的是（\n）。\nA.丁公司\nB.甲公司\nC.P 银行\nD.戊公司"},{"id":"q0392","chapter":"第8章","type":"judge","stem":"甲公司于2025 年10 月成立。为便于资金结算，向P 银行申请开立支票存款\n账户并领取支票。12 月5 日甲公司向乙公司签发并交付一张金额为50 万元的转\n账支票。12 月8 日乙公司将该支票背书转让给丙公司，并在支票上记载“不得转\n让”字样。12 月10 日丙公司又将该支票背书转让给丁公司。12 月12 日丁公司财\n务人员李某持该支票向开户银行Q 银行委托收款。12 月13 日Q 银行通过支票\n影像系统向P 银行提示付款，P 银行出具退票理由书拒绝付款，退票依据是甲公\n司存款余额不足。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n12 月5 日，甲公司签发支票时必须记载的事项是（\n）。","options":{"A":"正确","B":"错误"},"answer":["A","B","C"],"explanation":"签发支票必须记载以下事项：表明“支票”的字样；无条件支付的委托；确定的金\n额（选项A）；付款人名称（选项B）；出票日期（选项C）；出票人签章。选\n项D，出票地属于相对记载事项，支票未记载出票地的，出票地为出票人的营业\n场所、住所或经常居住地。\n第2 小题\n下列关于P 银行拒绝付款的行为分析，表述正确的是（\n）。\nA.P 银行的做法不合理，P 银行应当垫付票款，再向甲公司追索\nB.P 银行的做法不合理，P 银行应当将甲公司的存款余额全部支付给丁公司，其\n余票款则通知丁公司向甲公司追索\nC.P 银行的做法不合理，P 银行应当通知甲公司3 个工作日内补齐款项，款项补\n齐后再向丁公司支付票款\nD.P 银行做法合理，该支票属于空头支票，P 银行有权拒付"},{"id":"q0393","chapter":"第8章","type":"judge","stem":"2026 年1 月1 日，甲公司在M 银行开立基本存款账户。1 月10 日，甲公司\n财务人员王某向M 银行申请签发一张金额为100 万元的银行汇票，交予业务员\n张某到异地乙公司采购货物。\n2026 年1 月11 日，张某以甲公司的名义与乙公司签订了货物采购合同，采购货\n物金额为98 万元，与票面金额相差2 万元。乙公司发货后，张某在未填写实际\n结算金额的情况下，将汇票交付乙公司财务人员李某。\n2026 年2 月6 日，李某填写结算金额后，持该汇票到乙公司开户银行Q 银行提\n示付款。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n第1 小题\n下列关于王某办理银行汇票申请业务的表述中，正确的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["B","C","D"],"explanation":"选项A，申请人或者收款人为单位的，不得在“银行汇票申请书”上填明“现金”字\n样，王某代表甲公司申请银行汇票，用于向乙公司采购货物，收款人为乙公司，\n申请人为甲公司，出票银行（M 银行）不得为其签发现金银行汇票；选项B、C、\nD，申请人使用银行汇票，应向出票银行填写“银行汇票申请书”，填明收款人名\n称、汇票金额、申请人名称、申请日期等事项并签章，签章为其预留银行的签章。\n第2 小题\n关于张某以甲公司名义与乙公司签订货物采购合同行为性质的下列表述中，正确\n的是（\n）。\nA.该行为是单方行为\nB.该行为是消极行为\nC.该行为是积极行为\nD.该行为是多方行为"},{"id":"q0394","chapter":"第8章","type":"judge","stem":"个体工商户刘某经营一家社区超市，该超市于2026 年1 月12 日注册成立。\n1 月18 日刘某凭营业执照首次开立了银行结算账户，开户银行为P 银行。1 月\n20 日向M 支付机构申请开立了支付账户以及条码支付业务。为便于收款，在超\n市内布放了收款扫码机具。\n1 月25 日，王某在该超市购买一箱白酒，价格为1 200 元，使用本人M 支付机\n构支付账户余额，验证本人密码及绑定的指纹完成付款，次日又购买了一桶食用\n油，首次使用本人Q 银行结算账户通过M 支付机构完成付款。\n1 月28 日，经双方协商同意将王某购买的白酒退货退款。\n要求：根据上述资料，不考虑其他因素，分析回答下列小题。\n1 月18 日刘某在P 银行开立银行结算账户的下列表述中，正确的是（\n）。","options":{"A":"正确","B":"错误"},"answer":["A","B"],"explanation":"选项A、C，首次开立账户为基本存款账户；选项D，个体工商户凭营业执照以\n字号或经营者姓名开立的银行结算账户纳入单位银行结算账户管理。\n第2 小题\n1 月20 日支付机构为个体工商户刘某开立支付账户的下列表述中，正确的是\n（\n）。\nA.对个体工商户刘某实行实名制管理\nB.登记、验证、核对并留存个体工商户刘某身份基本信息\nC.建立个体工商户刘某唯一识别编码\nD.与个体工商户刘某签订支付账户业务限制协议"}];
const TYPE_NAME = {single:"单选题", multiple:"多选题", judge:"判断题", indefinite:"不定项/案例题"};
const STORAGE_KEY = "jingjifa_quiz_progress_v5_firestore_new_appid";
let app, auth, db, syncCode = "", unsub = null, isRemoteApplying = false, saveTimer = null, syncMode = "local";
let state = loadLocal();
let filtered = [];
let cursor = 0;
let selected = new Set();
let submitted = false;

function defaultState(){ return {version:5,currentId:null,done:{},wrong:{},fav:{},history:[],updatedAt:Date.now()}; }
function loadLocal(){ try { return Object.assign(defaultState(), JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")); } catch(e) { return defaultState(); } }
function saveLocal(){ state.updatedAt = Date.now(); localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function mergeProgress(a,b){ const out=defaultState(); out.currentId=(b&&b.currentId)||(a&&a.currentId)||null; for(const k of ["done","wrong","fav"]) out[k]=Object.assign({},a?.[k]||{},b?.[k]||{}); out.history=Array.from(new Set([...(a?.history||[]),...(b?.history||[])])); out.updatedAt=Math.max(a?.updatedAt||0,b?.updatedAt||0,Date.now()); return out; }
function safeCode(s){ return (s||"").trim().replace(/[\/#?\[\]]/g,"_").slice(0,64); }
function localSyncKey(){ return STORAGE_KEY + "_sync_" + safeCode(syncCode || "default"); }
function loadLocalSyncByCode(){
  if(!syncCode) return null;
  try { return JSON.parse(localStorage.getItem(localSyncKey()) || "null"); }
  catch(e) { return null; }
}
function saveLocalSyncByCode(){
  if(!syncCode) return;
  try { localStorage.setItem(localSyncKey(), JSON.stringify(state)); }
  catch(e) { console.warn("local sync save failed", e); }
}
function progressRef(){ return doc(db, "quizProgress", safeCode(syncCode)); }
function setStatus(msg, ok){ const el=document.getElementById("fbStatus"); el.textContent=msg; el.className="small "+(ok?"oktext":"danger"); }

async function loadFirebaseSdk(){
  if(initializeApp && getFirestore) return true;
  try {
    const appMod = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js");
    const authMod = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js");
    const fsMod = await import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js");
    initializeApp = appMod.initializeApp;
    getAuth = authMod.getAuth;
    signInAnonymously = authMod.signInAnonymously;
    getFirestore = fsMod.getFirestore;
    doc = fsMod.doc;
    getDoc = fsMod.getDoc;
    setDoc = fsMod.setDoc;
    onSnapshot = fsMod.onSnapshot;
    serverTimestamp = fsMod.serverTimestamp;
    return true;
  } catch(e) {
    console.warn("Firebase SDK load failed, using local sync mode", e);
    return false;
  }
}

async function saveCloudNow(){
  saveLocalSyncByCode();
  if(!db || !syncCode || isRemoteApplying) {
    if(syncCode) setStatus("本地同步已保存：" + safeCode(syncCode), true);
    return;
  }
  try {
    await setDoc(progressRef(), {app:"经济法刷题宝典",subject:"经济法",syncCode:safeCode(syncCode),progress:JSON.parse(JSON.stringify(state)),updatedAt:serverTimestamp()}, {merge:true});
    syncMode = "cloud";
    setStatus("云端已同步：" + new Date().toLocaleTimeString(), true);
  } catch(e) {
    syncMode = "local";
    saveLocalSyncByCode();
    setStatus("Firebase 不可用，已改用本地同步：" + (e.code||e.message||e), false);
  }
}
function scheduleSave(){ saveLocal(); saveLocalSyncByCode(); if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(saveCloudNow,400); }

async function initFirebase(){
  const ok = await loadFirebaseSdk();
  if(!ok) {
    syncMode = "local";
    setStatus("Firebase SDK 未加载，当前使用本地同步码模式", true);
    return false;
  }
  try {
    app=initializeApp(firebaseConfig);
    auth=getAuth(app);
    db=getFirestore(app);
    await signInAnonymously(auth);
    syncMode = "cloud";
    setStatus("Firebase 已初始化，等待输入同步码", true);
    return true;
  } catch(e) {
    syncMode = "local";
    db = null;
    setStatus("Firebase 初始化失败，当前使用本地同步码模式：" + (e.code||e.message||e), false);
    return false;
  }
}

async function connectSync(){
  syncCode=safeCode(document.getElementById("syncCode").value);
  if(!syncCode) return alert("请先输入或生成同步码");
  localStorage.setItem(STORAGE_KEY+"_syncCode", syncCode);

  const localByCode = loadLocalSyncByCode();
  if(localByCode) {
    state = mergeProgress(state, localByCode);
    saveLocal();
  }

  if(!db) await initFirebase();

  if(!db) {
    syncMode = "local";
    saveLocalSyncByCode();
    buildFiltered(false);
    render();
    updateStats();
    setStatus("已连接本地同步码：" + syncCode + "（Firebase 不可用）", true);
    return;
  }

  try {
    if(unsub) unsub();
    const snap=await getDoc(progressRef());
    if(snap.exists()&&snap.data().progress) {
