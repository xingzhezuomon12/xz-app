      state=mergeProgress(state,snap.data().progress);
      saveLocal();
      saveLocalSyncByCode();
      await saveCloudNow();
    } else {
      await saveCloudNow();
    }
    unsub=onSnapshot(progressRef(), s=>{
      if(!s.exists()||!s.data().progress) return;
      isRemoteApplying=true;
      state=mergeProgress(state,s.data().progress);
      saveLocal();
      saveLocalSyncByCode();
      isRemoteApplying=false;
      buildFiltered(false);
      render();
      updateStats();
      setStatus("云端更新已接收："+new Date().toLocaleTimeString(), true);
    }, err=>{
      syncMode = "local";
      saveLocalSyncByCode();
      setStatus("云端监听失败，已改用本地同步：" + (err.code||err.message||err), false);
    });
    syncMode = "cloud";
    setStatus("云同步码已连接：" + syncCode, true);
  } catch(e) {
    syncMode = "local";
    saveLocalSyncByCode();
    buildFiltered(false);
    render();
    updateStats();
    setStatus("云连接失败，已连接本地同步码：" + syncCode + "｜" + (e.code||e.message||e), false);
  }
}

function initControls(){ const chapters=["all",...Array.from(new Set(QUESTIONS.map(q=>q.chapter))).sort((a,b)=>(parseInt(a.match(/\d+/)?.[0]||999)-parseInt(b.match(/\d+/)?.[0]||999)))]; document.getElementById("chapterSel").innerHTML=chapters.map(c=>`<option value="${c}">${c==="all"?"全部章节":c}</option>`).join(""); document.getElementById("syncCode").value=localStorage.getItem(STORAGE_KEY+"_syncCode")||""; ["chapterSel","typeSel","modeSel"].forEach(id=>document.getElementById(id).addEventListener("change",()=>{buildFiltered(true);render();})); document.getElementById("searchBox").addEventListener("input",()=>{buildFiltered(true);render();}); document.getElementById("connectBtn").onclick=connectSync; document.getElementById("newCodeBtn").onclick=()=>{ const code="JF-"+Math.random().toString(36).slice(2,6).toUpperCase()+"-"+Date.now().toString().slice(-4); document.getElementById("syncCode").value=code; }; document.getElementById("restartBtn").onclick=()=>{buildFiltered(true);render();}; document.getElementById("resetLocalBtn").onclick=()=>{ if(confirm("确认清空本设备本地进度？云端不会删除。")){state=defaultState();saveLocal();buildFiltered(true);render();updateStats();} }; document.getElementById("resetCloudBtn").onclick=async()=>{ if(!syncCode) return alert("请先连接同步码"); if(confirm("确认清空当前同步码的进度？云端可用时会同步清空；云端不可用时清空本地同步码进度。")){state=defaultState();saveLocal();if(syncCode)localStorage.removeItem(localSyncKey());await saveCloudNow();buildFiltered(true);render();updateStats();} }; document.getElementById("exportBtn").onclick=()=>{ const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download="经济法刷题进度-"+(syncMode||"local")+"-"+(syncCode||"local")+".json"; a.click(); URL.revokeObjectURL(url); }; document.getElementById("submitBtn").onclick=submitAnswer; document.getElementById("nextBtn").onclick=nextQuestion; document.getElementById("prevBtn").onclick=prevQuestion; document.getElementById("showBtn").onclick=showAnswer; document.getElementById("favBtn").onclick=toggleFav; }
function textOf(q){ return [q.stem,Object.values(q.options).join(" "),q.explanation].join(" ").toLowerCase(); }
function buildFiltered(reset){ const ch=document.getElementById("chapterSel").value, ty=document.getElementById("typeSel").value, mode=document.getElementById("modeSel").value, kw=document.getElementById("searchBox").value.trim().toLowerCase(); filtered=QUESTIONS.filter(q=>(ch==="all"||q.chapter===ch)&&(ty==="all"||q.type===ty)&&(!kw||textOf(q).includes(kw))); if(mode==="wrong") filtered=filtered.filter(q=>state.wrong[q.id]); if(mode==="fav") filtered=filtered.filter(q=>state.fav[q.id]); if(mode==="unanswered") filtered=filtered.filter(q=>!state.done[q.id]); if(mode==="random") filtered=[...filtered].sort(()=>Math.random()-0.5); if(reset) cursor=0; else if(state.currentId){ const i=filtered.findIndex(q=>q.id===state.currentId); if(i>=0) cursor=i; } if(cursor>=filtered.length) cursor=Math.max(0,filtered.length-1); }
function currentQ(){ return filtered[cursor]; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function render(){ updateStats(); selected=new Set(); submitted=false; const q=currentQ(); document.getElementById("countPill").textContent=`共 ${QUESTIONS.length} 题｜当前筛选 ${filtered.length} 题`; document.getElementById("result").className="hidden"; if(!q){document.getElementById("stem").textContent="当前筛选条件下没有题目。";document.getElementById("options").innerHTML="";return;} state.currentId=q.id; scheduleSave(); document.getElementById("qType").textContent=TYPE_NAME[q.type]||q.type; document.getElementById("qChapter").textContent=q.chapter; document.getElementById("qIndex").textContent=`${cursor+1} / ${filtered.length}`; document.getElementById("qId").textContent=q.id; document.getElementById("stem").textContent=q.stem; const ans=state.done[q.id]?.selected||[]; if(ans.length&&state.done[q.id].submitted) selected=new Set(ans); document.getElementById("options").innerHTML=Object.entries(q.options).map(([k,v])=>`<button class="option ${selected.has(k)?"selected":""}" data-opt="${k}"><span class="letter">${k}</span><span>${escapeHtml(v)}</span></button>`).join(""); document.querySelectorAll(".option").forEach(btn=>btn.onclick=()=>choose(btn.dataset.opt)); document.getElementById("favBtn").textContent=state.fav[q.id]?"取消收藏":"收藏"; document.getElementById("bar").style.width=filtered.length?((cursor+1)/filtered.length*100)+"%":"0%"; if(ans.length&&state.done[q.id].submitted) showResult(state.done[q.id].correct,ans); }
function choose(opt){ const q=currentQ(); if(!q||submitted)return; if(q.type==="single"||q.type==="judge") selected=new Set([opt]); else { if(selected.has(opt)) selected.delete(opt); else selected.add(opt); } document.querySelectorAll(".option").forEach(btn=>btn.classList.toggle("selected",selected.has(btn.dataset.opt))); }
function eqSet(a,b){ a=[...a].sort(); b=[...b].sort(); return a.length===b.length&&a.every((x,i)=>x===b[i]); }
function submitAnswer(){ const q=currentQ(); if(!q)return; if(selected.size===0)return alert("请先选择答案"); const arr=[...selected].sort(); const correct=eqSet(arr,q.answer); submitted=true; state.done[q.id]={selected:arr,correct,submitted:true,time:Date.now()}; if(correct) delete state.wrong[q.id]; else state.wrong[q.id]={selected:arr,answer:q.answer,time:Date.now()}; state.history.push(q.id); showResult(correct,arr); scheduleSave(); updateStats(); }
function showAnswer(){ const q=currentQ(); if(!q)return; submitted=true; showResult(false,[...selected].sort(),true); }
function showResult(correct,arr,force){ const q=currentQ(); document.querySelectorAll(".option").forEach(btn=>{ const k=btn.dataset.opt; btn.classList.toggle("correct",q.answer.includes(k)); btn.classList.toggle("wrong",arr.includes(k)&&!q.answer.includes(k)); }); const div=document.getElementById("result"); div.className="result "+(correct?"ok":"bad"); div.innerHTML=`<b>${correct?"回答正确":(force?"参考答案":"回答错误")}</b><br>你的答案：${arr.length?arr.join("、"):"未选择"}<br>正确答案：${q.answer.join("、")}<div class="explain">${escapeHtml(q.explanation||"暂无解析")}</div>`; }
function nextQuestion(){ if(cursor<filtered.length-1){cursor++;render();} }
function prevQuestion(){ if(cursor>0){cursor--;render();} }
function toggleFav(){ const q=currentQ(); if(!q)return; if(state.fav[q.id]) delete state.fav[q.id]; else state.fav[q.id]=true; scheduleSave(); render(); updateStats(); }
function updateStats(){ const doneIds=Object.keys(state.done||{}); const right=doneIds.filter(id=>state.done[id]?.correct).length; document.getElementById("doneNum").textContent=doneIds.length; document.getElementById("wrongNum").textContent=Object.keys(state.wrong||{}).length; document.getElementById("favNum").textContent=Object.keys(state.fav||{}).length; document.getElementById("rightRate").textContent=doneIds.length?Math.round(right/doneIds.length*100)+"%":"0%"; const chapters=Array.from(new Set(QUESTIONS.map(q=>q.chapter))).sort((a,b)=>(parseInt(a.match(/\d+/)?.[0]||999)-parseInt(b.match(/\d+/)?.[0]||999))); document.getElementById("chapterStats").innerHTML=chapters.map(ch=>{ const all=QUESTIONS.filter(q=>q.chapter===ch).length; const d=QUESTIONS.filter(q=>q.chapter===ch&&state.done[q.id]).length; const w=QUESTIONS.filter(q=>q.chapter===ch&&state.wrong[q.id]).length; return `<div class="minirow"><span>${ch}</span><span>${d}/${all}｜错 ${w}</span></div>`; }).join(""); }
initControls(); buildFiltered(false); render(); initFirebase();
</script>
</body>
